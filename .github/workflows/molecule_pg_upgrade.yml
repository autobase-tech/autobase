---
name: Molecule pg_upgrade

on:
  schedule:
    - cron: "0 0 * * 6"

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'autobase-tech' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - distro: debian13
            tag: latest
            namespace: geerlingguy
          - distro: debian12
            tag: latest
            namespace: geerlingguy
          - distro: ubuntu2604
            tag: latest
            namespace: geerlingguy
          - distro: ubuntu2404
            tag: latest
            namespace: geerlingguy
          - distro: rockylinux10
            tag: latest
            namespace: geerlingguy
          - distro: rockylinux9
            tag: latest
            namespace: geerlingguy
          - distro: almalinux10
            tag: latest
            namespace: glillico
          - distro: almalinux9
            tag: latest
            namespace: glillico
# TODO: the PGDG repository URLs use "$releasever_major.$releasever_minor", and $releasever_minor
# is empty in these images, so dnf requests "rhel-10.-x86_64" and gets a 404 (pgdg-redhat-repo 42.0-69)
#          - distro: oraclelinux10
#            tag: latest
#            namespace: glillico
#          - distro: oraclelinux9
#            tag: latest
#            namespace: glillico
#          - distro: centosstream10
#            tag: latest
#            namespace: glillico
#          - distro: centosstream9
#            tag: latest
#            namespace: glillico

    steps:
      - name: Set TERM environment variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: make bootstrap-dev

      # The Ubuntu runner confines unix_chkpwd with an AppArmor profile that is attached by path,
      # so it also applies to the binary inside the RHEL containers. There /etc/shadow has mode 0000
      # and the profile does not allow CAP_DAC_OVERRIDE, so the PAM account check of sshd fails for
      # the postgres user, and rsync to the replicas fails with "connection unexpectedly closed".
      - name: Unload the AppArmor profile for unix_chkpwd
        run: |
          if [ -f /etc/apparmor.d/unix-chkpwd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd
          fi

      - name: Run Molecule tests for pg_upgrade
        run: make molecule-test-scenario
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          IMAGE_DISTRO: ${{ matrix.config.distro }}
          IMAGE_TAG: ${{ matrix.config.tag }}
          IMAGE_NAMESPACE: ${{ matrix.config.namespace }}
          MOLECULE_SCENARIO: "pg_upgrade"
