---
name: "Release and Publish"

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Set TERM environment variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: make bootstrap-dev

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update automation version references
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION_PATTERN="[0-9]\+\.[0-9]\+\.[0-9]\+"

          # Update galaxy.yml version
          sed -i "s/^version:.*/version: ${TAG}/" \
            automation/galaxy.yml

          # Update automation README version
          sed -i "s/version: ${VERSION_PATTERN}/version: ${TAG}/" \
            automation/README.md

          # Update the Platform automation image default in the public README
          sed -i "s/autobase\/automation:${VERSION_PATTERN}/autobase\/automation:${TAG}/g" \
            console/README.md

          # Keep public Platform deployment files in sync with the release
          for IMAGE in console_api console_ui console_db; do
            sed -i "s|autobase/${IMAGE}:${VERSION_PATTERN}|autobase/${IMAGE}:${TAG}|g" \
              console/docker-compose.yml console/docker-compose.ssl.yml
          done

      - name: Commit version changes to main branch
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add all changed files
          git add \
            automation/galaxy.yml \
            automation/README.md \
            console/README.md \
            console/docker-compose.yml \
            console/docker-compose.ssl.yml

          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: release ${TAG}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Build Ansible collection
        run: |
          cd automation
          ansible-galaxy collection build

      - name: Publish to Ansible Galaxy
        run: |
          cd automation
          ansible-galaxy collection publish \
            vitabaks-autobase-${{ steps.tag.outputs.tag }}.tar.gz \
            --token $ANSIBLE_GALAXY_TOKEN
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and Push release image
        if: ${{ env.DOCKER_REGISTRY_USER != '' && env.DOCKER_REGISTRY_PASSWORD != '' }}
        run: make docker-push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
