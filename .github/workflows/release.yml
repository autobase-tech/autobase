---
name: "Release and Publish"

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Set TERM environment variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: make bootstrap-dev

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set collection build version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          sed -i "s/^version:.*/version: ${TAG}/" automation/galaxy.yml

      - name: Build Ansible collection
        run: |
          cd automation
          ansible-galaxy collection build

      - name: Publish to Ansible Galaxy
        run: |
          cd automation
          ansible-galaxy collection publish \
            vitabaks-autobase-${{ steps.tag.outputs.tag }}.tar.gz \
            --token $ANSIBLE_GALAXY_TOKEN
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and Push release image
        if: ${{ env.DOCKER_REGISTRY_USER != '' && env.DOCKER_REGISTRY_PASSWORD != '' }}
        run: make docker-push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  update-console-version:
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Console image tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION_PATTERN='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ ! "${TAG}" =~ ^${VERSION_PATTERN}$ ]]; then
            exit 0
          fi

          # A rerun of an older release must not downgrade the default branch.
          CURRENT_TAG=$(sed -nE "s#^    image: autobase/console_api:(${VERSION_PATTERN})\$#\1#p" console/docker-compose.yml)
          if ! printf '%s\n' "${CURRENT_TAG}" "${TAG}" | sort -VC; then
            exit 0
          fi

          sed -Ei "s#(autobase/(console_api|console_ui|console_db|automation):)(${VERSION_PATTERN}|latest)#\1${TAG}#g" \
            console/docker-compose.yml console/docker-compose.ssl.yml console/README.md

          git add console/docker-compose.yml console/docker-compose.ssl.yml console/README.md
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: release ${TAG}"
            git push origin HEAD
          fi
