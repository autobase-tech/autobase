---
- name: Configure pg_tde (key provider and principal key)
  ansible.builtin.import_tasks: pg_tde.yml
  when:
    - enable_pg_tde | default(false) | bool
    - postgresql_distribution == "percona"
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  tags: postgresql_extensions, pg_tde

- name: Add extensions to the databases
  become: true
  become_user: postgres
  community.postgresql.postgresql_ext:
    name: "{{ item.ext | regex_replace('^pgvector', 'vector') }}"
    schema: "{{ item.schema | default(default_schema) }}"
    version: "{{ item.version | default(omit) }}"
    cascade: "{{ item.cascade | default(true) }}"
    login_db: "{{ item.db }}"
    login_host: "127.0.0.1"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_password: "{{ patroni_superuser_password }}"
    state: "{{ item.state | default('present') }}"
  ignore_errors: "{{ postgresql_extensions_ignore_errors | default(false) }}"
  loop: "{{ postgresql_extensions | flatten(1) }}"
  vars:
    default_schema: "{{ 'pg_catalog' if item.ext == 'pg_cron' else 'public' }}"
  when:
    - postgresql_extensions | default('') | length > 0
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  tags: postgresql_extensions
