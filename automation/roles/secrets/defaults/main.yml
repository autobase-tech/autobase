# yamllint disable rule:line-length
---
# An empty provider disables secret synchronization. Supported providers: aws.
secrets_provider: ""
secrets_prefix: "autobase/{{ patroni_cluster_name }}"

# Arbitrary secrets to create, update, or explicitly delete.
secrets_values: []
#  - name: postgresql/superuser
#    value: "{{ patroni_superuser_password }}"
#  - name: postgresql/replication
#    value: "{{ patroni_replication_password }}"
#  - name: patroni/restapi
#    value: "{{ patroni_restapi_password }}"
#  - name: patroni/etcd
#    value: "{{ patroni_etcd_password }}"
#  - name: pgbouncer/auth
#    value: "{{ pgbouncer_auth_password }}"
#  - name: integrations/obsolete-token
#    state: absent

secrets_export_postgresql_users: false # Export PostgreSQL users and passwords.
secrets_export_connection_info: false # Export connection addresses and ports.

# AWS Secrets Manager settings.
secrets_aws_region: "{{ server_location | default('us-west-2') }}"
secrets_aws_secret_type: "string"
secrets_aws_overwrite: true
secrets_aws_tags: "{{ cloud_provider_tags | default({'managed-by': 'autobase'}) }}"
# Optional settings are omitted when their value is null or empty.
secrets_aws_kms_key_id: ""
secrets_aws_resource_policy: null
secrets_aws_replica: null
secrets_aws_recovery_window: 30
secrets_aws_rotation_lambda: ""
secrets_aws_rotation_interval: null
secrets_aws_endpoint_url: ""
secrets_aws_ca_bundle: ""
secrets_aws_config: null
secrets_aws_validate_certs: true
secrets_aws_debug_botocore_endpoint_logs: null
