# yamllint disable rule:line-length
---
# AWS S3 bucket (if 'cloud_backup_provider=aws')
- name: "Set variable 'wal_g_json' for backup in AWS S3 bucket"
  ansible.builtin.set_fact:
    wal_g_json:
      - { option: "AWS_ACCESS_KEY_ID", value: "{{ wal_g_aws_access_key_id | default(lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID')) }}" }
      - { option: "AWS_SECRET_ACCESS_KEY", value: "{{ wal_g_aws_secret_access_key | default(lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY')) }}" }
      - { option: "WALG_S3_PREFIX", value: "{{ wal_g_s3_prefix | default('s3://' + (aws_s3_bucket_name | default(wal_g_default_cloud_bucket_name))) }}" }
      - { option: "AWS_REGION", value: "{{ wal_g_aws_region | default(aws_s3_bucket_region | default(server_location)) }}" }
      - { option: "WALG_COMPRESSION_METHOD", value: "{{ wal_g_compression_method | default('brotli') }}" }
      - { option: "WALG_DELTA_MAX_STEPS", value: "{{ wal_g_delta_max_steps | default('6') }}" }
      - { option: "WALG_DOWNLOAD_CONCURRENCY", value: "{{ wal_g_download_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_PREFETCH_DIR", value: "{{ wal_g_prefetch_dir_path | default(postgresql_home_dir + '/wal-g-prefetch') }}" }
      - { option: "WALG_UPLOAD_CONCURRENCY", value: "{{ wal_g_upload_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_UPLOAD_DISK_CONCURRENCY", value: "{{ wal_g_upload_disk_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "PGDATA", value: "{{ postgresql_data_dir }}" }
      - { option: "PGHOST", value: "{{ postgresql_unix_socket_dir | default('/var/run/postgresql') }}" }
      - { option: "PGPORT", value: "{{ postgresql_port | default('5432') }}" }
      - { option: "PGUSER", value: "{{ patroni_superuser_username | default('postgres') }}" }
  delegate_to: localhost
  run_once: true # noqa run-once
  no_log: true # do not output contents to the ansible log
  when: cloud_backup_provider | default(cloud_provider | default('')) | lower == 'aws'

# GCS Bucket (if 'cloud_backup_provider=gcp')
- name: "Set variable 'wal_g_json' for backup in GCS Bucket"
  ansible.builtin.set_fact:
    wal_g_json:
      - { option: "GOOGLE_APPLICATION_CREDENTIALS", value: "{{ wal_g_gs_key | default(postgresql_home_dir + '/gcs-key.json') }}" }
      - { option: "WALG_GS_PREFIX", value: "{{ wal_g_gs_prefix | default('gs://' + (gcp_bucket_name | default(wal_g_default_cloud_bucket_name))) }}" }
      - { option: "WALG_COMPRESSION_METHOD", value: "{{ wal_g_compression_method | default('brotli') }}" }
      - { option: "WALG_DELTA_MAX_STEPS", value: "{{ wal_g_delta_max_steps | default('6') }}" }
      - { option: "WALG_DOWNLOAD_CONCURRENCY", value: "{{ wal_g_download_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_PREFETCH_DIR", value: "{{ wal_g_prefetch_dir_path | default(postgresql_home_dir + '/wal-g-prefetch') }}" }
      - { option: "WALG_UPLOAD_CONCURRENCY", value: "{{ wal_g_upload_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_UPLOAD_DISK_CONCURRENCY", value: "{{ wal_g_upload_disk_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "PGDATA", value: "{{ postgresql_data_dir }}" }
      - { option: "PGHOST", value: "{{ postgresql_unix_socket_dir | default('/var/run/postgresql') }}" }
      - { option: "PGPORT", value: "{{ postgresql_port | default('5432') }}" }
      - { option: "PGUSER", value: "{{ patroni_superuser_username | default('postgres') }}" }
  no_log: true # do not output contents to the ansible log
  when: cloud_backup_provider | default(cloud_provider | default('')) | lower == 'gcp'

# Azure Blob Storage (if 'cloud_backup_provider=azure')
- name: Get Azure Storage Account key for backup configuration
  block:
    - name: "Azure: Get Storage Account info"
      azure.azcollection.azure_rm_storageaccount_info:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ (azure_backup_location | default(server_location | default('')))) }}"
        name: "{{ wal_g_azure_storage_account | default(azure_blob_storage_account_name | default(wal_g_default_azure_account_name)) }}"
        show_connection_string: true
      register: azure_storage_account_info

    - name: "Set variable: azure_storage_account_key"
      ansible.builtin.set_fact:
        azure_storage_account_key: "{{ azure_storage_account_info.storageaccounts[0].primary_endpoints.key }}"
      delegate_facts: true
  delegate_to: localhost
  become: false
  run_once: true # noqa run-once
  no_log: true
  when:
    - cloud_backup_provider | default(cloud_provider | default('')) | lower == 'azure'
    - wal_g_azure_storage_access_key is not defined

- name: "Set variable 'wal_g_json' for backup in Azure Blob Storage"
  ansible.builtin.set_fact:
    wal_g_json:
      - {
          option: "AZURE_STORAGE_ACCOUNT",
          value: "{{ wal_g_azure_storage_account | default(azure_blob_storage_account_name | default(wal_g_default_azure_account_name)) }}",
        }
      - {
          option: "AZURE_STORAGE_ACCESS_KEY",
          value: "{{ wal_g_azure_storage_access_key | default(hostvars['localhost']['azure_storage_account_key'] | default('')) }}",
        }
      - {
          option: "WALG_AZ_PREFIX",
          value: "{{ wal_g_az_prefix | default('azure://' + (azure_blob_storage_name | default(patroni_cluster_name + '-backup'))) }}",
        }
      - { option: "WALG_COMPRESSION_METHOD", value: "{{ wal_g_compression_method | default('brotli') }}" }
      - { option: "WALG_DELTA_MAX_STEPS", value: "{{ wal_g_delta_max_steps | default('6') }}" }
      - { option: "WALG_DOWNLOAD_CONCURRENCY", value: "{{ wal_g_download_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_PREFETCH_DIR", value: "{{ wal_g_prefetch_dir_path | default(postgresql_home_dir + '/wal-g-prefetch') }}" }
      - { option: "WALG_UPLOAD_CONCURRENCY", value: "{{ wal_g_upload_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_UPLOAD_DISK_CONCURRENCY", value: "{{ wal_g_upload_disk_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "PGDATA", value: "{{ postgresql_data_dir }}" }
      - { option: "PGHOST", value: "{{ postgresql_unix_socket_dir | default('/var/run/postgresql') }}" }
      - { option: "PGPORT", value: "{{ postgresql_port | default('5432') }}" }
      - { option: "PGUSER", value: "{{ patroni_superuser_username | default('postgres') }}" }
  no_log: true # do not output contents to the ansible log
  when: cloud_backup_provider | default(cloud_provider | default('')) | lower == 'azure'

# DigitalOcean Spaces Object Storage (if 'cloud_backup_provider=digitalocean')
- name: "Set variable 'wal_g_json' for backup in DigitalOcean Spaces Object Storage"
  ansible.builtin.set_fact:
    wal_g_json:
      - { option: "AWS_ACCESS_KEY_ID", value: "{{ wal_g_aws_access_key_id | default(digital_ocean_spaces_access_key | default(AWS_ACCESS_KEY_ID | default(''))) }}" }
      - { option: "AWS_SECRET_ACCESS_KEY", value: "{{ wal_g_aws_secret_access_key | default(digital_ocean_spaces_secret_key | default(AWS_SECRET_ACCESS_KEY | default(''))) }}" }
      - {
          option: "AWS_ENDPOINT",
          value: "{{ wal_g_s3_endpoint | default('https://' + (digital_ocean_spaces_region | default(default_region)) + '.digitaloceanspaces.com') }}",
        }
      - { option: "AWS_REGION", value: "{{ wal_g_s3_region | default(digital_ocean_spaces_region | default(default_region)) }}" }
      - { option: "AWS_S3_FORCE_PATH_STYLE", value: "{{ AWS_S3_FORCE_PATH_STYLE | default(true) }}" }
      - { option: "WALG_S3_PREFIX", value: "{{ wal_g_s3_prefix | default('s3://' + (digital_ocean_spaces_name | default(wal_g_default_cloud_bucket_name))) }}" }
      - { option: "WALG_COMPRESSION_METHOD", value: "{{ wal_g_compression_method | default('brotli') }}" }
      - { option: "WALG_DELTA_MAX_STEPS", value: "{{ wal_g_delta_max_steps | default('6') }}" }
      - { option: "WALG_DOWNLOAD_CONCURRENCY", value: "{{ wal_g_download_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_PREFETCH_DIR", value: "{{ wal_g_prefetch_dir_path | default(postgresql_home_dir + '/wal-g-prefetch') }}" }
      - { option: "WALG_UPLOAD_CONCURRENCY", value: "{{ wal_g_upload_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_UPLOAD_DISK_CONCURRENCY", value: "{{ wal_g_upload_disk_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "PGDATA", value: "{{ postgresql_data_dir }}" }
      - { option: "PGHOST", value: "{{ postgresql_unix_socket_dir | default('/var/run/postgresql') }}" }
      - { option: "PGPORT", value: "{{ postgresql_port | default('5432') }}" }
      - { option: "PGUSER", value: "{{ patroni_superuser_username | default('postgres') }}" }
  vars:
    default_region: "{{ (server_location in ['nyc1', 'nyc2']) | ternary('nyc3', server_location) }}"
  no_log: true # do not output contents to the ansible log
  when: cloud_backup_provider | default(cloud_provider | default('')) | lower == 'digitalocean'

# Hetzner Object Storage (if 'cloud_backup_provider=hetzner')
- name: "Set variable 'wal_g_json' for backup in AWS S3 bucket"
  ansible.builtin.set_fact:
    wal_g_json:
      - { option: "AWS_ACCESS_KEY_ID", value: "{{ wal_g_aws_access_key_id | default(hetzner_object_storage_access_key | default('')) }}" }
      - { option: "AWS_SECRET_ACCESS_KEY", value: "{{ wal_g_aws_secret_access_key | default(hetzner_object_storage_secret_key | default('')) }}" }
      - {
          option: "AWS_ENDPOINT",
          value: "{{ wal_g_s3_endpoint | default(hetzner_object_storage_endpoint | default('https://' + (hetzner_object_storage_region | default(default_region)) + '.your-objectstorage.com')) }}",
        }
      - { option: "AWS_S3_FORCE_PATH_STYLE", value: "{{ AWS_S3_FORCE_PATH_STYLE | default(true) }}" }
      - { option: "AWS_REGION", value: "{{ wal_g_s3_region | default(hetzner_object_storage_region | default(default_region)) }}" }
      - {
          option: "WALG_S3_PREFIX",
          value: "{{ wal_g_s3_prefix | default('s3://' + (hetzner_object_storage_name | default(wal_g_default_cloud_bucket_name))) }}",
        }
      - { option: "WALG_COMPRESSION_METHOD", value: "{{ wal_g_compression_method | default('brotli') }}" }
      - { option: "WALG_DELTA_MAX_STEPS", value: "{{ wal_g_delta_max_steps | default('6') }}" }
      - { option: "WALG_DOWNLOAD_CONCURRENCY", value: "{{ wal_g_download_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_PREFETCH_DIR", value: "{{ wal_g_prefetch_dir_path | default(postgresql_home_dir + '/wal-g-prefetch') }}" }
      - { option: "WALG_UPLOAD_CONCURRENCY", value: "{{ wal_g_upload_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "WALG_UPLOAD_DISK_CONCURRENCY", value: "{{ wal_g_upload_disk_concurrency | default([ansible_processor_vcpus | int // 2, 1] | max) }}" }
      - { option: "PGDATA", value: "{{ postgresql_data_dir }}" }
      - { option: "PGHOST", value: "{{ postgresql_unix_socket_dir | default('/var/run/postgresql') }}" }
      - { option: "PGPORT", value: "{{ postgresql_port | default('5432') }}" }
      - { option: "PGUSER", value: "{{ patroni_superuser_username | default('postgres') }}" }
  vars:
    default_region: "{{ (server_location in ['hel1', 'fsn1', 'nbg1']) | ternary(server_location, 'nbg1') }}"
  delegate_to: localhost
  run_once: true # noqa run-once
  no_log: true # do not output contents to the ansible log
  when: cloud_backup_provider | default(cloud_provider | default('')) | lower == 'hetzner'
