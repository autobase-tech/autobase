---
# Fallback names for auto_conf.yml when cloud_resources defaults are not loaded.
# Keep these expressions in sync with cloud_resources.
wal_g_cloud_backup_storage_suffix: >-
  {{ cloud_backup_storage_suffix | default((cloud_backup_storage_id | default('') | hash('sha256'))[:12]
      if cloud_backup_storage_id | default('') | length > 0 else '') }}
wal_g_default_cloud_bucket_name: >-
  {{ cloud_backup_bucket_name | default(
    ((patroni_cluster_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '') | default('postgres', true))[:43]
      | regex_replace('-+$', '')) ~ '-backup-' ~ wal_g_cloud_backup_storage_suffix
    if wal_g_cloud_backup_storage_suffix | length > 0 else patroni_cluster_name ~ '-backup'
  ) }}
wal_g_default_azure_account_name: >-
  {{ cloud_backup_azure_account_name | default(
    (patroni_cluster_name | lower | regex_replace('[^a-z0-9]', '') | default('postgres', true))[:12] ~ wal_g_cloud_backup_storage_suffix
    if wal_g_cloud_backup_storage_suffix | length > 0 else patroni_cluster_name | lower | replace('-', '') | truncate(24, true, '')
  ) }}

wal_g_architecture_map:
  amd64: amd64
  x86_64: amd64
  aarch64: aarch64
  arm64: aarch64

# if 'wal_g_installation_method' is 'src'
go_architecture_map:
  amd64: amd64
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
