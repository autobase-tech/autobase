---
- block: # install vip-manager package from repo
    - name: Get vip-manager package
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /tmp/
        timeout: 60
        validate_certs: false
      loop:
        - "{{ vip_manager_package_repo }}"
      environment: "{{ proxy_env | default({}) }}"

    - name: Install vip-manager
      ansible.builtin.apt:
        force_apt_get: true
        deb: "/tmp/{{ vip_manager_package_repo | basename }}"
        state: present
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "Debian"

    - name: Install vip-manager
      ansible.builtin.package:
        name: "/tmp/{{ vip_manager_package_repo | basename }}"
        state: present
        disable_gpg_check: true
      register: package_status
      until: package_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "RedHat"
  when:
    - installation_method == "packages"
    - vip_manager_package_repo | length > 0
    - not ansible_check_mode
    - not postgresql_cluster_maintenance | default(false) | bool
  tags: vip, vip_manager, vip_manager_install

- name: Apply SELinux file contexts to vip-manager
  ansible.builtin.include_role:
    name: vitabaks.autobase.selinux
    tasks_from: relabel
  vars:
    selinux_relabel_paths: ["/usr/bin/vip-manager"]
  tags: vip, vip_manager, selinux

- name: Make sure the conf directory "{{ vip_manager_conf | default('') | dirname }}" exist
  ansible.builtin.file:
    dest: "{{ vip_manager_conf | dirname }}"
    state: directory
    owner: postgres
    group: postgres
  tags: vip, vip_manager, vip_manager_conf

- name: Generate conf file "{{ vip_manager_conf | default('') }}"
  ansible.builtin.template:
    src: templates/vip-manager.yml.j2
    dest: "{{ vip_manager_conf }}"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: "restart vip-manager"
  when: cluster_scaling is not defined or not cluster_scaling | bool
  tags: vip, vip_manager, vip_manager_conf

- block: # if cluster_scaling (add_node.yml)
    - name: Fetch "{{ vip_manager_conf | default('') | basename }}" conf file from master
      run_once: true
      ansible.builtin.fetch:
        src: "{{ vip_manager_conf }}"
        dest: "{{ files_dir | default(playbook_dir ~ '/files') }}/{{ vip_manager_conf | basename }}"
        validate_checksum: true
        flat: true
      delegate_to: "{{ groups.master[0] }}"

    - name: Copy "{{ vip_manager_conf | default('') | basename }}" conf file to replica
      ansible.builtin.copy:
        src: "{{ files_dir | default(playbook_dir ~ '/files') }}/{{ vip_manager_conf | basename }}"
        dest: "{{ vip_manager_conf | dirname }}"
      notify: "restart vip-manager"

    - name: Prepare "{{ vip_manager_conf | default('') | basename }}" conf file (replace "nodename","iface")
      ansible.builtin.lineinfile:
        path: "{{ vip_manager_conf }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: true
      loop:
        - { regexp: "^nodename:", line: 'nodename: "{{ ansible_hostname }}"' }
        - { regexp: "^iface:", line: "iface: {{ vip_manager_iface }} # interface to which the virtual ip will be added" }
      loop_control:
        label: "{{ item.line }}"
      notify: "restart vip-manager"
  when: cluster_scaling is defined and cluster_scaling | bool
  tags: vip, vip_manager, vip_manager_conf

- name: Generate systemd service file
  ansible.builtin.template:
    src: templates/vip-manager.service.j2
    dest: /etc/systemd/system/vip-manager.service
    owner: postgres
    group: postgres
    mode: "0644"
  notify: "restart vip-manager"
  tags: vip, vip_manager, vip_manager_service

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
