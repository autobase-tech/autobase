---
- name: Make sure new PostgreSQL data directory "{{ pg_new_datadir | default('') }}" exists
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ pg_new_datadir }}"
    state: directory
    mode: "0700"
    group: postgres
    owner: postgres

- name: Make sure new PostgreSQL data directory "{{ pg_new_datadir | default('') }}" is not initialized
  ansible.builtin.stat:
    path: "{{ pg_new_datadir }}/PG_VERSION"
  register: pgdata_initialized

- block: # if already initialized
    - name: Perform pg_dropcluster
      ansible.builtin.command: >
        /usr/bin/pg_dropcluster --stop {{ pg_new_version }} {{ postgresql_cluster_name }}
      failed_when: false
      when:
        - ansible_os_family == "Debian"
        - pg_new_confdir != pg_new_datadir

    - name: Clear the new PostgreSQL data directory "{{ pg_new_datadir | default('') }}"
      ansible.builtin.file:
        path: "{{ pg_new_datadir }}"
        state: "{{ item }}"
        mode: "0700"
        group: postgres
        owner: postgres
      loop:
        - absent
        - directory
  when:
    - pgdata_initialized.stat.exists is defined
    - pgdata_initialized.stat.exists

- name: Get the current install user
  ansible.builtin.command: >
    {{ psql_command }} -d postgres -tAXc "select rolname from pg_roles where oid = 10"
  changed_when: false
  register: pg_install_user
  vars:
    psql_command: "{{ pg_old_bindir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }}"
  environment:
    PGPASSFILE: "{{ postgresql_cli_passfile }}"
  when: inventory_hostname in groups['primary']

- name: Prepare PostgreSQL upgrade password file
  ansible.builtin.import_tasks: "{{ role_path }}/../pgpass/tasks/upgrade.yml"
  when: inventory_hostname in groups['primary']

- name: Get the current encoding, locale, and data_checksums settings
  ansible.builtin.command: >-
    {{ psql_command }} -d postgres -tAXc "
    select row_to_json(pg_settings)
    from (
      select
        datcollate as lc_collate,
        datctype as lc_ctype,
        {% if pg_old_version | int >= 15 %}
        case datlocprovider when 'c' then 'libc' when 'i' then 'icu' when 'b' then 'builtin' end as locale_provider,
        {% else %}
        'libc'::text as locale_provider,
        {% endif %}
        {% if pg_old_version | int >= 17 %}
        datlocale as provider_locale,
        {% elif pg_old_version | int >= 15 %}
        daticulocale as provider_locale,
        {% else %}
        null::text as provider_locale,
        {% endif %}
        {% if pg_old_version | int >= 16 %}
        daticurules as icu_rules,
        {% else %}
        null::text as icu_rules,
        {% endif %}
        current_setting('lc_messages') as lc_messages,
        current_setting('lc_monetary') as lc_monetary,
        current_setting('lc_numeric') as lc_numeric,
        current_setting('lc_time') as lc_time,
        current_setting('server_encoding') as server_encoding,
        current_setting('data_checksums') as data_checksums,
        current_setting('wal_level') as wal_level
      from pg_database
      where datname = current_database()
    ) pg_settings"
  changed_when: false
  register: pg_settings
  vars:
    psql_command: "{{ pg_old_bindir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }}"
  environment:
    PGPASSFILE: "{{ postgresql_cli_passfile }}"
  when: inventory_hostname in groups['primary']

- name: Set locale options for initializing the new PostgreSQL cluster
  ansible.builtin.set_fact:
    pg_initdb_locale_options: >-
      {% if pg_new_version | int >= 15 %}
      --locale-provider={{ pg_source_settings.locale_provider | quote }}
      {% if pg_source_settings.locale_provider == 'builtin' %}
      --builtin-locale={{ pg_source_settings.provider_locale | quote }}
      {% elif pg_source_settings.locale_provider == 'icu' %}
      --icu-locale={{ pg_source_settings.provider_locale | quote }}
      {% if pg_new_version | int >= 16 and pg_source_settings.icu_rules | default('', true) | length > 0 %}
      --icu-rules={{ pg_source_settings.icu_rules | quote }}
      {% endif %}
      {% endif %}
      {% endif %}
  vars:
    pg_source_settings: "{{ hostvars[groups['primary'][0]].pg_settings.stdout | from_json }}"

- name: Create temporary password file for install user
  ansible.builtin.copy:
    dest: "{{ postgresql_home_dir }}/.pg_install_user_password"
    content: "{{ pg_install_user_password }}"
    mode: "0600"
  no_log: true
  when: pg_install_user_password is defined

# for Debian based use pg_createcluster, if the PostgreSQL configuration is not located in the data directory.
# Note: Patroni failure is possible if the default postgresql config files are missing in the /etc/postgresql/...
- name: Initialize new PostgreSQL data directory with default config files
  ansible.builtin.command: >-
    /usr/bin/pg_createcluster {{ pg_new_version }} {{ postgresql_cluster_name }}
    --datadir={{ pg_new_datadir }}
    --encoding={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).server_encoding }}
    --lc-collate={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_collate }}
    --lc-ctype={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_ctype }}
    --lc-messages={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_messages }}
    --lc-monetary={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_monetary }}
    --lc-numeric={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_numeric }}
    --lc-time={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).lc_time }}
    --start-conf=manual
    --
    --username={{ hostvars[groups['primary'][0]].pg_install_user.stdout }}
    {{ pg_initdb_locale_options }}
    {% if pg_new_version | int >= 16 %}
    --set wal_level={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).wal_level }}
    {% endif %}
    {% if pg_install_user_password is defined %}
    --pwfile="{{ postgresql_home_dir }}/.pg_install_user_password"
    {% endif %}
    {% if (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).data_checksums == 'on' %}
    --data-checksums
    {% elif pg_new_version | int >= 18 and (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).data_checksums == 'off' %}
    --no-data-checksums
    {% endif %}
  when:
    - ansible_os_family == "Debian"
    - pg_new_confdir != pg_new_datadir

# Use initdb, if the PostgreSQL configuration is located in the data directory.
- name: Initialize new PostgreSQL data directory on the primary
  ansible.builtin.command: >-
    {{ pg_new_bindir }}/initdb
    --pgdata={{ pg_new_datadir }}
    --encoding={{ (pg_settings.stdout | from_json).server_encoding }}
    --lc-collate={{ (pg_settings.stdout | from_json).lc_collate }}
    --lc-ctype={{ (pg_settings.stdout | from_json).lc_ctype }}
    --lc-messages={{ (pg_settings.stdout | from_json).lc_messages }}
    --lc-monetary={{ (pg_settings.stdout | from_json).lc_monetary }}
    --lc-numeric={{ (pg_settings.stdout | from_json).lc_numeric }}
    --lc-time={{ (pg_settings.stdout | from_json).lc_time }}
    --username={{ pg_install_user.stdout }}
    {{ pg_initdb_locale_options }}
    {% if pg_new_version | int >= 16 %}
    --set wal_level={{ (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).wal_level }}
    {% endif %}
    {% if pg_install_user_password is defined %}
    --pwfile={{ postgresql_home_dir }}/.pg_install_user_password
    {% endif %}
    {% if (pg_settings.stdout | from_json).data_checksums == 'on' %}
    --data-checksums
    {% elif pg_new_version | int >= 18 and (hostvars[groups['primary'][0]].pg_settings.stdout | from_json).data_checksums == 'off' %}
    --no-data-checksums
    {% endif %}
  when:
    - inventory_hostname in groups['primary']
    - pg_new_confdir == pg_new_datadir

- name: Delete temporary password file for install user
  ansible.builtin.file:
    path: "{{ postgresql_home_dir }}/.pg_install_user_password"
    state: absent
  when: pg_install_user_password is defined
