---
- name: "Execute CHECKPOINT before stopping PostgreSQL"
  ansible.builtin.command: "{{ psql_command }} -tAXc 'CHECKPOINT'"
  async: "{{ pg_start_stop_timeout | int }}" # run the command asynchronously
  poll: 0
  vars:
    psql_command: "{{ pg_old_bindir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres"
  environment:
    PGPASSFILE: "{{ _postgresql_cli_passfile_path }}"
  register: checkpoint_result

- name: Wait for the CHECKPOINT to complete
  ansible.builtin.async_status:
    jid: "{{ checkpoint_result.ansible_job_id }}"
  register: checkpoint_job_result
  until: checkpoint_job_result.finished
  retries: "{{ (pg_start_stop_timeout | int) // 10 }}"
  delay: 10

# Wait for the window to appear without high replication lag before stopping PostgreSQL
- name: "Wait until replication lag is less than {{ max_replication_lag_bytes | default(0) | int | human_readable }}"
  ansible.builtin.command: >-
    {{ psql_command }} -tAXc "
      select coalesce(max(pg_wal_lsn_diff(pg_current_wal_lsn(),replay_lsn)),1)
      from pg_stat_replication"
  register: pg_lag_bytes
  until: pg_lag_bytes.stdout|int < max_replication_lag_bytes|int
  retries: 60 # max wait time: 2 minutes
  delay: 2
  changed_when: false
  failed_when: false
  ignore_errors: true # Roll back all selected shards if the lag does not drop.
  vars:
    psql_command: "{{ pg_old_bindir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres"
  environment:
    PGPASSFILE: "{{ _postgresql_cli_passfile_path }}"
  when:
    - inventory_hostname in groups['primary']
    - patroni_shard_replicas | length > 0
    - pg_old_version | string is version('10', '>=')

# for compatibility with Postgres 9.x
- name: "Wait until replication lag is less than {{ max_replication_lag_bytes | default(0) | int | human_readable }}"
  ansible.builtin.command: >-
    {{ psql_command }} -tAXc "
      select coalesce(max(pg_xlog_location_diff(pg_current_xlog_location(),replay_location)),1)
      from pg_stat_replication"
  register: pg_lag_bytes_9x
  until: pg_lag_bytes_9x.stdout|int < max_replication_lag_bytes|int
  retries: 60 # max wait time: 2 minutes
  delay: 2
  changed_when: false
  failed_when: false
  ignore_errors: true # Roll back all selected shards if the lag does not drop.
  vars:
    psql_command: "{{ pg_old_bindir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres"
  environment:
    PGPASSFILE: "{{ _postgresql_cli_passfile_path }}"
  when:
    - inventory_hostname in groups['primary']
    - patroni_shard_replicas | length > 0
    - pg_old_version | string is version('10', '<')

- name: Check whether replication lag prevents upgrade
  ansible.builtin.set_fact:
    upgrade_replication_lag_exceeded: "{{ observed_lag | length > 0 and observed_lag | int >= max_replication_lag_bytes | int }}"
  vars:
    observed_lag: "{{ pg_lag_bytes.stdout | default(pg_lag_bytes_9x.stdout | default('')) }}"
  when: inventory_hostname in groups['primary']

- name: Abort the upgrade if any selected shard exceeds the replication lag limit
  when: >-
    groups['primary'] | select('in', ansible_play_hosts)
    | map('extract', hostvars, 'upgrade_replication_lag_exceeded') | select('equalto', true) | list | length > 0
  block:
    - name: Perform rollback
      ansible.builtin.include_tasks: rollback.yml

    - name: Replication lag detected
      ansible.builtin.fail:
        msg: A selected shard exceeds the maximum replication lag. Retry after its replicas catch up.
      run_once: true

# if 'pgbouncer_install' is 'true' and 'pgbouncer_pool_pause' is 'true'
- name: Perform PAUSE on all pgbouncers servers
  ansible.builtin.include_tasks: pgbouncer_pause.yml
  when:
    - pgbouncer_install | bool
    - pgbouncer_pool_pause | bool

# if 'pgdog_install' is 'true' and 'pgdog_pool_pause' is 'true'
- name: Enable maintenance mode on all PgDog servers
  ansible.builtin.include_tasks: pgdog_pause.yml
  when:
    - pgdog_install | bool
    - pgdog_pool_pause | bool
    - target_shard | default('all') == 'all'

# Stop PostgreSQL (if replication lag is 0 bytes)
- name: Stop PostgreSQL on the leader
  ansible.builtin.command: >-
    {{ pg_old_bindir }}/pg_ctl -D {{ pg_old_datadir }} stop -m fast -w -t {{ pg_start_stop_timeout }}
  when:
    - inventory_hostname in groups['primary']

- name: Stop PostgreSQL on the replica
  ansible.builtin.command: >-
    {{ pg_old_bindir }}/pg_ctl -D {{ pg_old_datadir }} stop -m fast -w -t {{ pg_start_stop_timeout }}
  when:
    - inventory_hostname in groups.get('secondary', [])

# additional checks using pg_ctl
- name: "Check if PostgreSQL {{ pg_old_version | default('') }} is stopped"
  ansible.builtin.command: "{{ pg_old_bindir }}/pg_ctl status -D {{ pg_old_datadir }}"
  register: pg_ctl_status_old_result
  failed_when: false
  changed_when: false

- name: "Check if PostgreSQL {{ pg_new_version | default('') }} is stopped"
  ansible.builtin.command: "{{ pg_new_bindir }}/pg_ctl status -D {{ pg_new_datadir }}"
  register: pg_ctl_status_new_result
  failed_when: false
  changed_when: false

- name: "Stop PostgreSQL {{ pg_old_version | default('') }}"
  ansible.builtin.command: >
    {{ pg_old_bindir }}/pg_ctl -D {{ pg_old_datadir }} stop -w -t {{ pg_start_stop_timeout }}
  when:
    - pg_ctl_status_old_result is defined
    - pg_ctl_status_old_result.rc == 0

- name: "Stop PostgreSQL {{ pg_new_version | default('') }}"
  ansible.builtin.command: >
    {{ pg_new_bindir }}/pg_ctl -D {{ pg_new_datadir }} stop -w -t {{ pg_start_stop_timeout }}
  when:
    - pg_ctl_status_new_result is defined
    - pg_ctl_status_new_result.rc == 0
