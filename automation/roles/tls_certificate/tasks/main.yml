---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: ansible_facts.packages is not defined
  check_mode: false

- block:
    - name: Install python3-cryptography package
      ansible.builtin.package:
        name: python3-cryptography
        state: present
      register: pack_status
      until: pack_status is success
      delay: 5
      retries: 3
      when: "'python3-cryptography' not in ansible_facts.packages"

    - name: Ensure TLS directory exist
      ansible.builtin.file:
        path: "{{ tls_directory }}"
        state: directory
        owner: "{{ generate_tls_owner | default(tls_owner | default('postgres')) }}"
        group: "{{ generate_tls_owner | default(tls_owner | default('postgres')) }}"
        mode: "0755"

    - block:
        # Check if certificates already exist. This must also run when only the
        # server certificate is regenerated, so the existing CA is preserved.
        - name: Check if TLS CA cert already exists
          ansible.builtin.stat:
            path: "{{ tls_directory }}/{{ generate_tls_ca_cert | default(tls_ca_cert | default('ca.crt')) }}"
          register: ca_cert

        - name: Check if TLS CA key already exists
          ansible.builtin.stat:
            path: "{{ tls_directory }}/{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
          register: ca_key

        - name: Validate existing TLS CA files
          ansible.builtin.assert:
            that:
              - not (cluster_scaling | default(false) | bool) or ca_cert.stat.exists | default(false)
              - not (cluster_scaling | default(false) | bool) or ca_key.stat.exists | default(false)
              - tls_ca_regenerate | default(false) | bool or
                (ca_cert.stat.exists | default(false)) == (ca_key.stat.exists | default(false))
            fail_msg: >-
              The existing TLS CA certificate and private key must both be present on
              {{ tls_certificate_source_host }}. Refusing to generate a replacement CA.

        - name: Check if TLS server cert already exists
          ansible.builtin.stat:
            path: "{{ tls_directory }}/{{ generate_tls_cert | default(tls_cert | default('server.crt')) }}"
          register: server_cert

        - name: Check if TLS server key already exists
          ansible.builtin.stat:
            path: "{{ tls_directory }}/{{ generate_tls_privatekey | default(tls_privatekey | default('server.key')) }}"
          register: server_key

        # Skip generation if certificates already exist and tls_cert_regenerate is false
        - name: Skip certificate generation
          ansible.builtin.debug:
            msg:
              - "TLS certificates already exist. Skipping certificate generation."
              - "To force regeneration, set '{{ variable_name }}: true'"
          vars:
            variable_name: >-
              {{ 'etcd_tls_cert_regenerate' if tls_group_name | default('') == 'etcd_cluster'
                 else 'postgres_tls_cert_regenerate' if tls_group_name | default('') == 'postgres_cluster'
                 else 'consul_tls_cert_regenerate' if tls_group_name | default('') == 'consul_instances'
                 else 'tls_cert_regenerate' }}
          when:
            - not tls_cert_regenerate | default(false) | bool
            - server_key.stat.exists | default(false)
            - server_cert.stat.exists | default(false)
      when: inventory_hostname == tls_certificate_source_host

    # Clean up existing certificates if tls_cert_regenerate is true
    - name: Clean up existing certificates
      ansible.builtin.file:
        path: "{{ tls_directory }}/{{ item }}"
        state: absent
      loop:
        - "{{ generate_tls_privatekey | default(tls_privatekey | default('server.key')) }}"
        - "{{ generate_tls_cert | default(tls_cert | default('server.crt')) }}"
      when:
        - inventory_hostname == tls_certificate_source_host
        - tls_cert_regenerate | default(false) | bool

    # Clean up existing CA certificates if tls_ca_regenerate is true
    - name: Clean up existing CA certificates
      ansible.builtin.file:
        path: "{{ tls_directory }}/{{ item }}"
        state: absent
      loop:
        - "{{ generate_tls_ca_cert | default(tls_ca_cert | default('ca.crt')) }}"
        - "{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
      when:
        - inventory_hostname == tls_certificate_source_host
        - tls_ca_regenerate | default(false) | bool
  vars:
    tls_directory: "{{ generate_tls_dir | default(tls_dir | default('/etc/tls')) }}"
    tls_certificate_source_host: "{{ tls_source_host | default(groups[tls_group_name | default('postgres_cluster')][0]) }}"
  when: inventory_hostname in (groups[tls_group_name | default('postgres_cluster')])
  tags: tls, tls_cert_generate

# Generate new certificates
# if 'tls_cert_regenerate' is 'true' or if at least one certificate or key is not found.
- block:
    # Generates a list of Subject Alternative Names (SAN) for TLS certificates if 'tls_subject_alt_name' is not set.
    # Uses `tls_group_name` if it is defined, non-empty, and exists in `groups`; otherwise, applies to all playbook hosts.
    - name: "Generate subjectAltName entries for all hosts"
      ansible.builtin.set_fact:
        generated_subject_alt_name: >-
          {{
            (
              tls_hosts | map('extract', hostvars, 'ansible_hostname') | map('regex_replace', '^', 'DNS:') | list +
              tls_hosts | map('extract', hostvars, 'ansible_fqdn') | map('regex_replace', '^', 'DNS:') | list +
              tls_hosts | map('extract', hostvars, tls_bind_address_var) | map('regex_replace', '^', 'IP:') | list +
              ['DNS:localhost', 'IP:127.0.0.1']
            ) | unique | join(',')
          }}
      vars:
        tls_hosts: >-
          {{
            groups[tls_group_name]
            if (tls_group_name | default('') | length > 0 and tls_group_name in groups)
            else ansible_play_hosts
          }}
        tls_bind_address_var: >-
          {{
            'etcd_bind_address' if (tls_group_name | default('') == 'etcd_cluster' and etcd_bind_address | default('') | length > 0)
            else 'consul_bind_address' if (tls_group_name | default('') == 'consul_instances' and consul_bind_address | default('') | length > 0)
            else 'patroni_bind_address' if (tls_group_name | default('') == 'postgres_cluster' and patroni_bind_address | default('') | length > 0)
            else 'bind_address'
          }}

      when:
        - tls_subject_alt_name | default('') | length < 1
        - (need_ca or need_srv_key or need_srv_cert)

    - name: "Display Certificate subjectAltName future value"
      ansible.builtin.debug:
        msg: "SubjectAltName = {{ tls_subject_alt_name | default(generated_subject_alt_name | default('')) }}"
      when: tls_subject_alt_name | default(generated_subject_alt_name | default('')) | length > 0

    ######## Generate CA ########
    - name: "Generate CA private key"
      community.crypto.openssl_privatekey:
        path: "{{ tls_directory }}/{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
        size: "{{ generate_tls_privatekey_size | default(tls_privatekey_size | default(4096)) }}"
        type: "{{ generate_tls_privatekey_type | default(tls_privatekey_type | default('RSA')) }}"
      when: need_ca

    - name: "Create CSR for CA certificate"
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ tls_directory }}/{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
        common_name: "{{ generate_tls_ca_common_name | default(tls_ca_common_name | default('Autobase CA')) }}"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
        key_usage_critical: true
      register: ca_csr
      when: need_ca

    - name: "Create self-signed CA certificate from CSR"
      community.crypto.x509_certificate:
        path: "{{ tls_directory }}/{{ generate_tls_ca_cert | default(tls_ca_cert | default('ca.crt')) }}"
        csr_content: "{{ ca_csr.csr }}"
        privatekey_path: "{{ tls_directory }}/{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
        provider: "{{ generate_tls_cert_provider | default(tls_cert_provider | default('selfsigned')) }}"
        selfsigned_not_after: "+{{ generate_tls_cert_valid_days | default(tls_cert_valid_days | default(3650)) }}d"
        selfsigned_not_before: "-1d"
      when: need_ca

    ######## Generate Server cert/key ########
    - name: "Create server private key"
      community.crypto.openssl_privatekey:
        path: "{{ tls_directory }}/{{ generate_tls_privatekey | default(tls_privatekey | default('server.key')) }}"
        size: "{{ generate_tls_privatekey_size | default(tls_privatekey_size | default(4096)) }}"
        type: "{{ generate_tls_privatekey_type | default(tls_privatekey_type | default('RSA')) }}"
      when: need_srv_key

    - name: "Create server CSR"
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ tls_directory }}/{{ generate_tls_privatekey | default(tls_privatekey | default('server.key')) }}"
        common_name: "{{ generate_tls_common_name | default(tls_common_name | default(cluster_name)) }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
          - dataEncipherment
        extended_key_usage:
          - clientAuth
          - serverAuth
        subject:
          O: "Autobase"
        subject_alt_name: "{{ tls_subject_alt_name | default(generated_subject_alt_name | default('')) }}"
      register: csr
      when: need_srv_cert

    - name: "Sign server certificate with the CA"
      community.crypto.x509_certificate_pipe:
        csr_content: "{{ csr.csr }}"
        provider: ownca
        ownca_path: "{{ tls_directory }}/{{ generate_tls_ca_cert | default(tls_ca_cert | default('ca.crt')) }}"
        ownca_privatekey_path: "{{ tls_directory }}/{{ generate_tls_ca_key | default(tls_ca_key | default('ca.key')) }}"
        ownca_not_after: +{{ generate_tls_cert_valid_days | default(tls_cert_valid_days | default(3650)) }}d
        ownca_not_before: "-1d"
      register: certificate
      when: need_srv_cert

    - name: "Write server certificate"
      ansible.builtin.copy:
        dest: "{{ tls_directory }}/{{ generate_tls_cert | default(tls_cert | default('server.crt')) }}"
        content: "{{ certificate.certificate }}"
        group: "{{ generate_tls_group | default('root') }}"
        mode: "0644"
      when: need_srv_cert
  vars:
    tls_directory: "{{ generate_tls_dir | default(tls_dir | default('/etc/tls')) }}"
    need_ca: >-
      {{
        not (ca_cert is defined and ca_cert.stat.exists | default(false)) or
        not (ca_key is defined and ca_key.stat.exists | default(false)) or
        (tls_ca_regenerate | default(false) | bool)
      }}
    need_srv_key: "{{ not (server_key is defined and server_key.stat.exists | default(false)) or (tls_cert_regenerate | default(false) | bool) }}"
    need_srv_cert: "{{ not (server_cert is defined and server_cert.stat.exists | default(false)) or (tls_cert_regenerate | default(false) | bool) }}"
    tls_certificate_source_host: "{{ tls_source_host | default(groups[tls_group_name | default('postgres_cluster')][0]) }}"
  when: inventory_hostname == tls_certificate_source_host
  tags: tls, tls_cert_generate
