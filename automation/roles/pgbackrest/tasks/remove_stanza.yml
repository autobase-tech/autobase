---
- name: Check if pgBackRest stanza exists
  become: true
  become_user: "{{ pgbackrest_command_user }}"
  ansible.builtin.command: "pgbackrest --stanza={{ removal_stanza }} info"
  register: pgbackrest_info_result
  failed_when: false
  changed_when: false

- name: Run pgBackRest stop
  become: true
  become_user: "{{ pgbackrest_command_user }}"
  ansible.builtin.command: "pgbackrest --stanza={{ removal_stanza }} stop --force"
  register: pgbackrest_stop_result
  when: pgbackrest_info_result.stdout is not search("missing stanza path") # skip if no stanza exists

- name: Delete pgBackRest stanza
  become: true
  become_user: "{{ pgbackrest_command_user }}"
  ansible.builtin.command: "pgbackrest --stanza={{ removal_stanza }} stanza-delete --force"
  when: pgbackrest_stop_result is not skipped

- name: Delete pgBackRest cron job
  ansible.builtin.file:
    path: "{{ item.file }}"
    state: absent
  loop: "{{ pgbackrest_cron_jobs | default(default_pgbackrest_cron_jobs) | unique(attribute='file') }}"
  loop_control:
    label: "{{ item.file }}"

- name: Run pgBackRest start
  become: true
  become_user: "{{ pgbackrest_command_user }}"
  ansible.builtin.command: "pgbackrest --stanza={{ removal_stanza }} start" # delete stop file (it exists)
  when: pgbackrest_stop_result is not skipped
