---
# Create a stanza locally (if "pgbackrest_repo_host" is not set)
- block:
    - name: Get repo1-path and repo1-type value
      ansible.builtin.set_fact:
        repo1_path: >-
          {{
            (pgbackrest_conf['global']
              | selectattr('option', 'equalto', 'repo1-path')
              | map(attribute='value')
              | list
              | first
            ) | default('/var/lib/pgbackrest', true)
          }}
        repo1_type: >-
          {{
            (pgbackrest_conf['global']
              | selectattr('option', 'equalto', 'repo1-type')
              | map(attribute='value')
              | list
              | first
            ) | default('posix', true)
          }}

    - name: "Make sure the {{ repo1_path | default('/var/lib/pgbackrest') }} directory exists"
      ansible.builtin.file:
        path: "{{ repo1_path }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"
      when: repo1_type | lower == 'posix'

    - name: Create stanza "{{ pgbackrest_stanza | default('') }}"
      become: true
      become_user: postgres
      ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} --no-online stanza-create"
      register: stanza_create_result
      changed_when:
        - stanza_create_result.rc == 0
        - stanza_create_result.stdout is not search("already exists")
      when: (repo1_type | lower == 'posix' and not (pgbackrest_repo_shared | default(false) | bool)) or
        inventory_hostname == groups['master'][0] # run only on master if it's not posix or the posix repo is shared
  when:
    - pgbackrest_repo_host | length < 1
    - "'postgres_cluster' in group_names"
  tags: pgbackrest, pgbackrest_stanza_create

# Create a stanza on the dedicated repository host
- block:
    # It will create a stanza on the dedicated repository host only when pgbackrest_repo_host is defined and has a value.
    # The delegate_to parameter is used to execute the task on a different host than the one specified in the play's hosts parameter.
    # In this case, the task is delegated to the first host in the pgbackrest group in the invetory.
    - name: Get repo1-path value
      delegate_to: "{{ pgbackrest_delegate }}"
      run_once: true
      ansible.builtin.set_fact:
        repo1_path: >-
          {{
            (pgbackrest_server_conf['global']
              | selectattr('option', 'equalto', 'repo1-path')
              | map(attribute='value')
              | list
              | first
            ) | default('/var/lib/pgbackrest', true)
          }}
      when: (pgbackrest_repo_type | default('posix')) | lower == 'posix'

    - name: "Make sure the {{ repo1_path | default('/var/lib/pgbackrest') }} directory exists"
      delegate_to: "{{ pgbackrest_delegate }}"
      run_once: true
      ansible.builtin.file:
        path: "{{ repo1_path }}"
        state: directory
        owner: "{{ pgbackrest_repo_user }}"
        group: "{{ pgbackrest_repo_user }}"
        mode: "0750"
      when: repo1_path | default('') | length > 0

    - name: Create stanza "{{ pgbackrest_stanza | default('') }}"
      become: true
      become_user: "{{ pgbackrest_repo_user }}"
      delegate_to: "{{ pgbackrest_delegate }}"
      run_once: true
      ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} --no-online stanza-create"
      register: stanza_create_result
      changed_when:
        - stanza_create_result.rc == 0
        - stanza_create_result.stdout is not search("already exists")
  vars:
    pgbackrest_delegate: "{{ (groups.get('pgbackrest', []) | list | first) | default(inventory_hostname, true) }}"
  when:
    - (pgbackrest_repo_host | default('')) | length > 0
    - (groups.get('pgbackrest', []) | length) > 0
  tags: pgbackrest, pgbackrest_stanza_create
