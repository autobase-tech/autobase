---
# If 'aws_assume_role_arn' is specified, assume this IAM role (for example, in another AWS account) and set 'aws_credentials'
# to its temporary credentials, which the AWS modules of aws.yml and backup_storage.yml pass instead of the credentials
# from the environment. The role is assumed once per run: the credentials are valid in all regions for an hour.
# Variables: aws_assume_role_region - the region of the STS endpoint.
- block:
    - name: "AWS: Assume IAM role '{{ aws_assume_role_arn | default('') }}'"
      amazon.aws.sts_assume_role:
        role_arn: "{{ aws_assume_role_arn }}"
        role_session_name: "{{ ('autobase-' ~ patroni_cluster_name)[:64] }}"
        region: "{{ aws_assume_role_region }}"
      register: aws_assume_role_result
      failed_when: false
      check_mode: false # sts_assume_role does not support check mode; it only reads
      no_log: true # the result contains the credentials

    - name: "AWS: Check the assumed IAM role"
      ansible.builtin.assert:
        that:
          - aws_assume_role_result.sts_creds is defined
        fail_msg: "Failed to assume IAM role '{{ aws_assume_role_arn }}': {{ aws_assume_role_result.msg | default('') }}"
        quiet: true

    - name: "Set variable: aws_credentials"
      ansible.builtin.set_fact:
        aws_credentials: "{{ aws_assume_role_result.sts_creds }}"
      no_log: true
  when:
    - aws_assume_role_arn | default('') | length > 0
    - aws_credentials is not defined
