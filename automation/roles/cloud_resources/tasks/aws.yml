---
- name: "AWS: Validate cluster name length for NLB target groups"
  ansible.builtin.assert:
    that:
      - patroni_cluster_name | length <= 21
    fail_msg: >-
      AWS NLB requires patroni_cluster_name to be 21 characters or fewer because
      the generated target group name adds the '-tg-primary' suffix and cannot exceed 32 characters.
  when:
    - state == 'present'
    - cloud_load_balancer | bool
    - aws_load_balancer_type | lower == 'nlb'

# SSH key
- block:
    # Delete the temporary ssh key from the cloud (if exists)
    - name: "AWS: Remove temporary SSH key '{{ ssh_key_name | default('') }}' from cloud (if any)"
      amazon.aws.ec2_key:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ ssh_key_name }}"
        region: "{{ server_location }}"
        state: absent
      when:
        - ssh_key_name is defined
        - tmp_ssh_key_name is defined
        - ssh_key_name == tmp_ssh_key_name

    # if ssh_key_name and ssh_key_content is specified, add this ssh key to the cloud
    - name: "AWS: Add SSH key '{{ ssh_key_name | default('') }}' to cloud"
      amazon.aws.ec2_key:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ ssh_key_name }}"
        key_material: "{{ ssh_key_content }}"
        region: "{{ server_location }}"
        state: present
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      register: ssh_key_result
      when:
        - ssh_key_name | length > 0
        - ssh_key_content | length > 0
  when: state == 'present'

# Create (if state is present)
- block:
    # if server_network is specified, get vpc id for this subnet
    - block:
        - name: "AWS: Gather information about VPC for '{{ server_network | default('') }}'"
          amazon.aws.ec2_vpc_subnet_info:
            region: "{{ server_location }}"
            subnet_ids: "{{ server_network }}"
          register: custom_vpc_subnet_info

        - name: "Set variable: vpc_id"
          ansible.builtin.set_fact:
            vpc_id: "{{ custom_vpc_subnet_info.subnets[0].vpc_id }}"
      when: server_network | length > 0

    # if server_network is not specified, use default vpc subnet
    - block:
        - name: "AWS: Gather information about default VPC"
          amazon.aws.ec2_vpc_net_info:
            region: "{{ server_location }}"
            filters:
              "is-default": true
          register: default_vpc_info

        - name: "AWS: Gather information about VPC subnet for default VPC"
          amazon.aws.ec2_vpc_subnet_info:
            region: "{{ server_location }}"
            filters:
              vpc-id: "{{ default_vpc_info.vpcs[0].id }}"
          register: default_vpc_subnet_info

        - name: "Set variable: vpc_id"
          ansible.builtin.set_fact:
            vpc_id: "{{ default_vpc_info.vpcs[0].id }}"

        - name: "Set variable: server_network"
          ansible.builtin.set_fact:
            server_network: "{{ default_vpc_subnet_info.subnets[0].id }}"
      when: server_network | length < 1

    - name: "AWS: Gather information about VPC '{{ vpc_id | default('') }}'"
      amazon.aws.ec2_vpc_net_info:
        region: "{{ server_location }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: vpc_info

    # Security Group (Firewall)
    - name: "AWS: Create or modify Security Group"
      amazon.aws.ec2_security_group:
        name: "{{ patroni_cluster_name }}-security-group"
        state: present
        description: "Security Group for Postgres cluster"
        vpc_id: "{{ vpc_id }}"
        region: "{{ server_location }}"
        rules: "{{ rules }}"
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      vars:
        vpc_cidr_blocks: >-
          {{
            vpc_info.vpcs[0].cidr_block_association_set | default([])
            | map(attribute='cidr_block') | list
            | default([vpc_info.vpcs[0].cidr_block], true)
          }}
        rules: >-
          {{
            ([
              {
                'rule_desc': 'SSH public access',
                'proto': 'tcp',
                'ports': [ansible_ssh_port | default(22)],
                'cidr_ip': ssh_public_allowed_ips | default('0.0.0.0/0', true) | split(',')
              }
            ] if server_public_ip | bool and ssh_public_access | bool else []) +
            ([
              {
                'rule_desc': 'Netdata public access',
                'proto': 'tcp',
                'ports': [netdata_port | default('19999')],
                'cidr_ip': netdata_public_allowed_ips | default('0.0.0.0/0', true) | split(',')
              }
            ] if netdata_install | bool and netdata_public_access | bool else []) +
            ([
              {
                'rule_desc': 'Database public access',
                'proto': 'tcp',
                'ports':
                  ([
                    haproxy_listen_port.master | default('5000'),
                    haproxy_listen_port.replicas | default('5001'),
                    haproxy_listen_port.replicas_sync | default('5002'),
                    haproxy_listen_port.replicas_async | default('5003')
                  ] if with_haproxy_load_balancing | bool else []) +
                  ([
                    pgbouncer_listen_port | default('6432')
                  ] if not with_haproxy_load_balancing | bool and pgbouncer_install | bool else []) +
                  ([
                    postgresql_port | default('5432')
                  ] if not with_haproxy_load_balancing | bool and not pgbouncer_install | bool else []),
                'cidr_ip': database_public_allowed_ips | default('0.0.0.0/0', true) | split(',')
              }
            ] if database_public_access | bool else []) +
            ([{
              'rule_desc': 'Netdata internal access',
              'proto': 'tcp',
              'ports': [netdata_port | default('19999')],
              'cidr_ip': vpc_cidr_blocks }] if netdata_install | bool else []) +
            ([{
              'rule_desc': 'PgBouncer internal access',
              'proto': 'tcp',
              'ports': [pgbouncer_listen_port | default('6432')],
              'cidr_ip': vpc_cidr_blocks }] if pgbouncer_install | bool else []) +
            ([{
              'rule_desc': 'PostgreSQL internal access',
              'proto': 'tcp',
              'ports': [postgresql_port | default('5432')],
              'cidr_ip': vpc_cidr_blocks }]) +
            ([{
              'rule_desc': 'Patroni REST API internal access',
              'proto': 'tcp',
              'ports': [patroni_restapi_port | default('8008')],
              'cidr_ip': vpc_cidr_blocks }]) +
            ([{
              'rule_desc': 'HAProxy internal access',
              'proto': 'tcp',
              'ports': [
                haproxy_listen_port.master | default('5000'),
                haproxy_listen_port.replicas | default('5001'),
                haproxy_listen_port.replicas_sync | default('5002'),
                haproxy_listen_port.replicas_async | default('5003'),
                haproxy_listen_port.stats | default('7000')
              ],
              'cidr_ip': vpc_cidr_blocks
            }] if with_haproxy_load_balancing | bool else []) +
            ([{
              'rule_desc': 'etcd internal access',
              'proto': 'tcp',
              'ports': [
                etcd_client_port | default('2379'),
                etcd_peer_port | default('2380')
              ],
              'cidr_ip': vpc_cidr_blocks
            }] if dcs_type == 'etcd' else []) +
            ([{
              'rule_desc': 'Consul internal access',
              'proto': 'tcp',
              'ports': [
                consul_ports_dns | default('8600'),
                consul_ports_http | default('8500'),
                consul_ports_rpc | default('8400'),
                consul_ports_serf_lan | default('8301'),
                consul_ports_serf_wan | default('8302'),
                consul_ports_server | default('8300')
              ],
              'cidr_ip': vpc_cidr_blocks
            }] if dcs_type == 'consul' else []) +
            [{
              'rule_desc': 'SSH internal access',
              'proto': 'tcp',
              'ports': [ansible_ssh_port | default(22)],
              'cidr_ip': vpc_cidr_blocks
            }]
          }}
      register: ec2_security_group_result
      when: cloud_firewall | bool

    # Determine which IP address (public or private)
    - name: "Set variable: ip_address_type"
      ansible.builtin.set_fact:
        ip_address_type: "{{ 'public_ip_address' if (server_public_ip | bool and ssh_public_access | bool) else 'private_ip_address' }}"

    # Server and volume
    - block:
        - name: "AWS: Gather information about EC2 instances"
          amazon.aws.ec2_instance_info:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            region: "{{ server_location }}"
            filters:
              instance-type: "{{ server_type }}"
              instance-state-name: ["pending", "running", "shutting-down", "stopping", "stopped"]
              "tag:Name": "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          loop: "{{ range(0, server_count | int) | list }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_instance_info

        - name: "AWS: Create EC2 instance"
          amazon.aws.ec2_instance:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
            state: running
            instance_type: "{{ server_type }}"
            image_id: "{{ server_image }}"
            key_name: "{{ ssh_key_name }}"
            region: "{{ server_location }}"
            network_interfaces:
              - subnet_id: "{{ server_network }}"
                groups: "{{ ([] if not cloud_firewall | bool else [ec2_security_group_result.group_id]) }}"
                assign_public_ip: "{{ server_public_ip | bool }}"
                delete_on_termination: true
            volumes: "{{ [system_volume] + ([] if use_local_disk | bool else [data_volume]) }}"
            tags: "{{ cloud_provider_tags | combine({'Name': server_name | lower ~ '%02d' % (idx + 1), 'Cluster': patroni_cluster_name}) }}"
            purge_tags: false
          loop: "{{ range(0, server_count | int) | list }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_instance_result
          retries: 3
          delay: 10
          when: ec2_instance_info.results[idx].instances | length == 0 # only if instance does not exist
          vars:
            system_volume:
              device_name: /dev/sda1
              ebs:
                volume_type: "{{ system_volume_type | default('gp3', true) }}"
                volume_size: "{{ system_volume_size | default(80) | int }}"
                iops: "{{ system_volume_iops | default(3000) | int if system_volume_type | default('gp3', true) in ['gp3', 'io1', 'io2'] else omit }}"
                throughput: "{{ (system_volume_throughput | default(125) | int) if (system_volume_type | default('gp3', true)) == 'gp3' else omit }}"
                delete_on_termination: true
            data_volume:
              device_name: /dev/sdb
              ebs:
                volume_type: "{{ volume_type | default('gp3', true) }}"
                volume_size: "{{ volume_size | int }}"
                iops: "{{ volume_iops | default(3000) | int if volume_type | default('gp3', true) in ['gp3', 'io1', 'io2'] else omit }}"
                throughput: "{{ (volume_throughput | default(125) | int) if (volume_type | default('gp3', true)) == 'gp3' else omit }}"
                delete_on_termination: true
      when: not server_spot | default(aws_ec2_spot_instance | default(false)) | bool

    # Spot instance (if 'server_spot' is 'true')
    - block:
        - name: "AWS: Gather information about EC2 Spot instances"
          amazon.aws.ec2_instance_info:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            region: "{{ server_location }}"
            filters:
              instance-lifecycle: "spot"
              instance-type: "{{ server_type }}"
              instance-state-name: ["pending", "running", "shutting-down", "stopping", "stopped"]
              "tag:Name": "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          loop: "{{ range(0, server_count | int) | list }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_spot_instance_info

        # if spot instances are still created, create them
        - name: "AWS: Create a request for EC2 Spot instance"
          amazon.aws.ec2_spot_instance:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            region: "{{ server_location }}"
            state: present
            launch_specification:
              instance_type: "{{ server_type }}"
              image_id: "{{ server_image }}"
              key_name: "{{ ssh_key_name }}"
              network_interfaces:
                - subnet_id: "{{ server_network }}"
                  groups: "{{ ([] if not cloud_firewall | bool else [ec2_security_group_result.group_id]) }}"
                  associate_public_ip_address: "{{ server_public_ip | bool }}"
                  delete_on_termination: true
                  device_index: 0
              block_device_mappings: "{{ [system_volume] + ([] if use_local_disk | bool else [data_volume]) }}"
            tags: "{{ cloud_provider_tags | combine({'Name': server_name | lower ~ '%02d' % (idx + 1), 'Cluster': patroni_cluster_name}) }}"
          loop: "{{ ec2_spot_instance_info.results }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_spot_request_result
          when: item.instances[0] | default('') | length < 1
          vars:
            system_volume:
              device_name: /dev/sda1
              ebs:
                volume_type: "{{ system_volume_type | default('gp3', true) }}"
                volume_size: 100 # TODO: use 'system_volume_size' variable (https://github.com/ansible-collections/amazon.aws/issues/1949)
                iops: "{{ system_volume_iops | default(3000) | int if system_volume_type | default('gp3', true) in ['gp3', 'io1', 'io2'] else omit }}"
                throughput: "{{ (system_volume_throughput | default(125) | int) if (system_volume_type | default('gp3', true)) == 'gp3' else omit }}"
                delete_on_termination: true
            data_volume:
              device_name: /dev/sdb
              ebs:
                volume_type: "{{ volume_type | default('gp3', true) }}"
                volume_size: 10 # will be redefined via the ec2_vol module
                iops: "{{ volume_iops | default(3000) | int if volume_type | default('gp3', true) in ['gp3', 'io1', 'io2'] else omit }}"
                throughput: "{{ (volume_throughput | default(125) | int) if (volume_type | default('gp3', true)) == 'gp3' else omit }}"
                delete_on_termination: true

        - name: "AWS: Wait for EC2 Spot instance to be created"
          amazon.aws.ec2_instance:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            region: "{{ server_location }}"
            filters:
              spot-instance-request-id: "{{ item.spot_request.spot_instance_request_id }}"
          loop: "{{ ec2_spot_request_result.results }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_spot_instance_wait_result
          until:
            - ec2_spot_instance_wait_result.instances[0][ip_address_type] is defined
            - ec2_spot_instance_wait_result.instances[0][ip_address_type] | length > 0
          retries: 12
          delay: 10
          when: item.spot_request.spot_instance_request_id is defined

        - name: "AWS: Rename the EC2 Spot instance"
          amazon.aws.ec2_instance:
            access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
            region: "{{ server_location }}"
            name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
            filters:
              spot-instance-request-id: "{{ item.spot_request.spot_instance_request_id }}"
            tags: "{{ cloud_provider_tags | combine({'Name': server_name | lower ~ '%02d' % (idx + 1), 'Cluster': patroni_cluster_name}) }}"
            purge_tags: false
          loop: "{{ ec2_spot_request_result.results }}"
          loop_control:
            index_var: idx
            label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          register: ec2_spot_instance_result
          until: ec2_spot_instance_result is success
          retries: 3
          delay: 10
          when: item.spot_request.spot_instance_request_id is defined
      when: server_spot | default(aws_ec2_spot_instance | default(false)) | bool

    # Combine existing and newly created instances
    - name: "Set variable: server_result"
      ansible.builtin.set_fact:
        server_result:
          results: >-
            {{
              (
                (ec2_instance_info.results | default([]))
                + (ec2_instance_result.results | default([]))
                + (ec2_spot_instance_info.results | default([]))
                + (ec2_spot_instance_result.results | default([]))
              )
              | selectattr('instances', 'defined')
              | selectattr('instances', '!=', [])
              | list
            }}

    - name: "AWS: Update instance tags"
      amazon.aws.ec2_tag:
        region: "{{ server_location }}"
        resource: "{{ item.instances[0].instance_id }}"
        state: present
        tags: "{{ cloud_provider_tags | combine({'Name': item.instances[0].tags.Name, 'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      loop: "{{ server_result.results }}"
      loop_control:
        label: "{{ item.instances[0].instance_id }}"

    - name: "AWS: Tag attached EBS volumes, network interfaces"
      amazon.aws.ec2_tag:
        region: "{{ server_location }}"
        resource: "{{ item }}"
        state: present
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      loop: >-
        {{
          (server_result.results | map(attribute='instances') | flatten
            | map(attribute='block_device_mappings') | flatten | map(attribute='ebs.volume_id') | list)
          + (server_result.results | map(attribute='instances') | flatten
            | map(attribute='network_interfaces') | flatten | map(attribute='network_interface_id') | list)
          + (server_result.results | map(attribute='instances') | flatten
            | selectattr('spot_instance_request_id', 'defined') | map(attribute='spot_instance_request_id') | list)
        }}

    # Required to allow data volume parameters to be changed after deployment.
    - name: "AWS: Ensure EBS data volume parameters"
      amazon.aws.ec2_vol:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ server_location }}"
        id: "{{ data_volume.ebs.volume_id | default('') }}"
        instance: "{{ item.instances[0].instance_id }}"
        device_name: /dev/sdb
        volume_type: "{{ volume_type | default('gp3', true) }}"
        volume_size: "{{ volume_size | int }}"
        iops: "{{ volume_iops | default(3000) | int if volume_type | default('gp3', true) in ['gp3', 'io1', 'io2'] else omit }}"
        throughput: "{{ (volume_throughput | default(125) | int) if (volume_type | default('gp3', true)) == 'gp3' else omit }}"
        modify_volume: true
        purge_tags: false
      loop: "{{ server_result.results | default([]) }}"
      loop_control:
        label: "{{ item.instances[0].tags.Name | default(item.instances[0].instance_id, true) }}"
      vars:
        data_volume: >-
          {{
            item.instances[0].block_device_mappings | default([])
            | selectattr('device_name', 'equalto', '/dev/sdb')
            | first
            | default({})
          }}
      register: ec2_volume_resize_result
      when:
        - not use_local_disk | bool
        - server_result.results is defined
        - item.instances is defined
        - data_volume.ebs.volume_id | default('') | length > 0

    # Classic Load Balancer (CLB) - previous generation
    - name: "AWS: Create Classic Load Balancer (CLB)"
      amazon.aws.elb_classic_lb:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        region: "{{ server_location }}"
        security_group_ids:
          - "{{ ec2_security_group_result.group_id }}"
        subnets:
          - "{{ server_network }}"
        instance_ids: "{{ server_result.results | map(attribute='instances') | map('first') | map(attribute='instance_id') }}"
        purge_instance_ids: true
        listeners:
          - protocol: tcp
            load_balancer_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
            instance_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
        health_check:
          ping_protocol: "{{ patroni_restapi_protocol | default('http') }}"
          ping_port: "{{ patroni_restapi_port | default('8008') }}"
          ping_path: "/{{ item }}"
          interval: 5
          timeout: 2
          unhealthy_threshold: 2
          healthy_threshold: 3
        idle_timeout: 600
        scheme: "{{ 'internet-facing' if database_public_access | bool else 'internal' }}"
        state: present
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      register: aws_elb_classic_lb
      until: aws_elb_classic_lb is success
      retries: 3
      delay: 10
      when: server_result.results | default([]) | length > 0 and
        cloud_load_balancer | bool and aws_load_balancer_type | lower == 'clb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    # Network Load Balancer (NLB)
    - name: Build NLB targets
      ansible.builtin.set_fact:
        nlb_targets: "{{ (nlb_targets | default([])) + [{'Id': item, 'Port': target_port | int}] }}"
      loop: "{{ instance_ids | default([]) }}"
      vars:
        instance_ids: "{{ (server_result | default({'results': []})) | json_query('results[].instances[].instance_id') }}"
        target_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
      when: cloud_load_balancer | bool and aws_load_balancer_type | lower == 'nlb'

    - name: "AWS: Create or modify NLB Target Group"
      community.aws.elb_target_group:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-tg-{{ item }}"
        region: "{{ server_location }}"
        vpc_id: "{{ vpc_id }}"
        protocol: "TCP"
        port: "{{ target_port }}"
        preserve_client_ip_enabled: true
        health_check_protocol: "{{ patroni_restapi_protocol | default('http') }}"
        health_check_port: "{{ patroni_restapi_port | default('8008') }}"
        health_check_path: "/{{ item }}"
        health_check_interval: 5
        health_check_timeout: 2
        unhealthy_threshold_count: 2
        healthy_threshold_count: 3
        successful_response_codes: "200"
        target_type: instance
        targets: "{{ nlb_targets | default([]) }}"
        modify_targets: true
        wait: false
        state: present
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-tg-{{ item }}"
      vars:
        target_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
      when: cloud_load_balancer | bool and aws_load_balancer_type | lower == 'nlb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "AWS: Create Network Load Balancer (NLB)"
      community.aws.elb_network_lb:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        region: "{{ server_location }}"
        subnets:
          - "{{ server_network }}"
        listeners:
          - Protocol: TCP
            Port: "{{ target_port }}"
            DefaultActions:
              - Type: forward
                TargetGroupName: "{{ patroni_cluster_name }}-tg-{{ item }}"
        cross_zone_load_balancing: true
        scheme: "{{ 'internet-facing' if database_public_access | bool else 'internal' }}"
        wait: true
        state: present
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        purge_tags: false
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      register: aws_elb_network_lb
      until: aws_elb_network_lb is success
      retries: 3
      delay: 10
      vars:
        target_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
      when: cloud_load_balancer | bool and aws_load_balancer_type | lower == 'nlb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

  when: state == 'present'

# Info
- name: Server info
  ansible.builtin.debug:
    msg:
      id: "{{ item.instances[0].instance_id | default('N/A', true) }}"
      name: "{{ item.instances[0].tags.Name | default('N/A', true) }}"
      image: "{{ item.instances[0].image_id | default('N/A', true) }}"
      type: "{{ item.instances[0].instance_type | default('N/A', true) }}"
      volume_size: "{{ volume_size }} GB"
      public_ip: "{{ item.instances[0].public_ip_address | default('N/A', true) }}"
      private_ip: "{{ item.instances[0].private_ip_address | default('N/A', true) }}"
  loop: "{{ server_result.results | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
  when:
    - server_result.results is defined
    - item.instances is defined

# Check SSH access
- name: Wait for host to be available via SSH
  ansible.builtin.wait_for:
    host: "{{ item.instances[0][ip_address_type] }}"
    port: 22
    delay: 5
    timeout: 300
  loop: "{{ server_result.results | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
  when:
    - server_result.results is defined
    - item.instances is defined

# Inventory
- block:
    - name: "Inventory | Extract IP addresses"
      ansible.builtin.set_fact:
        ip_addresses: >-
          {{ ip_addresses | default([]) +
            [{
              'public_ip': item.instances[0].public_ip_address | default(''),
              'private_ip': item.instances[0].private_ip_address | default(''),
              'new_node': (cluster_scaling | default(false) | bool and item.instances[0].instance_id not in existing_instance_ids)
            }]
          }}
      vars:
        existing_instance_ids: >-
          {{
            (
              (ec2_instance_info.results | default([])) +
              (ec2_spot_instance_info.results | default([]))
            )
            | selectattr('instances','defined') | map(attribute='instances') | list | flatten
            | selectattr('instance_id','defined') | map(attribute='instance_id') | list
          }}
      loop: "{{ server_result.results | selectattr('instances', 'defined') | list }}"
      loop_control:
        label: >-
          public_ip: {{ item.instances[0].public_ip_address | default('') }},
          private_ip: {{ item.instances[0].private_ip_address | default('') }}

    - name: "Inventory | Generate in-memory inventory"
      ansible.builtin.import_tasks: inventory.yml
  when:
    - server_result.results is defined
    - (server_result.results | selectattr('instances','defined') | list | length) > 0
    - generate_inventory | default(true) | bool

# Delete the temporary ssh key from the cloud after creating the EC2 instance
- name: "AWS: Remove temporary SSH key '{{ ssh_key_name | default('') }}' from cloud"
  amazon.aws.ec2_key:
    access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
    secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
    name: "{{ ssh_key_name }}"
    region: "{{ server_location }}"
    state: absent
  register: ssh_key_result
  when:
    - ssh_key_name is defined
    - tmp_ssh_key_name is defined
    - ssh_key_name == tmp_ssh_key_name

# Delete (if state is absent)
- block:
    - name: "AWS: Delete EC2 instance"
      amazon.aws.ec2_instance:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ server_location }}"
        filters:
          instance-type: "{{ server_type }}"
          instance-state-name: ["pending", "running", "shutting-down", "stopping", "stopped"]
          "tag:Name": "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
          "tag:Cluster": "{{ patroni_cluster_name }}"
        state: absent
        wait: true
      loop: "{{ range(0, server_count | int) | list }}"
      loop_control:
        index_var: idx
        label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"

    - name: "AWS: Delete Classic Load Balancer (CLB)"
      amazon.aws.elb_classic_lb:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        region: "{{ server_location }}"
        wait: true
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      register: aws_elb_classic_lb_delete
      until: aws_elb_classic_lb_delete is success
      retries: 3
      delay: 10
      when: aws_load_balancer_type | lower == 'clb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "AWS: Delete Network Load Balancer (NLB)"
      community.aws.elb_network_lb:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        region: "{{ server_location }}"
        wait: true
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      register: aws_elb_network_lb_delete
      until: aws_elb_network_lb_delete is success
      retries: 3
      delay: 10
      when: aws_load_balancer_type | lower == 'nlb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "AWS: Delete NLB Target Group"
      community.aws.elb_target_group:
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ patroni_cluster_name }}-tg-{{ item }}"
        region: "{{ server_location }}"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
      loop_control:
        label: "{{ patroni_cluster_name }}-tg-{{ item }}"
      register: aws_elb_target_group_delete
      until: aws_elb_target_group_delete is success
      retries: 3
      delay: 10
      when: aws_load_balancer_type | lower == 'nlb' and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "AWS: Delete Security Group"
      amazon.aws.ec2_security_group:
        name: "{{ patroni_cluster_name }}-security-group"
        region: "{{ server_location }}"
        state: absent
      register: ec2_security_group_delete
      until: ec2_security_group_delete is success
      delay: 10
      retries: 3

  when: state == 'absent'
