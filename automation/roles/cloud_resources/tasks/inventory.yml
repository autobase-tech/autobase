---
# Generate in-memory inventory

# Note: for cluster scaling ansible_ssh_private_key_file is used to access existing servers.
# For new cluster deployment a temporary ssh key is generated if ssh_key_name and ssh_key_content are not provided.
- name: "Inventory | Set variable: ssh_private_key_file"
  ansible.builtin.set_fact:
    ssh_private_key_file: >-
      {{
        (ansible_ssh_private_key_file | default(''))
        if (ansible_ssh_private_key_file | default('') | length > 0)
        else (lookup('env','HOME') ~ '/.ssh/' ~ (tmp_ssh_key_name | default('')))
      }}
  when:
    - (ssh_key_name is defined and tmp_ssh_key_name is defined and ssh_key_name == tmp_ssh_key_name)
      or (ansible_ssh_private_key_file | default('') | length > 0)

- name: "Inventory | Add host to 'postgres_cluster', 'master' groups"
  ansible.builtin.add_host:
    name: "{{ item.private_ip }}"
    groups:
      - postgres_cluster
      - master
    ansible_ssh_host: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default(None) }}"
    new_node: "{{ item.new_node | default(omit) }}"
    bind_address: "{{ item.private_ip }}"
    server_zone: "{{ item.zone | default(omit, true) }}"
  loop: "{{ [ip_addresses[0]] }}" # add the first item in the list
  loop_control:
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
  changed_when: false

- name: "Inventory | Add host to 'postgres_cluster', 'replica' groups"
  ansible.builtin.add_host:
    name: "{{ item.private_ip }}"
    groups:
      - postgres_cluster
      - replica
    ansible_ssh_host: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default(None) }}"
    new_node: "{{ item.new_node | default(omit) }}"
    bind_address: "{{ item.private_ip }}"
    server_zone: "{{ item.zone | default(omit, true) }}"
  loop: "{{ ip_addresses[1:] }}" # start with the 2nd item of the list
  loop_control:
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
  when: ip_addresses | length > 1 # only if there is more than one item
  changed_when: false

- name: "Inventory | Add host to 'balancers' group"
  ansible.builtin.add_host:
    name: "{{ item.private_ip }}"
    group: balancers
    ansible_ssh_host: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default(None) }}"
    new_node: "{{ item.new_node | default(omit) }}"
    bind_address: "{{ item.private_ip }}"
    server_zone: "{{ item.zone | default(omit, true) }}"
  loop: "{{ ip_addresses }}"
  loop_control:
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
  changed_when: false
  when: with_haproxy_load_balancing | bool

- name: "Inventory | Add host to 'etcd_cluster' group"
  ansible.builtin.add_host:
    name: "{{ item.private_ip }}"
    group: etcd_cluster
    ansible_ssh_host: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default(None) }}"
    new_node: "{{ item.new_node | default(omit) }}"
    bind_address: "{{ item.private_ip }}"
    server_zone: "{{ item.zone | default(omit, true) }}"
  loop: "{{ ip_addresses[:7] }}" # no more than 7 servers for the etcd cluster
  loop_control:
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
  changed_when: false
  when: not dcs_exists | bool and dcs_type == "etcd"

- name: "Inventory | Add host to 'consul_instances' group"
  ansible.builtin.add_host:
    name: "{{ item.private_ip }}"
    group: consul_instances
    consul_node_role: "{{ 'server' if not (dcs_exists | default(false) | bool) and consul_index < 7 else 'client' }}"
    ansible_ssh_host: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default(None) }}"
    new_node: "{{ item.new_node | default(omit) }}"
    bind_address: "{{ item.private_ip }}"
    server_zone: "{{ item.zone | default(omit, true) }}"
  loop: "{{ ip_addresses }}"
  loop_control:
    index_var: consul_index
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
  changed_when: false
  when: dcs_type == "consul"

# Check SSH access using the Ansible connection settings of each host (user, key, port, 'ansible_ssh_common_args'),
# so servers that are reachable only through a jump host (bastion) are supported.
- name: "Inventory | Wait for hosts to be available via SSH"
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: "{{ 1800 if (cloud_provider | lower == 'gcp' and server_type is search('metal')) else 300 }}" # 30 min for GCP bare metal, 5 min for VMs
  delegate_to: "{{ item.private_ip | default(inventory_hostname) }}"
  loop: "{{ ip_addresses }}"
  loop_control:
    label: "{{ item[(server_public_ip | bool and ssh_public_access | bool) | ternary('public_ip', 'private_ip')] }}"
