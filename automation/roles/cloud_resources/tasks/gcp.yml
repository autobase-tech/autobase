---
# Check if GCP_SERVICE_ACCOUNT_CONTENTS is defined
- name: Lookup the GCP_SERVICE_ACCOUNT_CONTENTS environmental variable
  ansible.builtin.set_fact:
    gcp_service_account_contents_raw: "{{ lookup('ansible.builtin.env', 'GCP_SERVICE_ACCOUNT_CONTENTS') | default('') }}"
  no_log: true

- name: "Fail if no GCP service account information is provided"
  ansible.builtin.fail:
    msg: "GCP_SERVICE_ACCOUNT_CONTENTS is not defined or empty. Please provide GCP service account credentials."
  when: gcp_service_account_contents_raw | length < 1

# Decode GCP Service Account if base64 encoded
- name: "Set variable: gcp_service_account_contents (b64decode)"
  ansible.builtin.set_fact:
    gcp_service_account_contents: "{{ gcp_service_account_contents_raw | b64decode }}"
  no_log: true
  when: gcp_service_account_contents_raw is match('^[a-zA-Z0-9+/]+={0,2}$')

# Set GCP Service Account Contents to raw value if not base64 encoded
- name: "Set variable: gcp_service_account_contents"
  ansible.builtin.set_fact:
    gcp_service_account_contents: "{{ gcp_service_account_contents_raw }}"
  no_log: true
  when: gcp_service_account_contents is not defined

# Project info
- name: "Set variable: gcp_project"
  ansible.builtin.set_fact:
    gcp_project: "{{ (gcp_service_account_contents | from_json).get('project_id', '') }}"
  no_log: true
  changed_when: false
  when: gcp_project | default('') | length < 1

- name: "Fail if GCP project was not found"
  ansible.builtin.fail:
    msg: >-
      Unable to determine the GCP project.
      Make sure that a valid GCP service account JSON key is provided
      or explicitly set the project ID in the gcp_project variable.
  when: gcp_project | default('') | length < 1

- name: "Set variable: gcp_region, gcp_requested_zone, gcp_server_names"
  ansible.builtin.set_fact:
    gcp_region: "{{ server_location | regex_replace('-[a-z]$', '') }}"
    gcp_requested_zone: "{{ server_location if server_location is match('.*-[a-z]$') else '' }}"
    gcp_server_names: "{{ query('ansible.builtin.sequence', 'start=1 count=' ~ server_count ~ ' format=' ~ server_name | lower ~ '%02d') }}"

- name: "GCP: Gather information about regional zones"
  vitabaks.autobase.gcp_compute_zones_info:
    auth_kind: serviceaccount
    service_account_contents: "{{ gcp_service_account_contents }}"
    project: "{{ gcp_project }}"
    region: "{{ gcp_region }}"
    machine_type: "{{ server_type if state == 'present' else omit }}"
  register: gcp_zone_info

- name: "GCP: Validate region and explicit zone"
  ansible.builtin.assert:
    that:
      - gcp_zone_info.resources | length > 0
      - gcp_requested_zone | length == 0 or gcp_requested_zone in (gcp_zone_info.resources | map(attribute='name') | list)
    fail_msg: "No zones found for region '{{ gcp_region }}', or zone '{{ gcp_requested_zone }}' does not belong to it."
    quiet: true

- name: "GCP: Gather information about VM instances in all regional zones"
  google.cloud.gcp_compute_instance_info:
    auth_kind: serviceaccount
    service_account_contents: "{{ gcp_service_account_contents }}"
    project: "{{ gcp_project }}"
    zone: "{{ item }}"
    filters:
      - "name eq {{ server_name | lower | regex_escape }}[0-9]+"
  loop: "{{ gcp_zone_info.resources | map(attribute='name') | list }}"
  register: gcp_compute_instance_info

- name: "Set variable: gcp_existing_instances"
  ansible.builtin.set_fact:
    gcp_existing_instances: >-
      {{ discovered_instances | selectattr('name', 'in', gcp_server_names) | list
         if state == 'present' else discovered_instances }}
  vars:
    discovered_instances: "{{ gcp_compute_instance_info.results | map(attribute='resources') | flatten }}"

- name: "GCP: Validate unique server names across zones"
  ansible.builtin.assert:
    that: gcp_existing_instances | map(attribute='name') | unique | list | length == gcp_existing_instances | length
    fail_msg: "Multiple VM instances have the same cluster server name in different zones. Resolve the duplicate names before continuing."
    quiet: true

- name: "GCP: Validate existing VM cluster membership"
  ansible.builtin.assert:
    that: patroni_cluster_name in (item.tags['items'] | default([]))
    fail_msg: "VM '{{ item.name }}' in '{{ item.zone | basename }}' does not have the cluster tag '{{ patroni_cluster_name }}'."
    quiet: true
  loop: "{{ gcp_existing_instances }}"
  loop_control:
    label: "{{ item.name }}"

# Create (if state is present)
- block:
    # if ssh_key_content is not defined, get the user public key from the system (if exists)
    - name: "Set variable: ssh_key_content"
      ansible.builtin.set_fact:
        ssh_key_content: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
      no_log: true # do not display the public key
      when: ssh_key_content is not defined or
        ssh_key_content | length < 1

    # if server_network is not specified, use default network
    - name: "Set variable: gcp_network_name"
      ansible.builtin.set_fact:
        gcp_network_name: "{{ server_network if server_network is defined and server_network | length > 0 else 'default' }}"

    - name: "Set variable: zones_available, zones_existing, gcp_running_zones"
      ansible.builtin.set_fact:
        zones_available: "{{ [gcp_requested_zone] | intersect(running_zones) if gcp_requested_zone | length > 0 else running_zones }}"
        zones_existing: >-
          {{ dict(gcp_existing_instances | map(attribute='name') | zip(gcp_existing_instances | map(attribute='zone') | map('basename'))) }}
        gcp_running_zones: "{{ running_zones }}"
      vars:
        running_zones: >-
          {{ gcp_zone_info.resources | selectattr('status', 'equalto', 'UP')
             | selectattr('supports_machine_type', 'equalto', true) | map(attribute='name') | list }}

    - name: "Distribute servers across zones"
      ansible.builtin.import_tasks: zones.yml

    - name: "GCP: Validate that the requested VM type is available in all server zones"
      ansible.builtin.assert:
        that: server_zone_placement | map(attribute='zone') | difference(gcp_running_zones) | length == 0
        fail_msg: "Some server zones are unavailable or do not support '{{ server_type }}'. Available zones: {{ gcp_running_zones }}."
        quiet: true

    - name: "GCP: Gather information about network"
      google.cloud.gcp_compute_network_info:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        filters:
          - name = "{{ gcp_network_name }}"
      register: gcp_network_info

    - name: "GCP: Validate network"
      ansible.builtin.assert:
        that: gcp_network_info.resources | length == 1
        fail_msg: "Network '{{ gcp_network_name }}' was not found in project '{{ gcp_project }}'."
        quiet: true

    - name: "GCP: Gather information about regional subnetworks"
      google.cloud.gcp_compute_subnetwork_info:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        region: "{{ (item | split('/regions/'))[1] | split('/subnetworks/') | first }}"
        filters:
          - name = "{{ item | split('/subnetworks/') | last }}"
      loop: "{{ gcp_network_info.resources[0].subnetworks | default([]) | select('search', '/regions/' ~ gcp_region ~ '/') | list }}"
      loop_control:
        label: "{{ item | split('/subnetworks/') | last }}"
      register: gcp_subnetwork_info

    - name: "Set variable: gcp_regional_subnetworks, gcp_existing_subnetworks"
      ansible.builtin.set_fact:
        gcp_regional_subnetworks: "{{ subnetworks | rejectattr('purpose', 'defined') | list + subnetworks | selectattr('purpose', 'defined')
          | selectattr('purpose', 'equalto', 'PRIVATE') | list }}"
        gcp_existing_subnetworks: "{{ gcp_existing_instances | map(attribute='networkInterfaces') | map('first')
          | map(attribute='subnetwork') | map('basename') | unique | list }}"
      vars:
        subnetworks: "{{ gcp_subnetwork_info.results | map(attribute='resources') | flatten }}"

    - name: "GCP: Validate existing VM networking"
      ansible.builtin.assert:
        that:
          - gcp_existing_subnetworks | length <= 1
          - existing_networks | difference([requested_network]) | length == 0
        fail_msg: "Existing VMs must belong to network '{{ gcp_network_name }}' and share one regional subnetwork."
        quiet: true
      vars:
        existing_networks: "{{ gcp_existing_instances | map(attribute='networkInterfaces') | map('first')
          | map(attribute='network') | map('regex_replace', '^.*/projects/', 'projects/') | unique | list }}"
        requested_network: "{{ gcp_network_info.resources[0].selfLink | regex_replace('^.*/projects/', 'projects/') }}"

    - name: "GCP: Select regional subnetwork"
      ansible.builtin.set_fact:
        gcp_selected_subnetworks: "{{ gcp_regional_subnetworks | selectattr('name', 'equalto', requested_subnetwork) | list
          if requested_subnetwork | length > 0 else gcp_regional_subnetworks }}"
      vars:
        requested_subnetwork: "{{ gcp_subnetwork | default('', true) or (gcp_existing_subnetworks | first | default('')) }}"

    - name: "GCP: Validate regional subnetwork selection"
      ansible.builtin.assert:
        that:
          - gcp_selected_subnetworks | length == 1
          - gcp_existing_subnetworks | difference(gcp_selected_subnetworks | map(attribute='name') | list) | length == 0
        fail_msg: >-
          Specify 'gcp_subnetwork' as the name of one private subnetwork in network '{{ gcp_network_name }}', region '{{ gcp_region }}'.
          Existing VMs must already use this subnetwork. Available subnetworks: {{ gcp_regional_subnetworks | map(attribute='name') | list }}.
        quiet: true

    - name: "GCP: Extract regional ip_ranges for network '{{ gcp_network_name | default('default') }}'"
      ansible.builtin.set_fact:
        gcp_network_ip_ranges: >-
          {{
            gcp_subnetwork_info.results | default([])
            | map(attribute='resources') | map('default', []) | list | flatten
            | map(attribute='ipCidrRange') | list | unique
          }}

    # Firewall
    - name: "GCP: Create or modify SSH public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-ssh-public"
        description: "Firewall rule for public SSH access to Postgres cluster servers"
        allowed:
          - ip_protocol: tcp
            ports:
              - "{{ ansible_ssh_port | default(22) }}"
        source_ranges: "{{ ssh_public_allowed_ips | default('0.0.0.0/0', true) | split(',') }}"
        target_tags:
          - "{{ patroni_cluster_name }}" # Only VMs with this tag will be affected
        network:
          selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
        state: present
      when:
        - ssh_public_access | bool
        - server_public_ip | bool
        - cloud_firewall | bool

    - name: "GCP: Create or modify Netdata public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-netdata-public"
        description: "Firewall rule for public Netdata monitoring access"
        allowed:
          - ip_protocol: tcp
            ports:
              - "{{ netdata_port | default('19999') }}"
        source_ranges: "{{ netdata_public_allowed_ips | default('0.0.0.0/0', true) | split(',') }}"
        target_tags:
          - "{{ patroni_cluster_name }}" # Only VMs with this tag will be affected
        network:
          selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
        state: present
      when:
        - netdata_install | bool
        - netdata_public_access | bool
        - cloud_firewall | bool

    - name: "GCP: Create or modify Database public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-database-public"
        description: "Firewall rule for public database access"
        allowed:
          - ip_protocol: tcp
            ports: "{{ allowed_ports }}"
        source_ranges: "{{ database_public_allowed_ips | default('0.0.0.0/0', true) | split(',') }}"
        target_tags:
          - "{{ patroni_cluster_name }}" # Only VMs with this tag will be affected
        network:
          selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
        state: present
      vars:
        allowed_ports: >-
          {{
            ([postgresql_port | default('5432')] if not with_haproxy_load_balancing | bool and not pgbouncer_install | bool else []) +
            ([pgbouncer_listen_port | default('6432')] if not with_haproxy_load_balancing | bool and pgbouncer_install | bool else []) +
            ([haproxy_listen_port.master | default('5000'),
              haproxy_listen_port.replicas | default('5001'),
              haproxy_listen_port.replicas_sync | default('5002'),
              haproxy_listen_port.replicas_async | default('5003')] if with_haproxy_load_balancing | bool else [])
          }}
      when:
        - database_public_access | bool
        - cloud_firewall | bool

    - name: "GCP: Create or modify Postgres cluster firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-firewall-rule"
        description: "Firewall rule for Postgres cluster"
        allowed:
          - ip_protocol: tcp
            ports: "{{ allowed_ports }}"
        source_ranges: "{{ gcp_network_ip_ranges }}"
        target_tags:
          - "{{ patroni_cluster_name }}" # Only VMs with this tag will be affected
        network:
          selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
        state: present
      vars:
        allowed_ports: >-
          {{
            [ansible_ssh_port | default('22')] +
            ([netdata_port | default('19999')] if netdata_install | bool else []) +
            ([pgbouncer_listen_port | default('6432')] if pgbouncer_install | bool else []) +
            [postgresql_port | default('5432')] +
            [patroni_restapi_port | default('8008')] +
            ([haproxy_listen_port.master | default('5000'),
              haproxy_listen_port.replicas | default('5001'),
              haproxy_listen_port.replicas_sync | default('5002'),
              haproxy_listen_port.replicas_async | default('5003'),
              haproxy_listen_port.stats | default('7000')] if with_haproxy_load_balancing | bool else []) +
            ([etcd_client_port | default('2379'), etcd_peer_port | default('2380')] if dcs_type == 'etcd' else []) +
            ([consul_ports_dns | default('8600'),
              consul_ports_http | default('8500'),
              consul_ports_rpc | default('8400'),
              consul_ports_serf_lan | default('8301'),
              consul_ports_serf_wan | default('8302'),
              consul_ports_server | default('8300')] if dcs_type == 'consul' else [])
          }}
      when: cloud_firewall | bool

    # if 'cloud_load_balancer' is 'true'
    # https://cloud.google.com/load-balancing/docs/tcp#firewall-rules
    - name: "GCP: Create health checks and LB firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-lb-firewall-rule"
        description: "Firewall rule for Health Checks and Load Balancer access to the database"
        priority: 900
        allowed:
          - ip_protocol: tcp
            ports:
              - "{{ patroni_restapi_port | default('8008') }}"
              - "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
        source_ranges:
          - "35.191.0.0/16"
          - "130.211.0.0/22"
        target_tags:
          - "{{ patroni_cluster_name }}" # Only VMs with this tag will be affected
        network:
          selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
        state: present
      when: cloud_load_balancer | bool

    # Server and volume
    - name: "GCP: Create or modify VM instance"
      google.cloud.gcp_compute_instance:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        zone: "{{ item.zone }}"
        name: "{{ item.name }}"
        machine_type: "{{ server_type }}"
        disks: "{{ existing_disks_json | from_json if item.name in zones_existing else [system_disk] + ([] if use_local_disk | bool else [data_disk]) }}"
        network_interfaces:
          - network:
              selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
            subnetwork:
              selfLink: "{{ gcp_selected_subnetworks[0].selfLink }}"
            access_configs: "{{ [{'name': 'External NAT', 'type': 'ONE_TO_ONE_NAT'}] if server_public_ip | bool else omit }}"
        metadata: "{{ {'ssh-keys': 'root:' ~ ssh_key_content} if item.name not in zones_existing else omit }}"
        scheduling:
          on_host_maintenance: "{{ 'TERMINATE' if (server_spot | bool or server_type is search('metal')) else 'MIGRATE' }}"
          preemptible: "{{ server_spot | default(gcp_compute_instance_preemptible | default(false)) | bool }}"
        tags:
          items: "{{ existing_vm.tags['items'] if item.name in zones_existing else [patroni_cluster_name] }}"
        status: "{{ gcp_instance_status | default('RUNNING') }}"
        state: present
        labels: >-
          {{
            existing_vm.labels | default({}) if item.name in zones_existing
            else dict(cloud_provider_tags.keys() | map('lower') | zip(cloud_provider_tags.values() | map('lower')))
            | combine({'cluster': patroni_cluster_name | lower})
          }}
      loop: "{{ server_zone_placement }}"
      loop_control:
        label: "{{ item.name }} ({{ item.zone }})"
      register: server_result
      until: server_result is success
      delay: 10
      retries: 3
      vars:
        existing_vm: "{{ gcp_existing_instances | selectattr('name', 'equalto', item.name) | first | default({}) }}"
        # Preserve disk attachments on existing VMs; initialize_params is only for new VMs.
        existing_disks_json: >-
          [
            {% for disk in existing_vm.disks | default([]) %}
              {
                "boot": {{ disk.boot | default(false) | to_json }},
                "auto_delete": {{ disk.autoDelete | default(false) | to_json }},
                "mode": {{ disk.mode | default('READ_WRITE') | to_json }},
                "device_name": {{ disk.deviceName | to_json }},
                "type": {{ disk.type | default('PERSISTENT') | to_json }}
                {% if disk.source is defined %}, "source": { "selfLink": {{ disk.source | to_json }} }{% endif %}
              }{% if not loop.last %},{% endif %}
            {% endfor %}
          ]
        system_disk:
          device_name: "{{ item.name }}-system"
          auto_delete: true
          boot: true
          initialize_params:
            disk_name: "{{ item.name }}-system"
            source_image: "{{ server_image }}"
            disk_size_gb: "{{ system_volume_size | default('80') }}"
            disk_type: "{{ system_volume_type | default('pd-ssd', true) }}"
        data_disk:
          device_name: "{{ item.name }}-storage"
          auto_delete: true
          initialize_params:
            disk_name: "{{ item.name }}-storage"
            disk_size_gb: "{{ volume_size | int }}"
            disk_type: "{{ volume_type | default('pd-ssd', true) }}"

    # Required to allow data disk size to be changed after deployment.
    - name: "GCP: Ensure data disk size"
      google.cloud.gcp_compute_disk:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        zone: "{{ item.zone }}"
        name: "{{ item.name }}-storage"
        size_gb: "{{ volume_size | int }}"
        state: present
      loop: "{{ server_zone_placement }}"
      loop_control:
        label: "{{ item.name }}-storage ({{ item.zone }})"
      when: not use_local_disk | bool

    # Load Balancer
    # This block creates Global External classic proxy Network Load Balancer.
    # Global external classic proxy Network Load Balancer. The google.cloud.gcp_compute_target_tcp_proxy module supports only global resources.
    # Internal proxy load balancer support is tracked in: https://github.com/autobase-tech/autobase/issues/753 (TODO)
    - block:
        - name: "GCP: [Load Balancer] Create instance group"
          google.cloud.gcp_compute_instance_group:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}"
            description: "{{ patroni_cluster_name }} instance group"
            region: "{{ gcp_region }}"
            zone: "{{ item }}"
            named_ports:
              - name: postgres
                port: "{{ postgresql_port | default('5432') }}"
              - name: pgbouncer
                port: "{{ pgbouncer_listen_port | default('6432') }}"
            network:
              selfLink: "{{ gcp_network_info.resources[0].selfLink }}"
            instances: >-
              {{
                server_result.results
                | selectattr('zone', 'search', '/zones/' ~ item ~ '$')
                | map(attribute='selfLink')
                | map('community.general.dict_kv', 'selfLink')
                | list
              }}
            state: present
          loop: "{{ server_zone_placement | map(attribute='zone') | unique | sort }}"
          register: instance_group

        - name: "GCP: [Load Balancer] Build zonal backends"
          ansible.builtin.set_fact:
            gcp_lb_backends: >-
              {{
                instance_group.results
                | map(attribute='selfLink')
                | map('community.general.dict_kv', 'group')
                | map('combine', {
                    'balancing_mode': 'CONNECTION',
                    'max_connections_per_instance': gcp_lb_max_connections | default(10000) | int
                  })
                | list
              }}

        - name: "GCP: [Load Balancer] Create health check"
          google.cloud.gcp_compute_health_check:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}-{{ item }}-hc"
            description: "{{ patroni_cluster_name }} {{ item }} health check"
            type: "{{ patroni_restapi_protocol | upper }}"
            http_health_check: "{{ ({'port': patroni_restapi_port|int, 'request_path': '/' ~ item})
              if (patroni_restapi_protocol | lower) == 'http' else omit }}"
            https_health_check: "{{ ({'port': patroni_restapi_port|int, 'request_path': '/' ~ item})
              if (patroni_restapi_protocol | lower) == 'https' else omit }}"
            check_interval_sec: "{{ gcp_compute_health_check_interval_sec | default(3) }}"
            timeout_sec: "{{ gcp_compute_health_check_check_timeout_sec | default(2) }}"
            unhealthy_threshold: "{{ gcp_compute_health_check_unhealthy_threshold | default(2) }}"
            healthy_threshold: "{{ gcp_compute_health_check_healthy_threshold | default(3) }}"
            state: present
          loop:
            - "primary"
            - "replica"
            - "sync"
            - "async"
          loop_control:
            label: "{{ patroni_cluster_name }}-{{ item }}-hc"
          register: health_check
          when: item == 'primary' or
            (item == 'replica' and cloud_load_balancer_replica | bool and server_count | int > 1) or
            (item == 'sync' and cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool) or
            (item == 'async' and cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool)

        - name: "GCP: [Load Balancer] Create backend service"
          google.cloud.gcp_compute_backend_service:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}-{{ item }}"
            description: "{{ patroni_cluster_name }} {{ item }} backend"
            protocol: "TCP"
            port_name: "{{ 'pgbouncer' if pgbouncer_install | bool else 'postgres' }}"
            load_balancing_scheme: "EXTERNAL"
            backends: "{{ gcp_lb_backends }}"
            health_checks: "{{ health_check.results | selectattr('item', 'equalto', item) | map(attribute='selfLink') | list }}"
            timeout_sec: "{{ gcp_compute_backend_service_timeout_sec | default(5) }}"
            log_config:
              enable: "{{ gcp_compute_backend_service_log_enable | default(false) }}"
            state: present
          loop:
            - "primary"
            - "replica"
            - "sync"
            - "async"
          loop_control:
            label: "{{ patroni_cluster_name }}-{{ item }}"
          register: backend_service
          until: backend_service is success
          delay: 2
          retries: 3
          when: item == 'primary' or
            (item == 'replica' and cloud_load_balancer_replica | bool and server_count | int > 1) or
            (item == 'sync' and cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool) or
            (item == 'async' and cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool)

        - name: "GCP: [Load Balancer] Create target TCP proxy"
          google.cloud.gcp_compute_target_tcp_proxy:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}-{{ item }}-proxy"
            description: "{{ patroni_cluster_name }} {{ item }} TCP Proxy"
            service:
              selfLink: "{{ backend_service.results | selectattr('item', 'equalto', item) | map(attribute='selfLink') | first }}"
            proxy_header: "NONE"
            state: present
          loop:
            - "primary"
            - "replica"
            - "sync"
            - "async"
          loop_control:
            label: "{{ patroni_cluster_name }}-{{ item }}-proxy"
          register: target_tcp_proxy
          when: item == 'primary' or
            (item == 'replica' and cloud_load_balancer_replica | bool and server_count | int > 1) or
            (item == 'sync' and cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool) or
            (item == 'async' and cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool)

        - name: "GCP: [Load Balancer] Reserve static IP address"
          google.cloud.gcp_compute_global_address:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}-{{ item }}-ip"
            description: "{{ patroni_cluster_name }} {{ item }} load balancer IP address"
            address_type: "EXTERNAL"
            ip_version: "IPV4"
            state: present
          loop:
            - "primary"
            - "replica"
            - "sync"
            - "async"
          loop_control:
            label: "{{ patroni_cluster_name }}-{{ item }}-ip"
          register: load_balancer_ip
          when: item == 'primary' or
            (item == 'replica' and cloud_load_balancer_replica | bool and server_count | int > 1) or
            (item == 'sync' and cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool) or
            (item == 'async' and cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool)

        - name: "GCP: [Load Balancer] Create forwarding rule"
          google.cloud.gcp_compute_global_forwarding_rule:
            auth_kind: "serviceaccount"
            service_account_contents: "{{ gcp_service_account_contents }}"
            project: "{{ gcp_project | default('') }}"
            name: "{{ patroni_cluster_name }}-{{ item }}-fr"
            description: "{{ patroni_cluster_name }} {{ item }} forwarding rule"
            load_balancing_scheme: "EXTERNAL"
            ip_address: "{{ (load_balancer_ip.results | selectattr('item', 'equalto', item) | map(attribute='address') | first) }}"
            ip_protocol: "TCP"
            port_range: "{{ target_port }}-{{ target_port }}"
            target: "{{ target_tcp_proxy.results | selectattr('item', 'equalto', item) | map(attribute='selfLink') | first }}"
            state: present
          loop:
            - "primary"
            - "replica"
            - "sync"
            - "async"
          loop_control:
            label: "{{ patroni_cluster_name }}-{{ item }}-fr"
          register: gcp_load_balancer
          vars:
            target_port: "{{ pgbouncer_listen_port | default('6432') if pgbouncer_install | bool else postgresql_port | default('5432') }}"
          when: item == 'primary' or
            (item == 'replica' and cloud_load_balancer_replica | bool and server_count | int > 1) or
            (item == 'sync' and cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool) or
            (item == 'async' and cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool)
      when: cloud_load_balancer | bool

  when: state == 'present'

# Info
- name: Server info
  ansible.builtin.debug:
    msg:
      id: "{{ item.id | default('N/A', true) }}"
      name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) | default('N/A', true) }}"
      image: "{{ item.disks[0].licenses[0] | basename | default('N/A', true) }}"
      type: "{{ item.machineType | basename | default('N/A', true) }}"
      zone: "{{ item.zone | basename | default('N/A', true) }}"
      volume_size: "{{ volume_size | default('N/A', true) }} GB"
      public_ip: "{{ item.networkInterfaces[0].accessConfigs[0].natIP | default('N/A', true) }}"
      private_ip: "{{ item.networkInterfaces[0].networkIP | default('N/A', true) }}"
  loop: "{{ server_result.results }}"
  loop_control:
    index_var: idx
    label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
  when:
    - server_result.results is defined
    - item.networkInterfaces is defined

# Inventory (includes the SSH access check)
- block:
    - name: "Inventory | Extract IP addresses"
      ansible.builtin.set_fact:
        ip_addresses: >-
          {{ ip_addresses | default([]) +
            [{
              'public_ip': item.networkInterfaces[0].accessConfigs[0].natIP | default(''),
              'private_ip': item.networkInterfaces[0].networkIP | default(''),
              'zone': item.zone | basename,
              'new_node': (cluster_scaling | default(false) | bool and item.id not in existing_instance_ids)
            }]
          }}
      vars:
        existing_instance_ids: >-
          {{
            gcp_existing_instances | map(attribute='id') | list
          }}
      loop: "{{ server_result.results | selectattr('networkInterfaces', 'defined') | list }}"
      loop_control:
        label: >-
          public_ip: {{ item.networkInterfaces[0].accessConfigs[0].natIP | default('') }},
          private_ip: {{ item.networkInterfaces[0].networkIP | default('') }}

    - name: "Inventory | Generate in-memory inventory"
      ansible.builtin.import_tasks: inventory.yml
  when:
    - server_result.results is defined
    - (server_result.results | selectattr('networkInterfaces', 'defined') | list | length) > 0
    - generate_inventory | default(true) | bool

# Delete (if state is absent)
# The forwarding rule and TCP proxy modules require target/service even when deleting.
# Creation results are unavailable here, so use the known resource paths for these parameters.
- block:
    - name: "GCP: Delete VM instance"
      google.cloud.gcp_compute_instance:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        zone: "{{ item.zone | basename }}"
        name: "{{ item.name }}"
        state: absent
      loop: "{{ gcp_existing_instances }}"
      loop_control:
        label: "{{ item.name }} ({{ item.zone | basename }})"

    - name: "GCP: [Load Balancer] Delete forwarding rule"
      google.cloud.gcp_compute_global_forwarding_rule:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}-fr"
        target: "/global/targetTcpProxies/{{ patroni_cluster_name }}-{{ item }}-proxy"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}-fr"
      when: item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool)

    - name: "GCP: [Load Balancer] Delete static IP address"
      google.cloud.gcp_compute_global_address:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}-ip"
        address_type: "EXTERNAL"
        ip_version: "IPV4"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}-ip"
      when: item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool)

    - name: "GCP: [Load Balancer] Delete target TCP proxy"
      google.cloud.gcp_compute_target_tcp_proxy:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}-proxy"
        service:
          selfLink: "/global/backendServices/{{ patroni_cluster_name }}-{{ item }}"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}-proxy"
      when: item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool)

    - name: "GCP: [Load Balancer] Delete backend service"
      google.cloud.gcp_compute_backend_service:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      when: item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool)

    - name: "GCP: [Load Balancer] Delete health check"
      google.cloud.gcp_compute_health_check:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-{{ item }}-hc"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}-hc"
      when: item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool)

    - name: "GCP: [Load Balancer] Delete instance group"
      google.cloud.gcp_compute_instance_group:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}"
        region: "{{ gcp_region }}"
        zone: "{{ item }}"
        state: absent
      loop: "{{ gcp_zone_info.resources | map(attribute='name') | list }}"

    - name: "GCP: Delete SSH public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-ssh-public"
        state: absent

    - name: "GCP: Delete Netdata public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-netdata-public"
        state: absent

    - name: "GCP: Delete Database public firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-database-public"
        state: absent

    - name: "GCP: Delete Postgres cluster firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-firewall-rule"
        state: absent

    - name: "GCP: Delete health checks and LB firewall rule"
      google.cloud.gcp_compute_firewall:
        auth_kind: "serviceaccount"
        service_account_contents: "{{ gcp_service_account_contents }}"
        project: "{{ gcp_project | default('') }}"
        name: "{{ patroni_cluster_name }}-lb-firewall-rule"
        state: absent

  when: state == 'absent'
