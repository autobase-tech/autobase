---
# Create (if state is present)
- block:
    - name: "Set variable: azure_region, azure_resource_group_name, azure_network_name, azure_server_names"
      ansible.builtin.set_fact:
        azure_region: "{{ server_location | lower | replace(' ', '') }}"
        azure_resource_group_name: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        azure_network_name: "{{ server_network | default(azure_virtual_network | default('postgres-cluster-network'), true) }}"
        azure_server_names: "{{ query('ansible.builtin.sequence', 'start=1 count=' ~ server_count ~ ' format=' ~ server_name | lower ~ '%02d') }}"

    - name: "Azure: Gather information about availability zones"
      vitabaks.autobase.azure_compute_zones_info:
        location: "{{ azure_region }}"
        vm_size: "{{ server_type }}"
      register: azure_zone_info

    - name: "Azure: Validate VM SKU availability"
      ansible.builtin.assert:
        that:
          - azure_zone_info.regional_available
          - azure_zone_info.zones | length == 0 or azure_zone_info.zones_available | length > 0
        fail_msg: >-
          VM SKU '{{ server_type }}' is restricted in '{{ azure_region }}' for this subscription.
          Offered zones: {{ azure_zone_info.zones }}. Available zones: {{ azure_zone_info.zones_available }}.
        quiet: true

    - name: "Azure: Gather information about the existing resource group"
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ azure_resource_group_name }}"
      register: azure_resource_group_info

    - name: "Azure: Gather information about existing virtual machines"
      azure.azcollection.azure_rm_virtualmachine_info:
        resource_group: "{{ azure_resource_group_name }}"
      register: azure_vm_info
      when: azure_resource_group_info.resourcegroups | length > 0

    - name: "Set variable: azure_existing_vms, zones_available, zones_existing"
      ansible.builtin.set_fact:
        azure_existing_vms: "{{ azure_vm_info.vms | default([]) | selectattr('name', 'in', azure_server_names) | list }}"
        zones_available: "{{ azure_zone_info.zones_available }}"
        zones_existing: {}

    - name: "Azure: Validate existing virtual machines"
      ansible.builtin.assert:
        that:
          - item.location | lower | replace(' ', '') == azure_region
          - (item.tags | default({}, true)).get('Cluster', '') == patroni_cluster_name
          - item.zones | default([], true) | length <= 1
        fail_msg: "VM '{{ item.name }}' must belong to cluster '{{ patroni_cluster_name }}' in region '{{ azure_region }}'."
        quiet: true
      loop: "{{ azure_existing_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Azure: Record existing VM placement, including regional VMs without a zone"
      ansible.builtin.set_fact:
        zones_existing: "{{ zones_existing | combine({item.name: (item.zones | default([], true) | first | default('') | string)}) }}"
      loop: "{{ azure_existing_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Distribute servers across zones"
      ansible.builtin.import_tasks: zones.yml
      when: zones_available | length > 0

    - name: "Azure: Keep regional placement when the VM SKU does not support zones"
      block:
        - name: "Azure: Validate regional placement options"
          ansible.builtin.assert:
            that:
              - server_zones is sequence and server_zones is not string and server_zones | length == 0
              - server_placement is mapping and server_placement | length == 0
              - server_zones_count | int == 1
              - zones_existing.values() | reject('equalto', '') | list | length == 0
            fail_msg: >-
              VM SKU '{{ server_type }}' does not support availability zones in '{{ azure_region }}'.
              To allow regional placement, explicitly set 'server_zones_count: 1' and leave 'server_zones'
              and 'server_placement' empty. Existing VMs must also use regional placement.
            quiet: true

        - name: "Azure: WARNING: availability zones are not supported for this VM SKU"
          ansible.builtin.debug:
            msg: >-
              VM SKU '{{ server_type }}' does not support availability zones in '{{ azure_region }}'.
              Servers will use regional placement without protection against a zone failure.

        - name: "Set variable: server_zone_placement"
          ansible.builtin.set_fact:
            server_zone_placement: "{{ azure_server_names | map('community.general.dict_kv', 'name') | map('combine', {'zone': ''}) | list }}"
      when: zones_available | length == 0

    # if ssh_key_content is not defined, get the user public key from the system (if exists)
    - name: "Set variable: ssh_key_content"
      ansible.builtin.set_fact:
        ssh_key_content: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
      no_log: true # do not display the public key
      when: ssh_key_content is not defined or ssh_key_content | length < 1

    - name: "Azure: Create resource group"
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ azure_resource_group_name }}"
        location: "{{ azure_region }}"
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true

    # if server_network is not specified, create a network and subnet
    - block:
        - name: "Azure: Create virtual network"
          azure.azcollection.azure_rm_virtualnetwork:
            resource_group: "{{ azure_resource_group_name }}"
            name: "{{ azure_network_name }}"
            location: "{{ azure_region }}"
            address_prefixes_cidr: ["{{ azure_virtual_network_prefix | default('10.0.0.0/16') }}"]
            tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
            append_tags: true

        - name: "Azure: Create subnet"
          azure.azcollection.azure_rm_subnet:
            resource_group: "{{ azure_resource_group_name }}"
            name: "{{ azure_subnet | default('postgres-cluster-subnet') }}"
            address_prefix_cidr: "{{ azure_subnet_prefix | default('10.0.1.0/24') }}"
            virtual_network: "{{ azure_virtual_network | default('postgres-cluster-network') }}"
      when: server_network | length < 1

    - name: "Azure: Gather information about network"
      azure.azcollection.azure_rm_virtualnetwork_info:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ azure_network_name }}"
      register: network_info

    - name: "Azure: Validate virtual network and selected subnet"
      ansible.builtin.assert:
        that:
          - network_info.virtualnetworks | length == 1
          - network_info.virtualnetworks[0].location | lower | replace(' ', '') == azure_region
          - selected_subnets | length == 1
        fail_msg: "VNet '{{ azure_network_name }}' and subnet '{{ azure_subnet | default('postgres-cluster-subnet') }}' must exist in '{{ azure_region }}'."
        quiet: true
      vars:
        selected_subnets: "{{ (network_info.virtualnetworks | first | default({})).subnets | default([])
          | selectattr('name', 'equalto', azure_subnet | default('postgres-cluster-subnet')) | list }}"

    - name: "Set variable: azure_subnet_id"
      ansible.builtin.set_fact:
        azure_subnet_id: "{{ network_info.virtualnetworks[0].subnets
          | selectattr('name', 'equalto', azure_subnet | default('postgres-cluster-subnet')) | map(attribute='id') | first }}"

    - name: "Azure: Gather existing VM network interfaces"
      azure.azcollection.azure_rm_networkinterface_info:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ item.network_interface_names | first }}"
      loop: "{{ azure_existing_vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: azure_existing_nics

    - name: "Azure: Validate existing VM networking"
      ansible.builtin.assert:
        that:
          - item.networkinterfaces | length == 1
          - item.networkinterfaces[0].virtual_network.subnet_id | lower == azure_subnet_id | lower
        fail_msg: "VM '{{ item.item.name }}' must use subnet '{{ azure_subnet_id }}'."
        quiet: true
      loop: "{{ azure_existing_nics.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Azure: Gather existing public IP addresses"
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ azure_resource_group_name }}"
      register: azure_existing_public_ips

    - name: "Azure: Create public IP address"
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ item.name }}-public-ip"
        allocation_method: "Static"
        sku: "Standard"
        location: "{{ azure_region }}"
        zones: "{{ azure_zone_info.region_zones if azure_zone_info.region_zones | length >= 3
          and ip_name not in existing_ip_names else omit }}"
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true
      loop: "{{ server_zone_placement }}"
      loop_control:
        label: "{{ item.name }}-public-ip"
      register: public_ip_address
      vars:
        ip_name: "{{ item.name }}-public-ip"
        existing_ip_names: "{{ azure_existing_public_ips.publicipaddresses | map(attribute='name') | list }}"
      when: server_public_ip | bool

    # Security Group (Firewall)
    - name: "Azure: Create or modify Security Group"
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ patroni_cluster_name }}-security-group"
        rules: "{{ rules }}"
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true
      vars:
        rules: >-
          {{
            ([{
              'name': 'public-ssh-rule',
              'description': 'SSH public access',
              'protocol': 'Tcp',
              'destination_port_range': [ansible_ssh_port | default(22)],
              'source_address_prefix': ssh_public_allowed_ips | default('0.0.0.0/0', true) | split(','),
              'access': 'Allow',
              'priority': 1200,
              'direction': 'Inbound'
            }] if server_public_ip | bool and ssh_public_access | bool else []) +
            ([{
              'name': 'public-netdata-rule',
              'description': 'Netdata public access',
              'protocol': 'Tcp',
              'destination_port_range': [netdata_port | default('19999')],
              'source_address_prefix': netdata_public_allowed_ips | default('0.0.0.0/0', true) | split(','),
              'access': 'Allow',
              'priority': 1400,
              'direction': 'Inbound'
            }] if netdata_install | bool and netdata_public_access | bool else []) +
            ([{
              'name': 'public-database-rule',
              'description': 'Database public access',
              'protocol': 'Tcp',
              'destination_port_range': ([
                  haproxy_listen_port.master | default('5000'),
                  haproxy_listen_port.replicas | default('5001'),
                  haproxy_listen_port.replicas_sync | default('5002'),
                  haproxy_listen_port.replicas_async | default('5003')
                ] if with_haproxy_load_balancing | bool else []) +
                ([pgbouncer_listen_port | default('6432')] if not with_haproxy_load_balancing | bool and pgbouncer_install | bool else []) +
                ([postgresql_port | default('5432')] if not with_haproxy_load_balancing | bool and not pgbouncer_install | bool else []),
              'source_address_prefix': '0.0.0.0/0',
              'access': 'Allow',
              'priority': 1300,
              'direction': 'Inbound'
            }] if database_public_access | bool else []) +
            [{
              'name': 'private-postgres-cluster-rule',
              'description': 'Postgres cluster ports',
              'protocol': 'Tcp',
              'destination_port_range': [ansible_ssh_port | default(22)] +
                ([
                  haproxy_listen_port.master | default('5000'),
                  haproxy_listen_port.replicas | default('5001'),
                  haproxy_listen_port.replicas_sync | default('5002'),
                  haproxy_listen_port.replicas_async | default('5003'),
                  haproxy_listen_port.stats | default('7000')
                ] if with_haproxy_load_balancing | bool else []) +
                ([pgbouncer_listen_port | default('6432')] if pgbouncer_install | bool else []) +
                [
                  postgresql_port | default('5432'),
                  patroni_restapi_port | default('8008'),
                ] +
                ([
                  etcd_client_port | default('2379'),
                  etcd_peer_port | default('2380'),
                ] if dcs_type == 'etcd' else []) +
                ([
                  consul_ports_dns | default('8600'),
                  consul_ports_http | default('8500'),
                  consul_ports_rpc | default('8400'),
                  consul_ports_serf_lan | default('8301'),
                  consul_ports_serf_wan | default('8302'),
                  consul_ports_server | default('8300')
                ] if dcs_type == 'consul' else []) +
                ([netdata_port | default('19999')] if netdata_install | bool else []),
              'source_address_prefix': network_info.virtualnetworks[0].address_prefixes,
              'access': 'Allow',
              'priority': 1000,
              'direction': 'Inbound'
            }]
          }}
      when: cloud_firewall | bool

    # Network interface
    - name: "Azure: Create network interface"
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ item.name }}-network-interface"
        virtual_network: "{{ azure_network_name }}"
        subnet_name: "{{ azure_subnet | default('postgres-cluster-subnet') }}"
        security_group: "{{ patroni_cluster_name }}-security-group"
        ip_configurations:
          - name: ipconfig1
            primary: true
            public_ip_address_name: "{{ (item.name ~ '-public-ip') if server_public_ip | bool else None }}"
        dns_servers:
          - 8.8.8.8
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true
      loop: "{{ server_zone_placement }}"
      loop_control:
        label: "{{ item.name }}-network-interface"

    # Server and volume
    - name: "Azure: Create virtual machine"
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ item.name }}"
        state: present
        started: true
        location: "{{ azure_region }}"
        vm_size: "{{ server_type }}"
        zones: "{{ [item.zone] if item.zone | length > 0 and item.name not in zones_existing else omit }}"
        priority: "{{ 'Spot' if server_spot | default(false) | bool else 'None' }}"
        eviction_policy: "{{ 'Deallocate' if server_spot | default(false) | bool else omit }}"
        admin_username: "{{ azure_admin_username | default('azureadmin') }}"
        ssh_public_keys:
          - path: "/home/{{ azure_admin_username | default('azureadmin') }}/.ssh/authorized_keys"
            key_data: "{{ ssh_key_content }}"
        ssh_password_enabled: false
        image:
          offer: "{{ azure_vm_image_offer | default('ubuntu-24_04-lts') }}"
          publisher: "{{ azure_vm_image_publisher | default('Canonical') }}"
          sku: "{{ azure_vm_image_sku | default('server') }}"
          version: "{{ azure_vm_image_version | default('latest') }}"
        os_type: Linux
        os_disk_size_gb: "{{ system_volume_size | default('80') }}" # system disk size
        managed_disk_type: "{{ system_volume_type | default('StandardSSD_LRS', true) }}"
        data_disks: "{{ omit if item.name in zones_existing else ([] if use_local_disk | bool else [data_disk]) }}"
        network_interface_names:
          - "{{ item.name }}-network-interface"
        tags: >-
          {{
            cloud_provider_tags | combine({'Cluster': patroni_cluster_name})
            if item.name not in zones_existing
            else omit
          }}
        append_tags: true
      loop: "{{ server_zone_placement }}"
      loop_control:
        label: "{{ item.name }} ({{ 'Zone ' ~ item.zone if item.zone | length > 0 else 'regional' }})"
      register: server_result
      vars:
        data_disk:
          lun: 0
          disk_size_gb: "{{ volume_size | int }}"
          managed_disk_type: "{{ volume_type | default('StandardSSD_LRS', true) }}"

    # Required to allow data disk size to be changed after deployment without deallocating the VM.
    - name: "Azure: Ensure data disk size"
      azure.azcollection.azure_rm_manageddisk:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ item.ansible_facts.azure_vm.storage_profile.data_disks[0].name }}"
        location: "{{ azure_region }}"
        disk_size_gb: "{{ volume_size | int }}"
        state: present
      loop: "{{ server_result.results | selectattr('ansible_facts.azure_vm', 'defined') | list }}"
      loop_control:
        label: "{{ item.ansible_facts.azure_vm.storage_profile.data_disks[0].name | default('data-disk') }}"
      when:
        - not use_local_disk | bool
        - item.ansible_facts.azure_vm.storage_profile.data_disks is defined
        - item.ansible_facts.azure_vm.storage_profile.data_disks | length > 0
        - item.ansible_facts.azure_vm.storage_profile.data_disks[0].managed_disk is defined

    # Each endpoint has its own pool and Patroni health probe.
    - name: "Set variable: azure_lb_roles, azure_load_balancer_endpoints, azure_existing_lbs"
      ansible.builtin.set_fact:
        azure_lb_roles: >-
          {{ (['primary']
            + (['replica'] if cloud_load_balancer_replica | bool and server_count | int > 1 else [])
            + (['sync'] if cloud_load_balancer_replica_sync | bool and server_count | int > 1 and synchronous_mode | bool else [])
            + (['async'] if cloud_load_balancer_replica_async | bool and server_count | int > 1 and synchronous_mode | bool else []))
            if cloud_load_balancer | bool else [] }}
        azure_load_balancer_endpoints: {}
        azure_existing_lbs: {}

    - name: "Azure: Gather information about Load Balancers"
      azure.azcollection.azure_rm_loadbalancer_info:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}"
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      register: azure_lb_info

    - name: "Azure: Record existing Load Balancer configurations"
      ansible.builtin.set_fact:
        azure_existing_lbs: "{{ azure_existing_lbs | combine({item.azure_lb_role: item.loadbalancers | first | default({})}) }}"
      loop: "{{ azure_lb_info.results }}"
      loop_control:
        label: "{{ item.azure_lb_role }}"

    - name: "Azure: Validate existing Load Balancer frontend access mode"
      ansible.builtin.assert:
        that:
          - >-
            existing_frontend | length == 0 or
            ((existing_frontend.properties.publicIPAddress.id | default('') | length > 0) == (database_public_access | bool))
        fail_msg: >-
          Load Balancer '{{ patroni_cluster_name }}-{{ azure_lb_role }}' has a frontend that does not match 'database_public_access'.
          Migrate the frontend separately before changing its public/private access mode.
        quiet: true
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      vars:
        existing_frontend: "{{ azure_existing_lbs[azure_lb_role].properties.frontendIPConfigurations | default([])
          | selectattr('name', 'equalto', patroni_cluster_name ~ '-' ~ azure_lb_role ~ '-frontend') | first | default({}) }}"

    - name: "Azure: WARNING: an existing Load Balancer frontend needs zone redundancy"
      ansible.builtin.debug:
        msg: >-
          Load Balancer '{{ patroni_cluster_name }}-{{ azure_lb_role }}' has a zonal frontend or an internal frontend
          without explicit zone redundancy.
          Its address and placement are preserved. Migrate this frontend to zone redundancy separately
          before relying on the load balancer to survive a zone failure.
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      when:
        - azure_zone_info.region_zones | length > 1
        - >-
          (not database_public_access | bool and existing_frontend | length > 0
          and existing_frontend.zones | default([], true) | length < 3)
          or (azure_existing_lbs[azure_lb_role].properties.frontendIPConfigurations | default([])
          | selectattr('zones', 'defined') | selectattr('zones', '!=', None)
          | map(attribute='zones') | map('length') | select('equalto', 1) | list | length > 0)
          or (azure_existing_public_ips.publicipaddresses
          | selectattr('name', 'equalto', patroni_cluster_name ~ '-' ~ azure_lb_role ~ '-public-ip')
          | selectattr('zones', 'defined') | selectattr('zones', '!=', None)
          | map(attribute='zones') | map('length') | select('equalto', 1) | list | length > 0)
      vars:
        existing_frontend: "{{ azure_existing_lbs[azure_lb_role].properties.frontendIPConfigurations | default([])
          | selectattr('name', 'equalto', patroni_cluster_name ~ '-' ~ azure_lb_role ~ '-frontend') | first | default({}) }}"

    - name: "Azure: Create public IP addresses for Load Balancers"
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ ip_name }}"
        location: "{{ azure_region }}"
        allocation_method: Static
        sku: Standard
        zones: "{{ azure_zone_info.region_zones if azure_zone_info.region_zones | length >= 3
          and ip_name not in existing_ip_names else omit }}"
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      vars:
        ip_name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}-public-ip"
        existing_ip_names: "{{ azure_existing_public_ips.publicipaddresses | map(attribute='name') | list }}"
      register: azure_lb_public_ips
      when: database_public_access | bool

    # Read pool members before the parent update so they can be reapplied afterwards.
    - name: "Azure: Gather existing backend addresses"
      azure.azcollection.azure_rm_loadbalancerbackendaddresspool_info:
        resource_group: "{{ azure_resource_group_name }}"
        load_balancer_name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}"
        name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}-backend"
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      register: azure_backend_pool_info

    - name: "Azure: Create or modify Load Balancers"
      azure.azcollection.azure_rm_loadbalancer:
        resource_group: "{{ azure_resource_group_name }}"
        name: "{{ lb_name }}"
        location: "{{ azure_region }}"
        sku: Standard
        frontend_ip_configurations:
          - name: "{{ lb_name }}-frontend"
            public_ip_address: "{{ lb_name ~ '-public-ip' if database_public_access | bool else omit }}"
            subnet: "{{ azure_subnet_id if not database_public_access | bool else omit }}"
            private_ip_address: "{{ existing_frontend.properties.privateIPAddress | default(omit) if not database_public_access | bool else omit }}"
            private_ip_allocation_method: >-
              {{ existing_frontend.properties.privateIPAllocationMethod | default('Dynamic') if not database_public_access | bool else omit }}
            zones: >-
              {{ (existing_frontend.zones | default(omit, true) if existing_frontend else
                (azure_zone_info.region_zones if azure_zone_info.region_zones | length >= 3 else omit))
                if not database_public_access | bool else omit }}
        backend_address_pools:
          - name: "{{ lb_name }}-backend"
        probes:
          - name: "{{ lb_name }}-health-probe"
            protocol: "{{ patroni_restapi_protocol | capitalize }}"
            port: "{{ patroni_restapi_port | int }}"
            request_path: "/{{ azure_lb_role }}"
            interval: 5
            fail_count: 2
        load_balancing_rules:
          - name: "{{ lb_name }}-rule"
            frontend_ip_configuration: "{{ lb_name }}-frontend"
            backend_address_pool: "{{ lb_name }}-backend"
            probe: "{{ lb_name }}-health-probe"
            protocol: Tcp
            frontend_port: "{{ lb_port }}"
            backend_port: "{{ lb_port }}"
            idle_timeout: 10
            enable_floating_ip: false
            disable_outbound_snat: true
        tags: "{{ cloud_provider_tags | combine({'Cluster': patroni_cluster_name}) }}"
        append_tags: true
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      register: azure_load_balancers
      vars:
        lb_name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}"
        lb_port: "{{ (pgbouncer_listen_port | default(6432) if pgbouncer_install | bool else postgresql_port | default(5432)) | int }}"
        existing_frontend: "{{ azure_existing_lbs[azure_lb_role].properties.frontendIPConfigurations | default([])
          | selectattr('name', 'equalto', lb_name ~ '-frontend') | first | default({}) }}"

    - name: "Azure: Record Load Balancer connection addresses"
      ansible.builtin.set_fact:
        azure_load_balancer_endpoints: >-
          {{ azure_load_balancer_endpoints | combine({item.azure_lb_role: {
            'public_ip': (azure_lb_public_ips.results | selectattr('azure_lb_role', 'equalto', item.azure_lb_role)
              | map(attribute='state.ip_address') | first) if database_public_access | bool else '',
            'private_ip': (item.state.frontend_ip_configurations
              | selectattr('name', 'equalto', patroni_cluster_name ~ '-' ~ item.azure_lb_role ~ '-frontend')
              | first).private_ip_address | default('', true)
          }}) }}
      loop: "{{ azure_load_balancers.results }}"
      loop_control:
        label: "{{ item.azure_lb_role }}"

    - name: "Azure: Configure Load Balancer backend pools"
      azure.azcollection.azure_rm_loadbalancerbackendaddresspool:
        resource_group: "{{ azure_resource_group_name }}"
        load_balancer_name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}"
        name: "{{ patroni_cluster_name }}-{{ azure_lb_role }}-backend"
        virtual_network: "{{ existing_pool.virtual_network | default(omit, true) }}"
        sync_mode: "{{ existing_pool.sync_mode | default(omit, true) }}"
        drain_period_in_seconds: "{{ existing_pool.drain_period_in_seconds | default(omit) }}"
        tunnel_interfaces: "{{ existing_pool.tunnel_interfaces | default(omit, true) }}"
        load_balancer_backend_addresses: "{{ backend_addresses_json | from_json }}"
      loop: "{{ azure_lb_roles }}"
      loop_control:
        loop_var: azure_lb_role
      vars:
        backend_addresses_json: >-
          {%- set ns = namespace(addresses=[]) -%}
          {%- for vm in server_result.results | map(attribute='ansible_facts.azure_vm') -%}
          {%-   set ip = vm.network_profile.network_interfaces[0].properties.ip_configurations[0].private_ip_address -%}
          {%-   set ns.addresses = ns.addresses + [{
                  'name': 'address-' ~ ip, 'ip_address': ip, 'virtual_network': network_info.virtualnetworks[0].id
                }] -%}
          {%- endfor -%}
          {{ existing_pool.load_balancer_backend_addresses | default([], true)
            | community.general.lists_mergeby(ns.addresses, 'name') | unique(attribute='name') | sort(attribute='name')
            | map('dict2items') | map('rejectattr', 'value', 'none') | map('list') | map('items2dict') | to_json }}
        existing_pool: >-
          {{ (azure_backend_pool_info.results | selectattr('azure_lb_role', 'equalto', azure_lb_role)
            | map(attribute='backend_address_pools') | first | first) | default({}) }}

  when: state == 'present'

# Info
- name: Server info
  ansible.builtin.debug:
    msg:
      id: "{{ item.ansible_facts.azure_vm.id | default('N/A', true) }}"
      name: "{{ item.ansible_facts.azure_vm.name | default('N/A', true) }}"
      image: "{{ item.ansible_facts.azure_vm.storage_profile.image_reference | default('N/A', true) }}"
      type: "{{ item.ansible_facts.azure_vm.hardware_profile.vm_size | default('N/A', true) }}"
      zone: "{{ item.ansible_facts.azure_vm.zones | default([], true) | map('regex_replace', '^', 'Zone ') | first | default('regional') }}"
      volume_size: "{{ item.ansible_facts.azure_vm.storage_profile.data_disks[0].disk_size_gb | default('N/A', true) }} GB"
      volume_type: "{{ item.ansible_facts.azure_vm.storage_profile.data_disks[0].managed_disk.storage_account_type | default('N/A', true) }}"
      public_ip: >-
        {{
          (public_ip_address.results if public_ip_address is defined else [])
          | selectattr('item.name', 'equalto', item.ansible_facts.azure_vm.name) | map(attribute='state.ip_address') | first | default('N/A', true)
        }}
      private_ip: >-
        {{
          item.ansible_facts.azure_vm.network_profile.network_interfaces[0].properties.ip_configurations[0].private_ip_address | default('N/A', true)
        }}
  loop: "{{ server_result.results | default([]) | selectattr('ansible_facts.azure_vm', 'defined') | list }}"
  loop_control:
    label: "{{ item.ansible_facts.azure_vm.name }}"
  when:
    - server_result.results is defined
    - item.ansible_facts is defined

# Inventory (includes the SSH access check)
- block:
    - name: "Inventory | Extract IP addresses"
      ansible.builtin.set_fact: # yamllint disable rule:line-length
        ip_addresses: >-
          {{ ip_addresses | default([]) +
            [{
              'public_ip': (public_ip_address.results if public_ip_address is defined else []) | selectattr('item.name', 'equalto', item.ansible_facts.azure_vm.name) | map(attribute='state.ip_address') | first | default(''),
              'private_ip': item.ansible_facts.azure_vm.network_profile.network_interfaces[0].properties.ip_configurations[0].private_ip_address | default(''),
              'name': item.ansible_facts.azure_vm.name,
              'zone': item.ansible_facts.azure_vm.zones | default([], true) | first | default('') | string,
              'new_node': (cluster_scaling | default(false) | bool and item.ansible_facts.azure_vm.id not in existing_vm_ids)
            }]
          }}
      vars:
        existing_vm_ids: >-
          {{
            azure_existing_vms | map(attribute='id') | list
          }}
      loop: "{{ server_result.results | selectattr('ansible_facts.azure_vm', 'defined') | list }}"
      loop_control:
        label: >-
          public_ip: {{ (public_ip_address.results if public_ip_address is defined else []) | selectattr('item.name', 'equalto', item.ansible_facts.azure_vm.name) | map(attribute='state.ip_address') | first | default('') }},
          private_ip: {{ item.ansible_facts.azure_vm.network_profile.network_interfaces[0].properties.ip_configurations[0].private_ip_address | default('') }}

    - name: "Inventory | Keep existing Azure servers before new servers"
      ansible.builtin.set_fact:
        ip_addresses: "{{ (ip_addresses | selectattr('name', 'in', zones_existing) | sort(attribute='name'))
          + (ip_addresses | rejectattr('name', 'in', zones_existing) | sort(attribute='name')) }}"

    - name: "Inventory | Generate in-memory inventory"
      ansible.builtin.import_tasks: inventory.yml
  when:
    - server_result.results is defined
    - (server_result.results | selectattr('ansible_facts.azure_vm', 'defined') | list | length) > 0
    - generate_inventory | default(true) | bool

# Delete (if state is absent)
- block:
    - name: "Azure: Delete virtual machine"
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"
        state: absent
      loop: "{{ range(0, server_count | int) | list }}"
      loop_control:
        index_var: idx
        label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}"

    - name: "Azure: Delete network interface"
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}-network-interface"
        state: absent
      loop: "{{ range(0, server_count | int) | list }}"
      loop_control:
        index_var: idx
        label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}-network-interface"

    - name: "Azure: Delete public IP address"
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}-public-ip"
        state: absent
      loop: "{{ range(0, server_count | int) | list }}"
      loop_control:
        index_var: idx
        label: "{{ server_name | lower }}{{ '%02d' % (idx + 1) }}-public-ip"
      when: server_public_ip | bool

    - name: "Azure: Delete Load Balancer"
      azure.azcollection.azure_rm_loadbalancer:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ patroni_cluster_name }}-{{ item }}"
        location: "{{ server_location }}"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}"
      when: cloud_load_balancer | bool and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "Azure: Delete Load Balancer public IP address"
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ patroni_cluster_name }}-{{ item }}-public-ip"
        state: absent
      loop:
        - "primary"
        - "replica"
        - "sync"
        - "async"
      loop_control:
        label: "{{ patroni_cluster_name }}-{{ item }}-public-ip"
      when: database_public_access | bool and cloud_load_balancer | bool and
        (item == 'primary' or
        (item == 'replica' and server_count | int > 1) or
        (item in ['sync', 'async'] and server_count | int > 1 and synchronous_mode | bool))

    - name: "Azure: Delete Security Group"
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ azure_resource_group | default('postgres-cluster-resource-group-' ~ server_location, true) }}"
        name: "{{ patroni_cluster_name }}-security-group"
        state: absent

  when: state == 'absent'
