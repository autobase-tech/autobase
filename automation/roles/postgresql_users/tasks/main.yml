---
# Existing roles must be known before password generation: an empty password means
# "generate" on first creation and "leave unchanged" on subsequent runs.
- name: Get existing PostgreSQL users
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    query: "select rolname from pg_catalog.pg_roles"
    login_host: "127.0.0.1"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_password: "{{ patroni_superuser_password }}"
    login_db: "postgres"
  register: postgresql_existing_users_result
  changed_when: false
  when:
    - postgresql_users | default([]) | length > 0
    - postgresql_users_password_generation | default('disabled') == 'on_create'
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  tags: postgresql_users, secrets

# Build the complete loop input in one step. Generated passwords remain in the
# registered module result and can be exported without changing the source YAML.
- name: Generate PostgreSQL user passwords
  ansible.builtin.set_fact:
    postgresql_users_effective: >-
      {%- set effective_users = [] -%}
      {%- for user in postgresql_users | flatten(1) -%}
        {%- set user_flags =
          (user.flags | default('LOGIN', true) | upper | regex_replace('\\s+', '')).split(',') -%}
        {%- set generate_password =
          postgresql_users_password_generation | default('disabled') != 'disabled'
          and
          user.state | default('present') == 'present'
          and user.password | default('', true) | string | length == 0
          and 'NOLOGIN' not in user_flags
          and (
            postgresql_users_password_generation | default('disabled') == 'always'
            or user.name not in postgresql_existing_users
          ) -%}
        {%- set effective_user = user | combine(
          {'password': lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32')}
          if generate_password else {}
        ) -%}
        {%- set _ = effective_users.append(effective_user) -%}
      {%- endfor -%}
      {{ effective_users }}
  vars:
    postgresql_existing_users: >-
      {{
        (postgresql_existing_users_result | default({})).query_result
        | default([])
        | map(attribute='rolname')
        | list
      }}
  no_log: true
  when:
    - postgresql_users | default([]) | length > 0
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  tags: postgresql_users, secrets

- name: Create or modify PostgreSQL users
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    # Omit empty passwords to preserve existing credentials while allowing other attributes to change.
    password: "{{ item.password | default(omit, true) }}"
    encrypted: true
    role_attr_flags: "{{ item.flags | default('LOGIN') }}"
    conn_limit: "{{ item.conn_limit | default(omit) }}"
    login_host: "127.0.0.1"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_password: "{{ patroni_superuser_password }}"
    login_db: "postgres"
    state: "{{ item.state | default('present') }}"
  ignore_errors: "{{ postgresql_users_ignore_errors | default(false) }}"
  register: postgresql_users_result
  no_log: true # Loop items contain passwords, including generated ones.
  loop: "{{ postgresql_users_effective | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - postgresql_users | default('') | length > 0
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  tags: postgresql_users, secrets

# Export only passwords known in this run. Skipping an existing user with an empty
# password preserves the value already stored in the external secrets provider.
# A user with "secret" is stored in that secret (full name, without secrets_prefix) instead of secrets_postgresql_users_path.
# A user with "secret: false" is not exported.
- name: Collect successfully applied PostgreSQL users for secrets export
  ansible.builtin.set_fact:
    postgresql_users_for_secrets: >-
      {%- set users = [] -%}
      {%- for result in postgresql_users_result.results | default([]) -%}
        {%- if not (result.failed | default(false) | bool)
          and not (result.skipped | default(false) | bool)
          and result.item.state | default('present') == 'present'
          and result.item.password | default('', true) | string | length > 0
          and result.item.secret | default(none) is not sameas false -%}
          {%- set _ = users.append({
            'name': result.item.secret if result.item.secret | default('', true) | length > 0
              else (secrets_postgresql_users_path | default('postgresql/users') | regex_replace('/+$', '')) ~ '/' ~ result.item.name,
            'value': (result.item.password | string) if secrets_postgresql_users_format | default('json') == 'string'
              else {'username': result.item.name, 'password': result.item.password | string},
            'username': result.item.name,
            'password': result.item.password | string,
            'secret': result.item.secret | default('', true)
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ (hostvars['localhost']['postgresql_users_for_secrets'] | default([])) + users }}
  delegate_to: localhost
  delegate_facts: true
  become: false
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_export_postgresql_users | default(false) | bool
  tags: postgresql_users, secrets

# Used only by value-only secrets mode, where all users share one secret:
# removed users are deleted from that secret. Users with their own "secret" or "secret: false" are not in it.
- name: Collect removed PostgreSQL users for secrets export
  ansible.builtin.set_fact:
    postgresql_users_removed_for_secrets: >-
      {%- set users = [] -%}
      {%- for result in postgresql_users_result.results | default([]) -%}
        {%- if not (result.failed | default(false) | bool)
          and not (result.skipped | default(false) | bool)
          and result.item.state | default('present') == 'absent'
          and result.item.secret | default('', true) | length == 0
          and result.item.secret | default(none) is not sameas false -%}
          {%- set _ = users.append(result.item.name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ (hostvars['localhost']['postgresql_users_removed_for_secrets'] | default([])) + users }}
  delegate_to: localhost
  delegate_facts: true
  become: false
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_export_postgresql_users | default(false) | bool
    - secrets_aws_value_only | default(false) | bool
  tags: postgresql_users, secrets

- name: Grant roles to users
  community.postgresql.postgresql_membership:
    group: "{{ item.role | default('') }}"
    target_role: "{{ item.name }}"
    login_host: "127.0.0.1"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_password: "{{ patroni_superuser_password }}"
    login_db: "postgres"
    state: "{{ item.state | default('present') }}"
  ignore_errors: "{{ postgresql_users_ignore_errors | default(false) }}"
  no_log: true # Loop items contain passwords.
  loop: "{{ postgresql_users | flatten(1) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - postgresql_users | default('') | length > 0
    - item.role | default('') | length > 0
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
    - not ansible_check_mode # Users are not actually created in check mode, so membership would fail
  tags: postgresql_users
