---
# The upstream releases provide no rpm or deb packages, so the tar archive is used on all distributions.
- block:
    - name: Download PgDog {{ pgdog_version | default('') }}
      ansible.builtin.get_url:
        url: "{{ pgdog_package_repo }}"
        dest: "/tmp/{{ pgdog_package_repo | basename }}"
        checksum: "{{ pgdog_package_checksum | default(omit, true) }}"
        mode: "0644"
        timeout: 60
      register: get_url_result
      until: get_url_result is success
      delay: 5
      retries: 3
      environment: "{{ proxy_env | default({}) }}"

    - name: Extract PgDog {{ pgdog_version | default('') }} into /tmp
      ansible.builtin.unarchive:
        src: "/tmp/{{ pgdog_package_repo | basename }}"
        dest: /tmp/
        extra_opts:
          - --no-same-owner
        remote_src: true

    - name: Copy the PgDog {{ pgdog_version | default('') }} binary file to /usr/local/bin/
      ansible.builtin.copy:
        src: "/tmp/{{ pgdog_package_repo | basename | regex_replace('\\.tar\\.gz$', '') }}/pgdog"
        dest: /usr/local/bin/pgdog
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: "restart pgdog"

    - name: Remove the downloaded archive and the extracted files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ pgdog_package_repo | basename }}"
        - "/tmp/{{ pgdog_package_repo | basename | regex_replace('\\.tar\\.gz$', '') }}"
  when: not ansible_check_mode
  tags: pgdog_install, pgdog

- name: Configure pgdog systemd service file
  ansible.builtin.template:
    src: templates/pgdog.service.j2
    dest: /etc/systemd/system/pgdog.service
    owner: root
    group: root
    mode: "0644"
  notify: "restart pgdog"
  tags: pgdog_service, pgdog

- name: Configure pgdog
  ansible.builtin.import_tasks: config.yml

# The handlers only restart it after a change, which does not start the service on a node that is added again.
- name: Ensure pgdog service is enabled and running
  ansible.builtin.systemd:
    daemon_reload: true
    name: pgdog
    enabled: true
    state: started
  tags: pgdog_service, pgdog
