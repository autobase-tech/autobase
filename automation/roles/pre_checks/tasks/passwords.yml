---
# Generate passwords (if not defined)
- block:
    - name: Generate the missing passwords
      ansible.builtin.set_fact:
        "{{ item }}": "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      loop:
        - patroni_superuser_password
        - patroni_replication_password
        - patroni_restapi_password
      when:
        - inventory_hostname == credential_source
        - vars[item] | default('') | length < 1 # if password is not set

    - name: Set password variables for all hosts
      ansible.builtin.set_fact:
        patroni_superuser_password: "{{ hostvars[credential_source]['patroni_superuser_password'] }}"
        patroni_replication_password: "{{ hostvars[credential_source]['patroni_replication_password'] }}"
        patroni_restapi_password: "{{ hostvars[credential_source]['patroni_restapi_password'] }}"
  vars:
    credential_source: "{{ groups['master'][0] }}"
  no_log: true
  when:
    - shard_deploy_password_host is undefined
    - not (postgresql_cluster_maintenance | default(false) | bool) # exclude for config_pgcluster.yml, add_node.yml and remove_node.yml
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster

# Get current passwords (if not defined)
# for config_pgcluster.yml, add_node.yml remove_node.yml, or standby cluster
- block:
    - name: Get patroni superuser password
      ansible.builtin.shell: |
        set -o pipefail;
        grep -A10 "authentication:" /etc/patroni/patroni.yml | \
        grep -A3 "superuser" | grep "password:" | awk '{ gsub(/"/, "", $2); print $2 }' | tail -n 1
      args:
        executable: /bin/bash
      delegate_to: "{{ password_source }}"
      register: superuser_password_result
      changed_when: false
      check_mode: false # pure read; must run under --check too, or this password stays empty
      when: patroni_superuser_password | default('') | length < 1

    - name: Get patroni replication user password
      ansible.builtin.shell: |
        set -o pipefail;
        grep -A10 "authentication:" /etc/patroni/patroni.yml | \
        grep -A3 "replication" | grep "password:" | awk '{ gsub(/"/, "", $2); print $2 }' | tail -n 1
      args:
        executable: /bin/bash
      delegate_to: "{{ password_source }}"
      register: replication_password_result
      changed_when: false
      check_mode: false # see "Get patroni superuser password" above
      when: patroni_replication_password | default('') | length < 1

    - name: Get patroni restapi password
      ansible.builtin.shell: |
        set -o pipefail;
        grep -A10 "restapi:" /etc/patroni/patroni.yml | \
        grep -A3 "authentication" | grep "password:" | awk '{ gsub(/"/, "", $2); print $2 }' | tail -n 1
      args:
        executable: /bin/bash
      delegate_to: "{{ password_source }}"
      register: patroni_restapi_password_result
      changed_when: false
      check_mode: false # see "Get patroni superuser password" above
      when: patroni_restapi_password | default('') | length < 1

    - name: "Set variable: patroni_superuser_password"
      ansible.builtin.set_fact:
        patroni_superuser_password: "{{ superuser_password_result.stdout }}"
      when:
        - superuser_password_result is defined
        - superuser_password_result.stdout is defined

    - name: "Set variable: patroni_replication_password"
      ansible.builtin.set_fact:
        patroni_replication_password: "{{ replication_password_result.stdout }}"
      when:
        - replication_password_result is defined
        - replication_password_result.stdout is defined

    - name: "Set variable: patroni_restapi_password"
      ansible.builtin.set_fact:
        patroni_restapi_password: "{{ patroni_restapi_password_result.stdout }}"
      when:
        - patroni_restapi_password_result is defined
        - patroni_restapi_password_result.stdout is defined
  no_log: true
  vars:
    password_source: >-
      {{ shard_deploy_password_host | default(
           (groups.get(group_name, []) | select('in', patroni_shard_hosts) | first) if shard_id is defined and group_name in ['master', 'primary']
           else groups.get(group_name, []) | first | default(inventory_hostname)) }}
    group_name: >-
      {{
        source_group | default(
          'master' if (patroni_standby_cluster.host | default('') | length == 0) else 'source_cluster'
        )
      }}
  when:
    - shard_deploy_password_host is defined or postgresql_cluster_maintenance | default(false) | bool or
      patroni_standby_cluster.host | default('') | length > 0

- name: Read or generate the shared PgDog admin password
  ansible.builtin.import_tasks: pgdog_password.yml

# Keep the password of the Prometheus exporters database user, or generate a new one (if not defined)
- block:
    - name: Get current Prometheus exporters database password
      ansible.builtin.command: cat {{ prometheus_exporters_conf_dir }}/postgres.pass
      register: prometheus_exporters_db_password_result
      changed_when: false
      failed_when: false
      check_mode: false
      when: inventory_hostname == prometheus_exporters_password_source_host

    - name: Generate the Prometheus exporters database password
      ansible.builtin.set_fact:
        prometheus_exporters_db_password: >-
          {{ prometheus_exporters_db_password_result.stdout | default('', true)
             | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}
      when: inventory_hostname == prometheus_exporters_password_source_host

    - name: "Set variable: prometheus_exporters_db_password"
      ansible.builtin.set_fact:
        prometheus_exporters_db_password: "{{ hostvars[prometheus_exporters_password_source_host]['prometheus_exporters_db_password'] }}"
  no_log: true
  vars:
    # remove_node selects surviving nodes, which may exclude the original master.
    prometheus_exporters_password_source_host: "{{ (groups[source_group | default('master')] | select('in', ansible_play_hosts_all) | first) }}"
  when:
    - postgres_exporter_install | default(false) | bool or pgbouncer_exporter_install | default(false) | bool
    - prometheus_exporters_db_user | default('') != patroni_superuser_username # the superuser has its own password
    - prometheus_exporters_db_password | default('') | length < 1
