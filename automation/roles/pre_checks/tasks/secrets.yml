---
- name: Fail if secrets provider is unsupported
  ansible.builtin.fail:
    msg: "Unsupported secrets_provider '{{ secrets_provider }}'. Supported providers: aws."
  run_once: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_provider | lower not in ['aws']

- name: Fail if PostgreSQL user secret format is invalid
  ansible.builtin.fail:
    msg: "secrets_postgresql_users_format must be json or string."
  run_once: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_export_postgresql_users | default(false) | bool
    - secrets_postgresql_users_format | default('json') not in ['json', 'string']

- name: Fail if a PostgreSQL user secret name is invalid
  ansible.builtin.fail:
    msg: "The secret of PostgreSQL user '{{ item.name }}' must be a non-empty string, or false to skip the export."
  loop: "{{ postgresql_users | default([]) | flatten(1) }}"
  loop_control:
    label: "{{ item.name | default('unnamed user') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_export_postgresql_users | default(false) | bool
    - item.secret is defined and item.secret is not none and item.secret != '' # empty means not set
    - item.secret is not sameas false # false means not exported
    - item.secret is not string or item.secret | regex_replace('^/+|/+$', '') | length == 0

- name: Fail if secrets values is not a list
  ansible.builtin.fail:
    msg: "secrets_values must be a list."
  run_once: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_values | default([]) is not sequence or secrets_values | default([]) is string

- name: Fail if a secret entry is not a dictionary
  ansible.builtin.fail:
    msg: "Each item in secrets_values must be a dictionary."
  loop: "{{ secrets_values | default([]) }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - item is not mapping

- name: Fail if a secret name is invalid
  ansible.builtin.fail:
    msg: "Each secret must have a non-empty relative name."
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - >-
      item.name is not defined
      or item.name is not string
      or item.name | default('') | length == 0
      or (item.name is string and item.name.startswith('/'))

- name: Fail if a secret state is invalid
  ansible.builtin.fail:
    msg: "Secret state must be present or absent."
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - item.state | default('present') not in ['present', 'absent']

- name: Fail if a present secret has no value
  ansible.builtin.fail:
    msg: "Secrets with state present must have a value."
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - item.state | default('present') == 'present'
    - item.value is not defined

# The secret key marks exported PostgreSQL users whose secret name is used without secrets_prefix.
- name: Fail if a secret entry uses the reserved key secret
  ansible.builtin.fail:
    msg: "Secret '{{ item.name }}' has the reserved key 'secret'. Use 'value' for the secret value."
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - item.secret is defined

# Without these conditions, a merge entry fails at the end of the run, or replaces the whole secret in default mode.
- name: Fail if a merged secret entry cannot be merged
  ansible.builtin.fail:
    msg: >-
      Secret '{{ item.name }}' has merge: true, which cannot be used here:
      {{ secrets_merge_problems | join('; ') }}. Fix this, or remove merge: true to replace the whole value.
  vars:
    secrets_merge_problems: >-
      {{
        ([] if item.value_only | default(secrets_aws_value_only | default(false)) | bool
          else ['merge works only in value-only mode, so remove value_only: false from the entry']
          if item.value_only is defined and secrets_aws_value_only | default(false) | bool
          else ['merge works only in value-only mode, so set value_only: true on the entry or secrets_aws_value_only: true'])
        + ([] if item.value is mapping else ['value must be a dictionary with the keys to merge'])
        + ([] if secrets_aws_value_compare | default(true) | bool
          else ['merge reads the current value, so set secrets_aws_value_compare: true'])
        + ([] if secrets_aws_secret_type | default('string', true) != 'binary'
          else ['merge works only with string secrets, so set secrets_aws_secret_type: string'])
      }}
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - item.merge | default(false) | bool
    - secrets_merge_problems | length > 0

# Names are compared after secrets_prefix is applied, as in the secrets role.
- name: Fail if a PostgreSQL user secret conflicts with another secret
  ansible.builtin.fail:
    msg: >-
      These secret names are used by more than one PostgreSQL user, or by a user and another secret
      managed by Autobase: {{ secrets_conflicting_names | join(', ') }}. Each user's secret must be unique.
  vars:
    secrets_conflicting_names: >-
      {%- set prefix = ((secrets_prefix | default('') | regex_replace('/+$', '')) ~ '/')
        if secrets_prefix | default('') | length > 0 else '' -%}
      {%- set users_path = secrets_postgresql_users_path | default('postgresql/users') -%}
      {%- set own = [] -%}
      {%- set other = [] -%}
      {%- for user in postgresql_users | default([]) | flatten(1)
        if user.state | default('present') == 'present' and user.secret | default(none) is not sameas false -%}
        {%- if user.secret | default('', true) | length > 0 -%}
          {%- set _ = own.append(user.secret) -%}
        {%- elif not secrets_aws_value_only | default(false) | bool -%}
          {%- set _ = other.append(prefix ~ ((users_path | regex_replace('/+$', '')) ~ '/' ~ user.name) | regex_replace('^/+', '')) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if secrets_aws_value_only | default(false) | bool -%}
        {%- set _ = other.append(prefix ~ users_path | regex_replace('^/+', '')) -%}
      {%- endif -%}
      {%- if secrets_export_connection_info | default(false) | bool -%}
        {%- set _ = other.append(prefix ~ secrets_connection_info_path | default('postgresql/connection') | regex_replace('^/+', '')) -%}
      {%- endif -%}
      {%- for entry in secrets_values | default([]) -%}
        {%- set _ = other.append(prefix ~ entry.name | regex_replace('^/+', '')) -%}
      {%- endfor -%}
      {%- set conflicts = [] -%}
      {%- for name in own | unique if own | select('equalto', name) | list | length > 1 or name in other -%}
        {%- set _ = conflicts.append(name) -%}
      {%- endfor -%}
      {{ conflicts }}
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | length > 0
    - secrets_export_postgresql_users | default(false) | bool
    - secrets_conflicting_names | length > 0

- name: Fail if AWS Secrets Manager region is empty
  ansible.builtin.fail:
    msg: "secrets_aws_region is required when secrets_provider is aws."
  run_once: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - secrets_aws_region | default(server_location | default('')) | length == 0

- name: Fail if AWS Secrets Manager recovery window is invalid
  ansible.builtin.fail:
    msg: "secrets_aws_recovery_window must be 0, or a value from 7 through 30."
  run_once: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - >-
      (secrets_aws_recovery_window | default(30) | string) is not match('^[0-9]+$')
      or (secrets_aws_recovery_window | default(30) | int != 0
      and (secrets_aws_recovery_window | default(30) | int < 7
      or secrets_aws_recovery_window | default(30) | int > 30))

- name: Fail if AWS Secrets Manager tags is not a dictionary
  ansible.builtin.fail:
    msg: "secrets_aws_tags must be a dictionary."
  vars:
    effective_secrets_aws_tags: >-
      {{ secrets_aws_tags | default(default_secrets_aws_tags) }}
    default_secrets_aws_tags: >-
      {{ cloud_provider_tags | default({'Managed': 'autobase'}) }}
  run_once: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - effective_secrets_aws_tags is not mapping

- name: Fail if an AWS Secrets Manager tag is invalid
  ansible.builtin.fail:
    msg: "AWS Secrets Manager tag keys must be non-empty strings and values must be strings."
  loop: "{{ effective_secrets_aws_tags | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    effective_secrets_aws_tags: >-
      {{ secrets_aws_tags | default(default_secrets_aws_tags) }}
    default_secrets_aws_tags: >-
      {{ cloud_provider_tags | default({'Managed': 'autobase'}) }}
  run_once: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - item.key is not string or item.key | length == 0 or item.value is not string

- name: Fail if a value-only secret is set to absent
  ansible.builtin.fail:
    msg: >-
      Secret '{{ item.name }}' uses value-only mode and cannot have state absent.
      Value-only secrets are owned by another tool, which must delete them.
  loop: "{{ secrets_values | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed secret') }}"
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - item.value_only | default(secrets_aws_value_only | default(false)) | bool
    - item.state | default('present') == 'absent'

# Users with their own secret are written without merging, so they do not need value comparison.
- name: Fail if value-only PostgreSQL user export is used without value comparison
  ansible.builtin.fail:
    msg: >-
      In value-only mode, PostgreSQL users without their own secret are merged into one shared secret,
      which requires reading its current value. The same applies when the users path equals the connection
      info path. Set secrets_aws_value_compare to true, set a secret (or false) for every user,
      or disable secrets_export_postgresql_users.
  vars:
    secrets_shared_users: >-
      {%- set users = [] -%}
      {%- for user in postgresql_users | default([]) | flatten(1)
        if user.secret | default('', true) | length == 0 and user.secret | default(none) is not sameas false -%}
        {%- set _ = users.append(user.name) -%}
      {%- endfor -%}
      {{ users }}
  run_once: true
  no_log: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - secrets_aws_value_only | default(false) | bool
    - secrets_export_postgresql_users | default(false) | bool
    - not (secrets_aws_value_compare | default(true) | bool)
    - >-
      secrets_shared_users | length > 0
      or (
        secrets_export_connection_info | default(false) | bool
        and (secrets_postgresql_users_path | default('postgresql/users') | regex_replace('^/+|/+$', ''))
        == (secrets_connection_info_path | default('postgresql/connection') | regex_replace('^/+|/+$', ''))
      )

- name: Warn about AWS Secrets Manager settings ignored in value-only mode
  ansible.builtin.debug:
    msg: >-
      secrets_aws_value_only is enabled, so these settings are ignored for value-only secrets:
      {{ secrets_aws_ignored_settings | join(', ') }}.
  vars:
    secrets_aws_ignored_settings: >-
      {{
        ([] if secrets_aws_resource_policy | default(none) is none else ['secrets_aws_resource_policy'])
        + ([] if secrets_aws_replica | default(none) is none else ['secrets_aws_replica'])
        + ([] if secrets_aws_rotation_lambda | default('', true) | length == 0 else ['secrets_aws_rotation_lambda'])
        + ([] if secrets_aws_kms_key_id | default('', true) | length == 0 else ['secrets_aws_kms_key_id'])
        + ([] if secrets_aws_tags is not defined else ['secrets_aws_tags'])
      }}
  run_once: true
  when:
    - secrets_provider | default('') | lower == 'aws'
    - secrets_aws_value_only | default(false) | bool
    - secrets_aws_ignored_settings | length > 0
