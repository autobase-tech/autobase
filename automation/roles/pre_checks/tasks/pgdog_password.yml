---
# Keep the PgDog admin password of a running cluster, or generate a new one (if not defined)
- block:
    - name: Get current PgDog admin password
      ansible.builtin.command: >-
        sed -n '/^\[admin\]/,/^\[\[/s/^password = "\(.*\)"$/\1/p' {{ pgdog_conf_dir }}/pgdog.toml
      register: pgdog_admin_password_result
      changed_when: false
      failed_when: false
      check_mode: false
      when: inventory_hostname == pgdog_password_source_host

    - name: Generate the PgDog admin password
      ansible.builtin.set_fact:
        pgdog_admin_password: >-
          {{ pgdog_admin_password_result.stdout | default('', true)
             | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}
      when: inventory_hostname == pgdog_password_source_host

    - name: "Set variable: pgdog_admin_password"
      ansible.builtin.set_fact:
        pgdog_admin_password: "{{ hostvars[pgdog_password_source_host]['pgdog_admin_password'] }}"
  no_log: true
  vars:
    # remove_node selects surviving nodes, which may exclude the original master.
    pgdog_password_source_host: >-
      {{ shard_deploy_password_host | default(groups[source_group | default('master')] | select('in', ansible_play_hosts_all) | first) }}
  when:
    - pgdog_install | default(false) | bool
    - pgdog_admin_password | default('') | length < 1
