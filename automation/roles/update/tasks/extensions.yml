---
- name: "Get the current Patroni Cluster Leader Node"
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port }}/leader"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_leader_result
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"

- name: Get a list of databases
  ansible.builtin.command: >-
    {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc
    "select datname from pg_catalog.pg_database where datname <> 'template0'"
  environment:
    PGPASSFILE: "{{ postgresql_cli_passfile }}"
  register: databases_list
  changed_when: false
  check_mode: false
  when:
    - patroni_leader_result.status is defined
    - patroni_leader_result.status == 200

- name: Update extensions in each database
  ansible.builtin.include_tasks: update_extensions.yml
  loop: "{{ databases_list.stdout_lines }}"
  loop_control:
    loop_var: pg_target_dbname
  when: databases_list.stdout_lines is defined
