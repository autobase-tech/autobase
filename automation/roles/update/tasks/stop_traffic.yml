---
- name: "Edit patroni.yml | enable noloadbalance, nosync, nofailover"
  ansible.builtin.replace:
    path: /etc/patroni/patroni.yml
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - { regexp: "noloadbalance: false", replace: "noloadbalance: true" }
    - { regexp: "nosync: false", replace: "nosync: true" }
    - { regexp: "nofailover: false", replace: "nofailover: true" }
  loop_control:
    label: "{{ item.replace }}"

- name: Reload patroni service
  ansible.builtin.systemd:
    daemon_reload: true
    name: patroni
    enabled: true
    state: reloaded

- name: Make sure replica endpoint is unavailable
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port }}/replica"
    status_code: 503
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_replica_result
  until: patroni_replica_result.status == 503
  retries: 30
  delay: 2
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"

- name: Wait for active transactions to complete
  become: true
  become_user: postgres
  ansible.builtin.command: >-
    {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc
    "select count(*)
    from pg_stat_activity
    where pid <> pg_backend_pid()
    and backend_type = 'client backend'
    and state = 'active'"
  environment:
    PGPASSFILE: "{{ postgresql_cli_passfile }}"
  register: pg_active_count
  until: pg_active_count.stdout|int == 0
  retries: 300
  delay: 2
  changed_when: false
