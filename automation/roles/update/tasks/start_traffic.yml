---
- name: "Edit patroni.yml | restore noloadbalance, nosync, nofailover tags"
  ansible.builtin.replace:
    path: /etc/patroni/patroni.yml
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - { regexp: "noloadbalance: true", replace: "noloadbalance: false", tag: "noloadbalance" }
    - { regexp: "nosync: true", replace: "nosync: false", tag: "nosync" }
    - { regexp: "nofailover: true", replace: "nofailover: false", tag: "nofailover" }
  loop_control:
    label: "{{ item.replace }}"
  when: (item.tag ~ '=true') not in (patroni_tags | default('') | replace(' ', ''))

- name: Reload patroni service
  ansible.builtin.systemd:
    daemon_reload: true
    name: patroni
    enabled: true
    state: reloaded

- name: Make sure replica endpoint is available
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port }}/replica"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_replica_result
  until: patroni_replica_result.status == 200
  retries: 30
  delay: 2
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
  when: patroni_shard_hosts | length > 1

- name: Make sure leader endpoint is available on a single-node cluster
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port }}/leader"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_leader_result
  until: patroni_leader_result.status == 200
  retries: 30
  delay: 2
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
  when: patroni_shard_hosts | length == 1

# Warming up caches after reboot (if 'reboot_host_post_delay' is defined)
- name: "Wait {{ reboot_host_post_delay | default('') }} minutes for caches to warm up after reboot"
  ansible.builtin.pause:
    minutes: "{{ reboot_host_post_delay }}"
  when:
    - (reboot_result.rebooted is defined and reboot_result.rebooted)
    - (reboot_host_post_delay is defined and reboot_host_post_delay | int > 0)
    - (inventory_hostname in groups.get('secondary', []) and patroni_shard_replicas | length > 1)
