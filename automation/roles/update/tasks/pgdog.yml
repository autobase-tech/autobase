---
# PgDog is installed from the release archive of 'pgdog_version', not from a package.
# The service is restarted only if the binary has changed.
# Unlike the package updates, a failure is not ignored: it stops the playbook, so the other nodes keep a working PgDog.
- name: Install PgDog {{ pgdog_version }}
  ansible.builtin.include_role:
    name: vitabaks.autobase.pgdog
    tasks_from: install

# Restart it on this host before the next one is updated
- name: Restart PgDog if it was updated
  ansible.builtin.meta: flush_handlers

# A previous attempt may have installed the binary but failed to restart the service.
- name: Ensure PgDog is enabled and running
  ansible.builtin.systemd:
    name: pgdog
    enabled: true
    state: started

- name: Wait for PgDog to accept connections
  ansible.builtin.wait_for:
    host: "{{ {'0.0.0.0': '127.0.0.1', '::': '::1'}.get(pgdog_listen_addr, pgdog_listen_addr) }}"
    port: "{{ pgdog_listen_port }}"
    state: started
    connect_timeout: 1
    timeout: 60
