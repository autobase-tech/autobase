---
- name: Prepare PostgreSQL CLI password file
  ansible.builtin.import_tasks: "{{ role_path }}/../pgpass/tasks/automation.yml"
  tags: always

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  when: not point_in_time_recovery | default(false) | bool

# pip install
- ansible.builtin.import_tasks: pip.yml
  when:
    - patroni_installation_method == "pip"
    - pip_package not in system_packages
    - not point_in_time_recovery | default(false) | bool
  vars:
    pip_package: "python{{ python_version | default('3') }}-pip"
  tags: patroni, patroni_install, pip

# Patroni install
- block: # installation_method: "packages" and patroni_installation_method: "pip"
    - name: Install setuptools
      ansible.builtin.pip:
        name: setuptools<66.0.0 # https://github.com/pypa/setuptools/issues/3772
        state: latest
        executable: pip3
        extra_args: "--trusted-host=pypi.python.org --trusted-host=pypi.org --trusted-host=files.pythonhosted.org"
        umask: "0022"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_requirements_repo | length < 1

    # Use master requirements if patroni_install_version is 'latest' or explicitly forced via patroni_latest_requirements
    - name: Download Patroni requirements.txt
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/patroni/patroni/{{
            'refs/heads/master' if patroni_install_version == 'latest' or patroni_latest_requirements | default(false)
            else 'refs/tags/v' ~ (patroni_install_version | regex_replace('^v', ''))
          }}/requirements.txt
        dest: /tmp/requirements.txt
        timeout: 60
        validate_certs: false
      when: patroni_pip_requirements_repo | length < 1

    - name: Install requirements
      ansible.builtin.pip:
        requirements: /tmp/requirements.txt
        executable: pip3
        extra_args: "--trusted-host=pypi.python.org --trusted-host=pypi.org --trusted-host=files.pythonhosted.org"
        umask: "0022"
      environment:
        PATH: "{{ ansible_env.PATH }}:{{ postgresql_bin_dir }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_requirements_repo | length < 1

    - name: Install patroni
      ansible.builtin.pip:
        name: patroni
        state: latest
        executable: pip3
        extra_args: "--trusted-host=pypi.python.org --trusted-host=pypi.org --trusted-host=files.pythonhosted.org"
        umask: "0022"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_package_repo | length < 1 and patroni_install_version == "latest"

    - name: "Install patroni {{ patroni_install_version | default('') }}"
      ansible.builtin.pip:
        name: "patroni=={{ patroni_install_version }}"
        executable: pip3
        extra_args: "--trusted-host=pypi.python.org --trusted-host=pypi.org --trusted-host=files.pythonhosted.org"
        umask: "0022"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_package_repo | length < 1 and patroni_install_version != "latest"
  when:
    - installation_method == "packages"
    - patroni_installation_method == "pip"
    - not point_in_time_recovery | default(false) | bool
  environment: "{{ proxy_env | default({}) }}"
  tags: patroni, patroni_install

- block: # when "patroni_pip_requirements_repo" and "patroni_pip_package_repo" is defined
    - name: Download patroni requirements
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /tmp/
        timeout: 120
        validate_certs: false
      loop: "{{ patroni_pip_requirements_repo }}"
      when: patroni_pip_requirements_repo | length > 0

    - name: Download patroni package
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /tmp/
        timeout: 60
        validate_certs: false
      loop: "{{ patroni_pip_package_repo | list }}"
      when: patroni_pip_package_repo | length > 0

    - name: Install requirements
      ansible.builtin.pip:
        name: "file:///tmp/{{ item }}"
        executable: pip3
        extra_args: "--no-index --find-links=file:///tmp --ignore-installed"
        umask: "0022"
      loop: "{{ patroni_pip_requirements_repo | map('basename') | list }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_requirements_repo | length > 0

    - name: Install patroni
      ansible.builtin.pip:
        name: "file:///tmp/{{ item }}"
        executable: pip3
        extra_args: "--no-index --find-links=file:///tmp --ignore-installed"
        umask: "0022"
      loop: "{{ patroni_pip_package_repo | map('basename') | list }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      when: patroni_pip_package_repo | length > 0
  when:
    - installation_method == "packages"
    - patroni_installation_method == "pip"
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_install

- block: # installation_method: "packages" and patroni_installation_method: "rpm/deb"
    # Debian
    - name: Install patroni package
      ansible.builtin.apt:
        name: "{{ patroni_packages | flatten }}"
        state: present
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "Debian" and patroni_deb_package_repo | length < 1

    # RedHat
    - name: Install patroni package
      ansible.builtin.dnf:
        name: "{{ patroni_packages | flatten }}"
        state: present
        disable_gpg_check: true
      register: dnf_status
      until: dnf_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "RedHat" and patroni_rpm_package_repo | length < 1

    # when patroni_deb_package_repo or patroni_rpm_package_repo URL is defined
    # Debian
    - name: Download patroni deb package
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /tmp/
        timeout: 60
        validate_certs: false
      loop: "{{ patroni_deb_package_repo | list }}"
      when: ansible_os_family == "Debian" and patroni_deb_package_repo | length > 0

    - name: Install patroni from deb package
      ansible.builtin.apt:
        force_apt_get: true
        deb: "/tmp/{{ item }}"
        state: present
      loop: "{{ patroni_deb_package_repo | map('basename') | list }}"
      register: deb_package_status
      until: deb_package_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "Debian" and patroni_deb_package_repo | length > 0

    # RedHat
    - name: Download patroni rpm package
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /tmp/
        timeout: 60
        validate_certs: false
      loop: "{{ patroni_rpm_package_repo | list }}"
      when: ansible_os_family == "RedHat" and patroni_rpm_package_repo | length > 0

    - name: Install patroni from rpm package
      ansible.builtin.dnf:
        name: "/tmp/{{ item }}"
        state: present
        disable_gpg_check: true
      loop: "{{ patroni_rpm_package_repo | map('basename') | list }}"
      register: rpm_package_status
      until: rpm_package_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "RedHat" and patroni_rpm_package_repo | length > 0
  environment: "{{ proxy_env | default({}) }}"
  when:
    - installation_method == "packages"
    - patroni_installation_method in ['rpm', 'deb']
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_install

# Patroni configure
- name: Create conf directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf

# TLS (etcd)
- name: Copy etcd cert files for patroni
  ansible.builtin.include_role:
    name: vitabaks.autobase.tls_certificate
    tasks_from: copy
  vars:
    tls_group_name: "etcd_cluster"
    fetch_tls_dir: "{{ etcd_tls_dir | default('/etc/etcd/tls') }}"
    copy_tls_dir: "{{ patroni_etcd_tls_dir | default('/etc/patroni/tls/etcd') }}"
    copy_tls_owner: "postgres"
  when:
    - tls_cert_generate | bool
    - dcs_type == "etcd"
    - not dcs_exists | bool
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf

# TLS (consul)
- name: Copy consul cert files for patroni
  ansible.builtin.include_role:
    name: vitabaks.autobase.tls_certificate
    tasks_from: copy
  vars:
    tls_group_name: "consul_instances"
    fetch_tls_dir: "{{ consul_tls_dir | default('/etc/consul/tls') }}"
    copy_tls_dir: "{{ patroni_consul_tls_dir | default('/etc/patroni/tls/consul') }}"
    copy_tls_owner: "postgres"
  when:
    - tls_cert_generate | bool
    - dcs_type == "consul"
    - not dcs_exists | bool
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf

- name: Create patroni config file
  ansible.builtin.import_tasks: patroni.yml
  when: cluster_scaling is not defined or not cluster_scaling | bool
  tags: patroni, patroni_conf

- name: Create patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0750"
  when:
    - patroni_log_destination == 'logfile'
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf

- block: # if cluster_scaling (add_node.yml)
    - name: Fetch patroni.yml conf file from master
      run_once: true
      ansible.builtin.fetch:
        src: /etc/patroni/patroni.yml
        dest: "{{ files_dir | default(playbook_dir ~ '/files') }}/patroni.yml"
        validate_checksum: true
        flat: true
      delegate_to: "{{ groups.master[0] }}"

    - name: Copy patroni.yml conf file to replica
      ansible.builtin.copy:
        src: "{{ files_dir | default(playbook_dir ~ '/files') }}/patroni.yml"
        dest: /etc/patroni/patroni.yml
        owner: postgres
        group: postgres
        mode: "0640"

    - name: Remove patroni.yml conf files from localhost
      become: false
      run_once: true
      ansible.builtin.file:
        path: "{{ files_dir | default(playbook_dir ~ '/files') }}/patroni.yml"
        state: absent
      delegate_to: localhost

    - name: Prepare patroni.yml conf file (replace "name","listen","connect_address")
      ansible.builtin.lineinfile:
        path: /etc/patroni/patroni.yml
        regexp: "{{ patroni_config_without_cluster_vip_item.regexp }}"
        line: "{{ patroni_config_without_cluster_vip_item.line }}"
        backrefs: true
      loop:
        - regexp: "^name:"
          line: "name: {{ ansible_hostname }}"
        - regexp: "^  listen: .*:{{ patroni_restapi_port }}$"
          line: "  listen: {{ patroni_restapi_listen_addr }}:{{ patroni_restapi_port }}"
        - regexp: "^  connect_address: .*:{{ patroni_restapi_port }}$"
          line: "  connect_address: {{ patroni_restapi_connect_addr
                                  | default(patroni_bind_address
                                  | default(bind_address, true), true) }}:{{ patroni_restapi_port }}"
        - regexp: "^  listen: ((?!{{ patroni_restapi_port }}).)*$"
          line: "  listen: {{ postgresql_listen_addr }}:{{ postgresql_port }}"
        - regexp: "^  connect_address: ((?!{{ patroni_restapi_port }}).)*$"
          line: "  connect_address: {{ postgresql_connect_addr
                                  | default(patroni_bind_address
                                  | default(bind_address, true), true) }}:{{ postgresql_port }}"
      loop_control:
        loop_var: patroni_config_without_cluster_vip_item
        label: "{{ patroni_config_without_cluster_vip_item.line }}"
      when: with_haproxy_load_balancing|bool or pgbouncer_install|bool or (cluster_vip is not defined or cluster_vip | length < 1)

    - name: Prepare patroni.yml conf file (replace "name","listen","connect_address")
      ansible.builtin.lineinfile:
        path: /etc/patroni/patroni.yml
        regexp: "{{ patroni_config_with_cluster_vip_item.regexp }}"
        line: "{{ patroni_config_with_cluster_vip_item.line }}"
        backrefs: true
      loop:
        - regexp: "^name:"
          line: "name: {{ ansible_hostname }}"
        - regexp: "^  listen: .*:{{ patroni_restapi_port }}$"
          line: "  listen: {{ patroni_restapi_listen_addr }}:{{ patroni_restapi_port }}"
        - regexp: "^  connect_address: .*:{{ patroni_restapi_port }}$"
          line: "  connect_address: {{ patroni_restapi_connect_addr
                                  | default(patroni_bind_address
                                  | default(bind_address, true), true) }}:{{ patroni_restapi_port }}"
        - regexp: "^  listen: ((?!{{ patroni_restapi_port }}).)*$"
          line: "  listen: {{ postgresql_listen_addr }},{{ cluster_vip }}:{{ postgresql_port }}"
        - regexp: "^  connect_address: ((?!{{ patroni_restapi_port }}).)*$"
          line: "  connect_address: {{ postgresql_connect_addr
                                  | default(patroni_bind_address
                                  | default(bind_address, true), true) }}:{{ postgresql_port }}"
      loop_control:
        loop_var: patroni_config_with_cluster_vip_item
        label: "{{ patroni_config_with_cluster_vip_item.line }}"
      when: not with_haproxy_load_balancing|bool and not pgbouncer_install|bool and (cluster_vip is defined and cluster_vip | length > 0)
  when:
    - cluster_scaling is defined and cluster_scaling | bool
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf

- name: Copy systemd service file "/etc/systemd/system/patroni.service"
  ansible.builtin.template:
    src: templates/patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: postgres
    group: postgres
    mode: "0644"
  when: not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_conf, patroni_service

- name: Prepare PostgreSQL | create statistics directory (if not already exists)
  ansible.builtin.file:
    path: "{{ postgresql_stats_temp_directory_path }}"
    state: directory
    mode: "01777"
  when:
    - postgresql_stats_temp_directory_path is defined
    - postgresql_stats_temp_directory_path != 'none'
    - postgresql_version | int <= 14
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, pgsql_stats_tmp

- name: Prepare PostgreSQL | mount the statistics directory in memory (tmpfs)
  ansible.posix.mount:
    path: "{{ postgresql_stats_temp_directory_path }}"
    src: tmpfs
    fstype: tmpfs
    opts: "size={{ postgresql_stats_temp_directory_size }},uid=postgres,gid=postgres"
    state: mounted
  when:
    - postgresql_stats_temp_directory_path is defined
    - postgresql_stats_temp_directory_path != 'none'
    - postgresql_version | int <= 14
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, pgsql_stats_tmp

- name: Prepare PostgreSQL | make sure the postgresql log directory "{{ postgresql_log_dir | default('') }}" exists
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"
  tags: patroni, point_in_time_recovery

- name: Prepare PostgreSQL | make sure the custom WAL directory "{{ postgresql_wal_dir | default('') }}" exists
  ansible.builtin.file:
    path: "{{ postgresql_wal_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"
  when: postgresql_wal_dir is defined and postgresql_wal_dir | length > 0
  tags: patroni, point_in_time_recovery, custom_wal_dir

- name: Prepare PostgreSQL | make sure PostgreSQL home directory "{{ postgresql_home_dir | default('') }}"
  ansible.builtin.file:
    path: "{{ postgresql_home_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  tags: patroni, point_in_time_recovery

- name: Prepare PostgreSQL | make sure PostgreSQL data directory "{{ postgresql_data_dir | default('') }}" exists
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"
  tags: patroni, point_in_time_recovery

- name: Prepare PostgreSQL | make sure PostgreSQL unix socket directory "{{ postgresql_unix_socket_dir | default('') }}" exists
  ansible.builtin.file:
    path: "{{ postgresql_unix_socket_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "02775"
  tags: patroni, point_in_time_recovery

- block: # when postgresql NOT exists or PITR
    # for Debian based distros only
    # patroni bootstrap failure is possible if the PostgreSQL config files are missing
    - name: Prepare PostgreSQL | make sure PostgreSQL config directory exists
      ansible.builtin.file:
        path: /etc/postgresql
        state: directory
        owner: postgres
        group: postgres
        recurse: true
      when: ansible_os_family == "Debian" and
        postgresql_packages|join(" ") is not search("postgrespro")

    - name: Prepare PostgreSQL | make sure PostgreSQL config files exists
      ansible.builtin.stat:
        path: "{{ postgresql_conf_dir }}/postgresql.conf"
      register: postgresql_conf_file
      when: ansible_os_family == "Debian" and
        postgresql_packages|join(" ") is not search("postgrespro")

    - name: Prepare PostgreSQL | generate default PostgreSQL config files
      become: true
      become_user: postgres
      ansible.builtin.command: >
        /usr/bin/pg_createcluster {{ postgresql_version }} {{ postgresql_cluster_name }}
        -d {{ postgresql_data_dir }}
        -p {{ postgresql_port }}
        -e {{ postgresql_encoding }}
        --locale {{ postgresql_locale }}
        --
        --auth-local {{ postgresql_password_encryption_algorithm }}
      register: pg_createcluster_result
      failed_when: pg_createcluster_result.rc != 0
      when: (ansible_os_family == "Debian" and
        postgresql_packages|join(" ") is not search("postgrespro")) and
        not postgresql_conf_file.stat.exists

    # When performing PITR, we do not clear the directory if pgbackrest is used to be able to use the '--delta restore' option.
    # In all other cases, we must clear the data directory before restore.
    - block:
        - name: Prepare PostgreSQL | Make sure the patroni service is stopped
          ansible.builtin.systemd:
            name: patroni
            state: stopped

        - name: Prepare PostgreSQL | make sure the data directory "{{ postgresql_data_dir | default('') }}" is empty
          ansible.builtin.file:
            path: "{{ postgresql_data_dir }}"
            state: "{{ item }}"
            owner: postgres
            group: postgres
            mode: "0700"
          loop:
            - absent
            - directory

        - name: Prepare PostgreSQL | make sure the custom WAL directory "{{ postgresql_wal_dir | default('') }}" is empty
          ansible.builtin.file:
            path: "{{ postgresql_wal_dir }}"
            state: "{{ item }}"
            owner: postgres
            group: postgres
            mode: "0700"
          loop:
            - absent
            - directory
          when: postgresql_wal_dir | default('') | length > 0
      when: patroni_cluster_bootstrap_method != "pgbackrest" or pgbackrest_patroni_cluster_clean_bootstrap | default(false)
  when: not postgresql_exists | default(false) | bool or patroni_cluster_bootstrap_method != "initdb"
  tags: patroni, point_in_time_recovery

- block: # when postgresql exists
    - block: # for master only
        - name: Prepare PostgreSQL | check PostgreSQL is started on Master
          become: true
          become_user: postgres
          ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl status -D {{ postgresql_data_dir }}"
          register: pg_ctl_status_result
          changed_when: false
          failed_when:
            - pg_ctl_status_result.rc != 0
            - pg_ctl_status_result.rc != 3

        - name: Prepare PostgreSQL | start PostgreSQL on Master
          become: true
          become_user: postgres
          ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl start -D {{ postgresql_data_dir }} -w -t {{ pg_ctl_timeout | default(3600) }}"
          when: pg_ctl_status_result.rc == 3

        - name: Prepare PostgreSQL | check PostgreSQL is accepting connections
          become: true
          become_user: postgres
          ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_isready -p {{ postgresql_port }}"
          register: pg_isready_result
          until: pg_isready_result.rc == 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Prepare PostgreSQL | generate pg_hba.conf on Master
          ansible.builtin.template:
            src: templates/pg_hba.conf.j2
            dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
            owner: postgres
            group: postgres
            mode: "0640"

        - name: Prepare PostgreSQL | validate generated pg_hba.conf
          become: true
          become_user: postgres
          community.postgresql.postgresql_query:
            login_host: "127.0.0.1"
            login_port: "{{ postgresql_port }}"
            login_user: "{{ patroni_superuser_username }}"
            login_password: "{{ patroni_superuser_password }}"
            login_db: "postgres"
            query: "SELECT * FROM pg_hba_file_rules WHERE error IS NOT NULL"
          register: pg_hba_validate_result
          failed_when: pg_hba_validate_result.query_result | length > 0

        - name: Prepare PostgreSQL | reload for apply the pg_hba.conf
          become: true
          become_user: postgres
          ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl reload -D {{ postgresql_data_dir }}"

        - name: Prepare PostgreSQL | ensure user "{{ patroni_superuser_username | default('') }}" exists and password matches the specified
          community.postgresql.postgresql_user:
            name: "{{ patroni_superuser_username }}"
            password: "{{ patroni_superuser_password }}"
            encrypted: true
            role_attr_flags: "SUPERUSER"
            login_db: postgres
            login_unix_socket: "{{ postgresql_unix_socket_dir }}"
            login_port: "{{ postgresql_port }}"
            state: present
          become: true
          become_user: postgres

        - name: Prepare PostgreSQL | ensure user "{{ patroni_replication_username | default('') }}" exists and password matches the specified
          community.postgresql.postgresql_user:
            name: "{{ patroni_replication_username }}"
            password: "{{ patroni_replication_password }}"
            encrypted: true
            role_attr_flags: "LOGIN,REPLICATION"
            login_db: postgres
            login_unix_socket: "{{ postgresql_unix_socket_dir }}"
            login_port: "{{ postgresql_port }}"
            state: present
          become: true
          become_user: postgres
      when:
        - inventory_hostname == groups['master'][0]
        - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster

    - name: Prepare PostgreSQL | check PostgreSQL is started
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl status -D {{ postgresql_data_dir }}"
      register: pg_ctl_status_result
      changed_when: false
      failed_when:
        - pg_ctl_status_result.rc != 0
        - pg_ctl_status_result.rc != 3

    - name: Prepare PostgreSQL | waiting for CHECKPOINT to complete before stopping postgresql
      become: true
      become_user: postgres
      ansible.builtin.command: >
        {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc "CHECKPOINT"
      environment:
        PGPASSFILE: "{{ postgresql_cli_passfile }}"
      register: checkpoint_result
      until: checkpoint_result.rc == 0
      retries: 300
      delay: 10
      when: pg_ctl_status_result.rc == 0

    - name: Prepare PostgreSQL | stop PostgreSQL (will be managed by patroni)
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl stop -D {{ postgresql_data_dir }} -m fast -w -t {{ pg_ctl_timeout | default(3600) }}"
      when: checkpoint_result.rc is defined and checkpoint_result.rc == 0

    - name: Prepare PostgreSQL | check PostgreSQL is stopped
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl status -D {{ postgresql_data_dir }}"
      register: pg_ctl_stop_result
      failed_when: pg_ctl_stop_result.rc != 3
      changed_when: false
  when: postgresql_exists | default(false) | bool and patroni_cluster_bootstrap_method == "initdb"
  tags: patroni, patroni_start_master

- block: # PITR (custom bootstrap)
    # Prepare (install pexpect, ruamel.yaml)
    - name: Prepare | Make sure the ansible required python library is exist
      ansible.builtin.pip:
        name: "{{ item }}"
        state: present
        executable: pip3
        extra_args: "--trusted-host=pypi.python.org --trusted-host=pypi.org --trusted-host=files.pythonhosted.org"
        umask: "0022"
      loop:
        - pexpect==4.9.0
        - ruamel.yaml==0.17.40
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    # Run PITR
    - name: Stop patroni service on the Replica servers (if running)
      ansible.builtin.systemd:
        name: patroni
        state: stopped
      when: "'replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica']"

    - name: Stop patroni service on the Master server (if running)
      ansible.builtin.systemd:
        name: patroni
        state: stopped
      when: inventory_hostname == groups['master'][0]

    - name: Check that PostgreSQL is stopped
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl status -D {{ postgresql_data_dir }}"
      register: pg_ctl_status_result
      changed_when: false
      failed_when: false

    - name: Stop PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        {{ postgresql_bin_dir }}/pg_ctl stop -D {{ postgresql_data_dir }} -m fast -w -t {{ pg_ctl_timeout | default(3600) }}
      when: pg_ctl_status_result.rc is defined and (pg_ctl_status_result.rc != 3 and pg_ctl_status_result.rc != 4)

    - name: Remove patroni cluster "{{ patroni_cluster_name | default('') }}" from DCS (if exist)
      become: true
      become_user: postgres
      ansible.builtin.expect:
        command: "patronictl -c /etc/patroni/patroni.yml remove {{ patroni_cluster_name }}"
        responses:
          "Please confirm the cluster name to remove": "{{ patroni_cluster_name }}"
          "You are about to remove all information in DCS": "Yes I am aware"
      register: patronictl_remove_result
      changed_when: patronictl_remove_result.rc == 0 and
        patronictl_remove_result.stdout|lower is not search("key not found")
      failed_when: patronictl_remove_result.rc != 0
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
      when: inventory_hostname == groups['master'][0]

    - block: # for pgbackrest only (for use --delta restore)
        - name: Run "{{ pgbackrest_patroni_cluster_bootstrap_command | default('') }}" on Master
          ansible.builtin.command: "{{ pgbackrest_patroni_cluster_bootstrap_command }}"
          async: "{{ cluster_restore_timeout | default(86400) }}" # timeout 24 hours
          poll: 0
          register: pgbackrest_restore_master
          when: inventory_hostname == groups['master'][0]

          # if patroni_create_replica_methods: "pgbackrest"
        - name: Run "{{ pgbackrest_patroni_replica_restore_command | default('') }}" on Replica
          ansible.builtin.command: "{{ pgbackrest_patroni_replica_restore_command }}"
          async: "{{ cluster_restore_timeout | default(86400) }}" # timeout 24 hours
          poll: 0
          register: pgbackrest_restore_replica
          when:
            - "'replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica']"
            - "'pgbackrest' in patroni_create_replica_methods"

        - name: Waiting for restore from backup
          ansible.builtin.async_status:
            jid: "{{ item.ansible_job_id }}"
          loop:
            - "{{ pgbackrest_restore_master }}"
            - "{{ pgbackrest_restore_replica }}"
          loop_control:
            label: "{{ item.changed }}"
          register: pgbackrest_restore_jobs_result
          until: pgbackrest_restore_jobs_result.finished
          retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
          delay: 30
          when: item.ansible_job_id is defined

        - name: Remove patroni.dynamic.json file
          ansible.builtin.file:
            path: "{{ postgresql_data_dir }}/patroni.dynamic.json"
            state: absent
          failed_when: false
          when: not keep_patroni_dynamic_json|bool

        - name: Start PostgreSQL for Recovery
          ansible.builtin.command: >-
            {{ postgresql_bin_dir }}/pg_ctl start -D {{ postgresql_data_dir }} -w -t {{ pg_ctl_timeout | default(3600) }}
            -o '--config-file={{ postgresql_conf_dir }}/postgresql.conf'
            -o '-c hot_standby=off'
            {% if postgresql_version | int >= 12 %}
            -o '-c restore_command="pgbackrest --stanza={{ pgbackrest_stanza }} archive-get %f %p"'
            {% endif %}
            -o '-c archive_command=/bin/true'
            -l /tmp/pg_recovery_{{ ansible_date_time.date }}.log
          async: "{{ pg_ctl_timeout | default(3600) }}" # run the command asynchronously
          poll: 0
          register: pg_ctl_start_result
          when: inventory_hostname == groups['master'][0] or
            ('replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica']
            and 'pgbackrest' in patroni_create_replica_methods)

        - name: Wait for the PostgreSQL start command to complete
          ansible.builtin.async_status:
            jid: "{{ pg_ctl_start_result.ansible_job_id }}"
          register: pg_ctl_start_job_result
          until: pg_ctl_start_job_result.finished
          retries: "{{ (pg_ctl_timeout | default(3600) | int) // 10 }}"
          delay: 10
          when: inventory_hostname == groups['master'][0] or
            ('replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica']
            and 'pgbackrest' in patroni_create_replica_methods)

        - name: Wait for PostgreSQL recovery to complete (WAL apply)
          ansible.builtin.command: >-
            {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres
            -tAXc "select pg_is_in_recovery()"
          environment:
            PGPASSFILE: "{{ postgresql_cli_passfile }}"
          register: pg_is_in_recovery
          until: pg_is_in_recovery.stdout == "f"
          retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
          delay: 30
          changed_when: false
          failed_when: false
          when: inventory_hostname == groups['master'][0]

        - name: Check that PostgreSQL is stopped
          ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl status -D {{ postgresql_data_dir }}"
          register: pg_ctl_status_result
          changed_when: false
          failed_when: false

        - name: Stop PostgreSQL
          ansible.builtin.command: >-
            {{ postgresql_bin_dir }}/pg_ctl stop -D {{ postgresql_data_dir }} -m fast -w -t {{ pg_ctl_timeout | default(3600) }}
          when: pg_ctl_status_result.rc is defined and (pg_ctl_status_result.rc != 3 and pg_ctl_status_result.rc != 4)
      when: patroni_cluster_bootstrap_method == "pgbackrest" and not pgbackrest_patroni_cluster_clean_bootstrap | default(false)
      become: true
      become_user: postgres
  environment: "{{ proxy_env | default({}) }}"
  when: patroni_cluster_bootstrap_method != "initdb" and
    (pgbackrest_install|bool or wal_g_install|bool)
  tags: patroni, point_in_time_recovery

- block: # PITR (custom bootstrap) - disable archive_command
    - name: Check if patroni.dynamic.json exists
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/patroni.dynamic.json"
      register: patroni_dynamic_json
      when: not keep_patroni_dynamic_json | bool or disable_archive_command | bool

    - name: Remove patroni.dynamic.json file
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}/patroni.dynamic.json"
        state: absent
      when:
        - patroni_dynamic_json is defined
        - patroni_dynamic_json.stat is defined
        - patroni_dynamic_json.stat.exists
        - not keep_patroni_dynamic_json | bool

    - name: Edit patroni.dynamic.json | disable archive_command (if enabled)
      vitabaks.autobase.yedit:
        src: "{{ postgresql_data_dir }}/patroni.dynamic.json"
        key: postgresql.parameters.archive_command
        value: "cd ." # not doing anything yet with WAL-s
        content_type: json
      when:
        - patroni_dynamic_json is defined
        - patroni_dynamic_json.stat is defined
        - patroni_dynamic_json.stat.exists
        - disable_archive_command | bool

    - name: Edit patroni.yml | disable archive_command (if enabled)
      vitabaks.autobase.yedit:
        src: /etc/patroni/patroni.yml
        key: bootstrap.dcs.postgresql.parameters.archive_command
        value: "cd ." # not doing anything yet with WAL-s
      no_log: true # yedit returns the whole patroni.yml, including passwords.
      when: disable_archive_command | bool
  when: patroni_cluster_bootstrap_method != "initdb" and
    (pgbackrest_install | bool or wal_g_install | bool) and
    (cluster_scaling is not defined or not cluster_scaling | bool)
  become: true
  become_user: postgres
  tags: patroni, point_in_time_recovery

- block: # PITR (custom bootstrap) - generate pg_hba.conf
    - name: Generate pg_hba.conf (before start patroni)
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"
  when: patroni_cluster_bootstrap_method != "initdb" and
    postgresql_conf_dir != postgresql_data_dir and
    (cluster_scaling is not defined or not cluster_scaling | bool)
  tags: patroni

- block: # start patroni on master
    - name: Start patroni service on the Master server
      ansible.builtin.systemd:
        daemon_reload: true
        name: patroni
        state: restarted
        enabled: true

    - name: "Wait for port {{ patroni_restapi_port | default('8008') }} to become open on the host"
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "{{ patroni_bind_address | default(bind_address, true) }}"
        state: started
        timeout: 120
        delay: 10
      ignore_errors: false

      # for WAL-G (custom bootstrap)
    - name: Wait for PostgreSQL Recovery to complete (WAL apply)
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc
        "select pg_is_in_recovery()"
      environment:
        PGPASSFILE: "{{ postgresql_cli_passfile }}"
      register: pg_is_in_recovery
      until: pg_is_in_recovery.stdout == "f"
      retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
      delay: 30
      changed_when: false
      failed_when: false
      when: patroni_cluster_bootstrap_method == "wal-g"

    - name: Wait for the standby cluster initialization to complete
      ansible.builtin.uri:
        url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
          {{ patroni_restapi_port }}/standby-leader"
        status_code: 200
        ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
      register: standby_leader_result
      until: standby_leader_result.status == 200
      retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
      delay: 30
      environment:
        no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
      when:
        - (patroni_standby_cluster.host is defined and patroni_standby_cluster.host | length > 0)
        - not ansible_check_mode

    - name: Check PostgreSQL is started and accepting connections
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_isready -p {{ postgresql_port }}"
      register: pg_isready_result
      until: pg_isready_result.rc == 0
      retries: "{{ pg_isready_retries | default(1000) }}"
      delay: "{{ pg_isready_delay | default(30) }}"
      changed_when: false

    - name: Wait for the cluster to initialize (master is the leader with the lock)
      ansible.builtin.uri:
        url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
          {{ patroni_restapi_port }}/leader"
        status_code: 200
        ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
      register: result
      until: result.status == 200
      retries: "{{ 10 if not pgbackrest_patroni_cluster_clean_bootstrap | default(false) else (cluster_restore_timeout | default(86400)) | int // 30 }}"
      delay: "{{ 2 if not pgbackrest_patroni_cluster_clean_bootstrap | default(false) else 30 }}"
      environment:
        no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
      when:
        - (patroni_standby_cluster.host is not defined or patroni_standby_cluster.host | length < 1)
        - not ansible_check_mode
  when: inventory_hostname == groups['master'][0]
  tags: patroni, patroni_start_master, point_in_time_recovery

- block: # pg_hba (using a templates/pg_hba.conf.j2)
    - name: Prepare PostgreSQL | generate pg_hba.conf
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"
      register: generate_pg_hba
      when: inventory_hostname == groups['master'][0] or
        (('replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica'] and postgresql_conf_dir != postgresql_data_dir)
        or postgresql_exists | default(false) | bool)

    - name: Prepare PostgreSQL | validate generated pg_hba.conf
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_host: "127.0.0.1"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ patroni_superuser_username }}"
        login_password: "{{ patroni_superuser_password }}"
        login_db: "postgres"
        query: "SELECT * FROM pg_hba_file_rules WHERE error IS NOT NULL"
      register: pg_hba_validate_result
      failed_when: pg_hba_validate_result.query_result | length > 0
      when: inventory_hostname == groups['master'][0]

    - name: Prepare PostgreSQL | reload for apply the pg_hba.conf
      become: true
      become_user: postgres
      ansible.builtin.command: "{{ postgresql_bin_dir }}/pg_ctl reload -D {{ postgresql_data_dir }}"
      register: pg_ctl_reload_result
      changed_when: pg_ctl_reload_result.rc == 0
      # PostgreSQL is already running on master; replicas may not be started yet.
      # Keep reload best-effort on replicas (also when re-running with --tags pg_hba).
      failed_when: pg_ctl_reload_result.rc != 0 and inventory_hostname == groups['master'][0]
      when: generate_pg_hba is changed
  when: cluster_scaling is not defined or not cluster_scaling | bool
  tags: patroni, pg_hba, pg_hba_generate

- block: # PITR (custom bootstrap) - password reset for PostgreSQL users
    - name: Make sure the Master is not in recovery mode
      ansible.builtin.command: >-
        {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc
        "select pg_is_in_recovery()"
      environment:
        PGPASSFILE: "{{ postgresql_cli_passfile }}"
      register: pg_is_in_recovery
      until: pg_is_in_recovery.stdout == "f"
      retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
      delay: 30
      changed_when: false
      when: inventory_hostname == groups['master'][0]

    - name: Make sure the superuser and replication users are present, and password does not differ from the specified
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        role_attr_flags: "{{ item.flags }}"
        login_db: postgres
        login_unix_socket: "{{ postgresql_unix_socket_dir }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ patroni_superuser_username }}"
        login_password: "{{ patroni_superuser_password }}"
      register: postgresql_user_result
      loop:
        - { name: "{{ patroni_superuser_username }}", password: "{{ patroni_superuser_password }}", flags: "SUPERUSER" }
        - { name: "{{ patroni_replication_username }}", password: "{{ patroni_replication_password }}", flags: "LOGIN,REPLICATION" }
      loop_control:
        label: "{{ item.name }}"
      no_log: true # Loop items contain passwords.
      when:
        - inventory_hostname == groups['master'][0]
        - (patroni_superuser_username and patroni_superuser_password) is defined
        - (patroni_superuser_username and patroni_superuser_password) | length > 0
        - (patroni_replication_username and patroni_replication_password) is defined
        - (patroni_replication_username and patroni_replication_password) | length > 0

    - name: Make sure the postgresql users are present, and password does not differ from the specified
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password | default(omit) }}"
        role_attr_flags: "{{ item.flags }}"
        login_db: postgres
        login_unix_socket: "{{ postgresql_unix_socket_dir }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ patroni_superuser_username }}"
        login_password: "{{ patroni_superuser_password }}"
      loop: "{{ postgresql_users }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true # Loop items contain passwords.
      ignore_errors: true
      when:
        - inventory_hostname == groups['master'][0]
        - (postgresql_users is defined and postgresql_users | length > 0)

    - name: Update postgresql authentication in patroni.yml
      vitabaks.autobase.yedit:
        src: /etc/patroni/patroni.yml
        edits:
          - key: postgresql.authentication.replication.username
            value: "{{ patroni_replication_username }}"
          - key: postgresql.authentication.replication.password
            value: "{{ patroni_replication_password }}"
          - key: postgresql.authentication.superuser.username
            value: "{{ patroni_superuser_username }}"
          - key: postgresql.authentication.superuser.password
            value: "{{ patroni_superuser_password }}"
        state: present
      no_log: true # Edits and the returned document contain passwords.
      when: hostvars[groups['master'][0]]['postgresql_user_result'] is changed
  when:
    - patroni_cluster_bootstrap_method != "initdb"
    - (pgbackrest_install | bool or wal_g_install | bool)
    - (cluster_scaling is not defined or not cluster_scaling | bool)
    - patroni_standby_cluster.host | default('') | length < 1 # do not perform on the standby cluster
  become: true
  become_user: postgres
  tags: patroni, point_in_time_recovery

- block: # if cluster_scaling (add_node.yml)
    - name: Prepare PostgreSQL | fetch pg_hba.conf file from master
      run_once: true
      ansible.builtin.fetch:
        src: "{{ postgresql_conf_dir }}/pg_hba.conf"
        dest: "{{ files_dir | default(playbook_dir ~ '/files') }}/pg_hba.conf"
        validate_checksum: true
        flat: true
      delegate_to: "{{ groups.master[0] }}"

    - name: Prepare PostgreSQL | copy pg_hba.conf file to replica
      ansible.builtin.copy:
        src: "{{ files_dir | default(playbook_dir ~ '/files') }}/pg_hba.conf"
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"
  when: cluster_scaling is defined and cluster_scaling | bool
    and postgresql_conf_dir != postgresql_data_dir
  tags: patroni, pg_hba, pg_hba_generate

- block: # start patroni on replica
    - name: Start patroni service on Replica servers
      ansible.builtin.systemd:
        daemon_reload: true
        name: patroni
        state: restarted
        enabled: true

    - name: "Wait for port {{ patroni_restapi_port | default('8008') }} to become open on the host"
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "{{ patroni_bind_address | default(bind_address, true) }}"
        state: started
        timeout: 120
        delay: 10
      ignore_errors: false

    - name: Check that the patroni is healthy on the replica server
      ansible.builtin.uri:
        url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
          {{ patroni_restapi_port }}/health"
        status_code: 200
        ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
      register: replica_result
      until: replica_result.status == 200
      retries: "{{ (cluster_restore_timeout | default(86400)) | int // 30 }}" # timeout 24 hours
      delay: 30
      environment:
        no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
      when: not ansible_check_mode
  when: "'replica' in groups and groups['replica'] | length > 0 and inventory_hostname in groups['replica']"
  tags: patroni, patroni_start_replica, point_in_time_recovery

# create symlink pg_xlog/pg_wal to custom WAL dir
- ansible.builtin.import_tasks: custom_wal_dir.yml
  when: postgresql_wal_dir is defined and postgresql_wal_dir | length > 0
  tags: patroni, custom_wal_dir, point_in_time_recovery

# disable postgresql from autostart
- block: # "Debian"
    - name: Turning off postgresql autostart from config "start.conf" (will be managed by patroni)
      ansible.builtin.copy:
        dest: "{{ postgresql_conf_dir }}/start.conf"
        content: "manual"
        owner: postgres
        group: postgres
        mode: "0644"

    - name: Disable "postgresql@{{ postgresql_version | default('') }}-{{ postgresql_cluster_name | default('') }}" service
      ansible.builtin.systemd:
        name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster_name }}"
        enabled: false
        daemon_reload: true
  when:
    - ansible_os_family == "Debian"
    - postgresql_packages | join(" ") is not search("postgrespro")
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, postgresql_disable

# "RedHat"
- name: Disable "postgresql-{{ postgresql_version | default('') }}" service (will be managed by patroni)
  ansible.builtin.systemd:
    name: "postgresql-{{ postgresql_version }}"
    enabled: false
    daemon_reload: true
  when:
    - ansible_os_family == "RedHat"
    - postgresql_packages | join(" ") is not search("postgrespro")
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, postgresql_disable

# PostgresPro
- name: Disable "postgrespro-std-{{ postgresql_version | default('') }}" service (will be managed by patroni)
  ansible.builtin.systemd:
    name: "postgrespro-std-{{ postgresql_version }}"
    enabled: false
    daemon_reload: true
  when:
    - postgresql_packages | join(" ") is search("postgrespro-std")
    - not point_in_time_recovery | default(false) | bool
  tags: patroni, postgresql_disable

# PATRONICTL_CONFIG_FILE (patroni v1.6.1 and higher)
- name: Add PATRONICTL_CONFIG_FILE environment variable into /etc/environment
  ansible.builtin.lineinfile:
    dest: "/etc/environment"
    state: present
    regexp: "^PATRONICTL_CONFIG_FILE"
    line: "PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    owner: root
    group: root
    mode: "0644"
    create: true
  register: patronictl_env_result
  when: not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_env

- name: Add PATRONICTL_CONFIG_FILE to /etc/profile.d/patroni.sh
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml
    dest: /etc/profile.d/patroni.sh
    owner: root
    group: root
    mode: "0644"
  when: not point_in_time_recovery | default(false) | bool
  tags: patroni, patroni_env
