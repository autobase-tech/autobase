---
# Check if switchover is required
- name: Check current Patroni node role
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port | default('8008') }}/leader"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_leader_result
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
  changed_when: false
  check_mode: false

# Wait for sync standby to be available when synchronous_mode is enabled
# This prevents "can not find sync_standby" error during switchover.
# After nosync: false is restored, it may take time for PostgreSQL to re-establish
# the replica as a synchronous standby. We wait up to 5 minutes (60 retries x 5 seconds).
# The /sync endpoint returns HTTP 200 only when a node is a synchronous standby.
- name: Wait for synchronous standby to be available
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ hostvars[replica].patroni_restapi_connect_addr
        | default(hostvars[replica].patroni_bind_address
        | default(hostvars[replica].bind_address, true),true) }}:{{ patroni_restapi_port
        | default('8008') }}/sync
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_sync_check
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
  loop: "{{ groups.get('secondary', []) }}"
  loop_control:
    loop_var: replica
    label: "{{ replica }}"
    break_when: (patroni_sync_check.status | default(0)) == 200
  until: (patroni_sync_check.status | default(0)) == 200
  retries: 60
  delay: 5
  when:
    - synchronous_mode | default(false) | bool
    - patroni_leader_result.status | default(0) == 200

- name: Execute CHECKPOINT before switchover
  become: true
  become_user: postgres
  ansible.builtin.command: >
    {{ postgresql_bin_dir }}/psql -h 127.0.0.1 -p {{ postgresql_port }} -U {{ patroni_superuser_username }} -d postgres -tAXc "CHECKPOINT"
  environment:
    PGPASSFILE: "{{ postgresql_cli_passfile }}"
  when: patroni_leader_result.status | default(0) == 200

# If the node is the current leader, perform switchover
- name: Perform switchover of the Patroni leader role to another node
  become: true
  become_user: postgres
  ansible.builtin.command: >-
    patronictl -c /etc/patroni/patroni.yml switchover {{ patroni_cluster_name }}
    {{ '--candidate ' ~ patroni_switchover_candidate_name
      if patroni_switchover_candidate_name | default('') | length > 0 else '' }} --force
  register: patronictl_switchover_result
  ignore_errors: true # show the error and continue the playbook execution
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
  when: patroni_leader_result.status | default(0) == 200

# Retry switchover if the first attempt failed and the node is still leader
- block:
    # Recheck if the node is still the leader
    - name: Check Patroni node role
      ansible.builtin.uri:
        url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
          {{ patroni_restapi_port | default('8008') }}/leader"
        status_code: 200
        ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
      register: patroni_leader_recheck
      changed_when: false
      environment:
        no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"

    # If still leader, retry switchover
    - name: Perform switchover of the Patroni leader role to another node (RETRY)
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        patronictl -c /etc/patroni/patroni.yml switchover {{ patroni_cluster_name }}
        {{ '--candidate ' ~ patroni_switchover_candidate_name
          if patroni_switchover_candidate_name | default('') | length > 0 else '' }} --force
      register: patronictl_switchover_retry_result
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
      when: patroni_leader_recheck.status | default(0) == 200
  ignore_errors: true # show the error and continue the playbook execution
  when:
    - patronictl_switchover_result is defined
    - not patronictl_switchover_result is success

# If the switchover is performed, make sure that the node is now a replica
- name: Make sure that the Patroni is healthy and is a replica
  ansible.builtin.uri:
    url: "{{ patroni_restapi_protocol }}://{{ patroni_restapi_connect_addr | default(patroni_bind_address | default(bind_address, true), true) }}:\
      {{ patroni_restapi_port | default('8008') }}/replica"
    status_code: 200
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_replica_result
  until: patroni_replica_result.status == 200
  retries: 300
  delay: 2
  environment:
    no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
  when: (patronictl_switchover_result is defined and patronictl_switchover_result is success) or
    (patroni_leader_recheck is defined and patroni_leader_recheck.status | default('') != 200) or
    (patronictl_switchover_retry_result is defined and patronictl_switchover_retry_result is success)
