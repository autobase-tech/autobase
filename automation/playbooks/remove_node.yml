---
# Unavailable nodes can be removed using the remaining cluster members, provided the DCS still has quorum.
# When facts for an unavailable node are missing, its name is resolved through DCS or Patroni membership addresses.
# Use its inventory_hostname if its name is no longer present in cluster membership.
# Local service and data cleanup is skipped on unavailable nodes.
- name: vitabaks.autobase.remove_node | Prepare and perform pre-checks
  hosts: postgres_cluster:etcd_cluster:consul_instances
  become: true
  gather_facts: false
  any_errors_fatal: true

  pre_tasks:
    - name: Validate that node_to_remove is specified
      run_once: true # noqa run-once
      ansible.builtin.fail:
        msg: >-
          Please specify the node_to_remove variable with the node
          to remove from the cluster.
      when: node_to_remove | default('') | length == 0

    - name: Gather facts from available nodes
      ansible.builtin.setup:
      register: removal_node_facts
      ignore_unreachable: true
      any_errors_fatal: false
      tags: always

    - name: Group available nodes for removal tasks
      ansible.builtin.group_by:
        key: removal_available_nodes
      when: removal_node_facts is not unreachable
      tags: always

    - name: Group available nodes for cluster queries
      ansible.builtin.group_by:
        key: removal_query_nodes
      when:
        - removal_node_facts is not unreachable
        - node_to_remove not in [inventory_hostname, ansible_hostname | default(''), consul_node_name | default('')]
      tags: always

    - name: Define bind_address
      ansible.builtin.include_role:
        name: vitabaks.autobase.bind_address
      when:
        - removal_node_facts is not unreachable
        - bind_address is not defined
      tags: always

    - name: Resolve node_to_remove
      block:
        - name: Fetch Patroni cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            patronictl -c {{ hostvars[query_host].patroni_config_file | default('/etc/patroni/patroni.yml') }} list --format=json
          environment:
            PATH: "{{ hostvars[query_host].ansible_env.PATH | default('/usr/bin:/bin') }}:/usr/bin:/usr/local/bin"
          register: patronictl_list_before
          changed_when: false
          delegate_to: "{{ query_host }}"
          vars:
            query_host: >-
              {{ groups['postgres_cluster'] | default([]) | intersect(groups['removal_query_nodes'] | default([]))
                 | first | default('localhost') }}
          when: groups['postgres_cluster'] | default([]) | intersect(groups['removal_query_nodes'] | default([])) | length > 0

        - name: Fetch etcd cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            {{ hostvars[query_host].etcd_bin_dir | default('/usr/local/bin') }}/etcdctl member list --write-out=json
            {% if hostvars[query_host].etcd_tls_enable | default(true) | bool %}
            --cacert={{ hostvars[query_host].etcd_tls_dir | default('/etc/etcd/tls') }}/{{ hostvars[query_host].etcd_tls_ca_crt | default('ca.crt') }}
            --cert={{ hostvars[query_host].etcd_tls_dir | default('/etc/etcd/tls') }}/{{ hostvars[query_host].etcd_tls_server_crt | default('server.crt') }}
            --key={{ hostvars[query_host].etcd_tls_dir | default('/etc/etcd/tls') }}/{{ hostvars[query_host].etcd_tls_server_key | default('server.key') }}
            {% endif %}
          environment:
            ETCDCTL_API: "3"
          register: etcd_members_list_before
          changed_when: false
          delegate_to: "{{ query_host }}"
          vars:
            query_host: >-
              {{ groups['etcd_cluster'] | default([]) | intersect(groups['removal_query_nodes'] | default([]))
                 | first | default('localhost') }}
          when:
            - groups['etcd_cluster'] | default([]) | intersect(groups['removal_query_nodes'] | default([])) | length > 0
            - hostvars[query_host].dcs_type | default('etcd') == 'etcd'

        - name: Fetch consul cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            consul operator raft list-peers
            -http-addr={{ 'https' if hostvars[query_host].consul_tls_enable | default(true) | bool else 'http' }}://127.0.0.1:8500
            {% if hostvars[query_host].consul_tls_enable | default(true) | bool %}
            -ca-file=/etc/consul/tls/ca.crt
            -client-cert=/etc/consul/tls/server.crt -client-key=/etc/consul/tls/server.key
            {% endif %}
          register: consul_members_list_before
          changed_when: false
          delegate_to: "{{ query_host }}"
          vars:
            query_host: >-
              {{ groups['consul_instances'] | default([]) | intersect(groups['removal_query_nodes'] | default([]))
                 | first | default('localhost') }}
          when:
            - groups['consul_instances'] | default([]) | intersect(groups['removal_query_nodes'] | default([])) | length > 0
            - hostvars[query_host].dcs_type | default('etcd') == 'consul'

        # Match inventory addresses to member names without facts from the offline node.
        - name: Match node_to_remove to inventory and cluster aliases
          ansible.builtin.set_fact:
            removal_candidates: >-
              {%- set result = [] -%}
              {%- for host in groups['all'] -%}
              {%- set addresses = [host, hostvars[host].ansible_host | default(''),
                    hostvars[host].bind_address | default(''), hostvars[host].etcd_bind_address | default(''),
                    hostvars[host].patroni_bind_address | default(''), hostvars[host].postgresql_connect_addr | default('')] -%}
              {%- set aliases = [host, hostvars[host].ansible_hostname | default(host)] -%}
              {%- for member in patroni_members -%}
              {%- if member.Host in addresses or member.Host | regex_replace(':[0-9]+$', '') in addresses -%}
              {%- set _ = aliases.append(member.Member) -%}
              {%- endif -%}
              {%- endfor -%}
              {%- for member in etcd_members -%}
              {%- if member.name and member.peerURLs | map('urlsplit', 'hostname') | intersect(addresses) | length > 0 -%}
              {%- set _ = aliases.append(member.name) -%}
              {%- endif -%}
              {%- endfor -%}
              {%- for line in consul_members -%}
              {%- set columns = line.split() -%}
              {%- if ('http://' ~ columns[2]) | urlsplit('hostname') in addresses -%}
              {%- set _ = aliases.append(columns[0]) -%}
              {%- endif -%}
              {%- endfor -%}
              {%- if node_to_remove in aliases -%}
              {%- set _ = result.append({'host': host, 'name': aliases | last}) -%}
              {%- endif -%}
              {%- endfor -%}
              {{- result -}}
          vars:
            patroni_members: "{{ patronictl_list_before.stdout | default('[]') | from_json }}"
            etcd_members: "{{ (etcd_members_list_before.stdout | default('{}') | from_json).get('members', []) }}"
            consul_members: "{{ (consul_members_list_before.stdout_lines | default([]))[1:] }}"
      tags: always

    - name: Validate that node_to_remove matches one inventory host
      run_once: true # noqa run-once
      ansible.builtin.assert:
        that: removal_candidates | length == 1
        fail_msg: >-
          Node '{{ node_to_remove }}' must match exactly one inventory host.
          Matches: {{ removal_candidates | map(attribute='host') | list }}.
          Specify its inventory_hostname or cluster member name.
      tags: always

    - name: Set the resolved inventory hostname and cluster member name
      ansible.builtin.set_fact:
        target_node: "{{ removal_candidates[0].host }}"
        target_node_name: "{{ removal_candidates[0].name }}"
      tags: always

    - name: Group remaining PostgreSQL nodes
      ansible.builtin.group_by:
        key: removal_postgres_survivors
      when:
        - inventory_hostname in (groups['postgres_cluster'] | default([]))
        - inventory_hostname in (groups['removal_available_nodes'] | default([]))
        - inventory_hostname != target_node
      tags: always

    - name: Require an available remaining member in each target group
      run_once: true # noqa run-once
      ansible.builtin.assert:
        that: groups[item] | intersect(groups['removal_available_nodes']) | difference([target_node]) | length > 0
        fail_msg: "Cannot remove '{{ target_node }}' without an available remaining node in '{{ item }}'."
      loop: [postgres_cluster, etcd_cluster, consul_instances]
      when: target_node in (groups[item] | default([]))
      tags: always

    - name: Report skipped local cleanup on an unavailable target
      run_once: true # noqa run-once
      ansible.builtin.debug:
        msg: >-
          Node '{{ target_node }}' is unavailable. Removing its cluster membership
          using the remaining nodes; its local services and data cannot be cleaned up.
      when: target_node not in (groups['removal_available_nodes'] | default([]))
      tags: always

    - name: Define passwords
      ansible.builtin.include_role:
        name: vitabaks.autobase.pre_checks
        tasks_from: passwords
      vars:
        postgresql_cluster_maintenance: true
        source_group: removal_postgres_survivors
      when: inventory_hostname in (groups['removal_postgres_survivors'] | default([]))
      tags: always

- name: vitabaks.autobase.remove_node | Remove node from PostgreSQL cluster
  hosts: postgres_cluster:&removal_available_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - block:
        - name: Refresh Patroni cluster members before the primary check
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            patronictl -c {{ hostvars[query_host].patroni_config_file | default('/etc/patroni/patroni.yml') }} list --format=json
          register: patronictl_list_before
          changed_when: false
          environment:
            PATH: "{{ hostvars[query_host].ansible_env.PATH | default('/usr/bin:/bin') }}:/usr/bin:/usr/local/bin"
          delegate_to: "{{ query_host }}"
          vars:
            query_host: "{{ groups['removal_postgres_survivors'] | default([]) | first | default('localhost') }}"

        - name: Show Patroni cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ patronictl_list_before.stdout | from_json }}"

        - name: Fail if trying to remove primary node
          run_once: true # noqa run-once
          ansible.builtin.fail:
            msg: >-
              Cannot remove primary node '{{ target_node }}'. Please perform
              switchover first or specify a replica node.
          loop: "{{ patronictl_list_before.stdout | from_json }}"
          when:
            - item.Role | lower in ['leader', 'standby leader']
            - >-
              item.Member == target_node_name or
              item.Host in target_addresses or
              (item.Host | regex_replace(':[0-9]+$', '')) in target_addresses
          vars:
            target_addresses:
              - "{{ target_node }}"
              - "{{ hostvars[target_node].ansible_host | default('') }}"
              - "{{ hostvars[target_node].bind_address | default('') }}"
              - "{{ hostvars[target_node].patroni_bind_address | default('') }}"
              - "{{ hostvars[target_node].postgresql_connect_addr | default('') }}"
      when:
        - target_node in (groups['postgres_cluster'] | default([]))
        - groups['removal_postgres_survivors'] | default([]) | length > 0
      tags: always

  tasks:
    - block:
        # Otherwise it would keep accepting clients and sending them to the cluster.
        - name: Stop and disable pgdog service on target node
          ansible.builtin.systemd:
            name: pgdog
            state: stopped
            enabled: false
          when: pgdog_install | default(false) | bool
          failed_when: false

        - name: Stop and disable patroni service on target node
          ansible.builtin.service:
            name: patroni
            state: stopped
            enabled: false

        - name: Delete PostgreSQL content on target node
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{
              [
                postgresql_data_dir | default(default_postgresql_data_dir),
                postgresql_conf_dir | default(default_postgresql_conf_dir),
                postgresql_wal_dir | default('')
              ] | reject('equalto', '') | list
            }}
          vars:
            default_postgresql_version: "{{ postgresql_version | default('18') }}"
            default_postgresql_home_dir: "{{ '/var/lib/postgresql' if ansible_os_family == 'Debian' else '/var/lib/pgsql' }}"
            default_postgresql_cluster_name: "{{ 'main' if ansible_os_family == 'Debian' else 'data' }}"
            default_postgresql_data_dir: "\
              {% if cloud_provider | default('') | length > 0 %}\
              {{ postgresql_data_dir_mount_path | default('/pgdata') }}/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% else %}\
              {{ default_postgresql_home_dir }}/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% endif %}"
            default_postgresql_conf_dir: "\
              {% if ansible_os_family == 'Debian' %}\
              /etc/postgresql/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% else %}\
              {{ default_postgresql_data_dir }}\
              {% endif %}"
          when: remove_postgres_data | default(true) | bool
      when: inventory_hostname == target_node
      tags: postgres, postgresql

    - block:
        - name: Check if ~postgres/.ssh exists
          ansible.builtin.stat:
            path: "~postgres/.ssh"
          register: postgres_ssh_dir

        - name: Read postgres public SSH key from target node
          ansible.builtin.slurp:
            src: "~postgres/.ssh/id_rsa.pub"
          delegate_to: "{{ target_node }}"
          register: target_node_pubkey
          ignore_unreachable: true
          when:
            - target_node in (groups['postgres_cluster'] | default([]))
            - target_node in (groups['removal_available_nodes'] | default([]))
            - postgres_ssh_dir.stat.exists and postgres_ssh_dir.stat.isdir

        - name: Remove target node pubkey from authorized_keys
          ansible.posix.authorized_key:
            user: postgres
            state: absent
            key: "{{ target_node_pubkey.content | default('') | b64decode }}"
          when: target_node_pubkey.content | default('') | b64decode | length > 0

        - name: Remove known_hosts entries for target node
          become: true
          become_user: postgres
          ansible.builtin.known_hosts:
            state: absent
            path: "~postgres/.ssh/known_hosts"
            name: "{{ item }}"
          loop: >-
            {{ target_node_hostvars if target_node in (groups['postgres_cluster'] | default([])) else [target_node] }}
          vars:
            target_node_hostvars: >-
              {{
                [
                  hostvars[target_node].get('bind_address',''),
                  hostvars[target_node].get('ansible_hostname',''),
                  target_node
                ] | reject('equalto','') | unique | list
              }}
      ignore_errors: true
      when: inventory_hostname != target_node
      tags: postgres, postgresql, ssh_keys

- name: vitabaks.autobase.remove_node | Remove node from etcd cluster
  hosts: etcd_cluster:&removal_available_nodes
  become: true
  gather_facts: false

  tasks:
    - block:
        - name: Show etcd cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ etcd_members_list_before.stdout | from_json }}"

        - name: Remove target node from etcd cluster
          ansible.builtin.include_role:
            name: vitabaks.autobase.etcd
            tasks_from: member_remove

        - name: Fetch etcd cluster members after removal
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            {{ etcd_bin_dir | default('/usr/local/bin') }}/etcdctl member list
            --write-out=table
            {% if etcd_tls_enable | default(true) | bool %}
            --cacert={{ etcd_tls_dir | default('/etc/etcd/tls') }}/{{ etcd_tls_ca_crt | default('ca.crt') }}
            --cert={{ etcd_tls_dir | default('/etc/etcd/tls') }}/{{ etcd_tls_server_crt | default('server.crt') }}
            --key={{ etcd_tls_dir | default('/etc/etcd/tls') }}/{{ etcd_tls_server_key | default('server.key') }}
            {% endif %}
          environment:
            ETCDCTL_API: "3"
          changed_when: false
          register: etcd_members_list_after
          until: etcd_members_list_after.rc == 0
          retries: 3
          delay: 5
          delegate_to: "{{ groups['etcd_cluster'] | intersect(groups['removal_available_nodes']) | difference([target_node]) | first }}"

        - name: Show etcd cluster members after removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ etcd_members_list_after.stdout_lines }}"
      when: dcs_type | default('etcd') == 'etcd'
      tags: etcd

- name: vitabaks.autobase.remove_node | Remove node from Consul cluster
  hosts: consul_instances:&removal_available_nodes
  become: true
  gather_facts: true
  vars:
    consul_removal_delegate: "{{ groups['consul_instances'] | intersect(groups['removal_available_nodes']) | difference([target_node]) | first }}"
    consul_http_addr: "{% if consul_tls_enable | default(true) | bool %}https{% else %}http{% endif %}://127.0.0.1:8500"
    consul_ca_flag: "{% if consul_tls_enable | default(true) | bool %}-ca-file=/etc/consul/tls/ca.crt{% endif %}"
    consul_client_flags: >-
      {% if consul_tls_enable | default(true) | bool %}
      -client-cert=/etc/consul/tls/server.crt -client-key=/etc/consul/tls/server.key
      {% endif %}
  tasks:
    - block:
        - name: Show consul cluster members before removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ consul_members_list_before.stdout_lines }}"

        - name: No target node in Consul cluster, skipping removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: >-
              Target node '{{ target_node_name }}' not found in Consul cluster members,
              skipping removal.
          when:
            - consul_members_list_before.stdout | default('') is not search(target_node_name)

        - name: Force-leave target node from consul cluster
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            consul force-leave
            -http-addr={{ consul_http_addr }}
            {{ consul_ca_flag }}
            {{ target_node_name }}
          delegate_to: "{{ consul_removal_delegate }}"
          when:
            - consul_members_list_before.stdout | default('') is search(target_node_name)

        - name: Extract target node Consul Raft ID
          run_once: true # noqa run-once
          ansible.builtin.set_fact:
            target_raft_id: >-
              {{ target_line | regex_replace('^\S+\s+([0-9a-f-]{36}).*', '\1') if target_line | length > 0 else '' }}
          vars:
            target_line: >-
              {{
                (consul_members_list_before.stdout_lines
                  | select('match', '^' ~ (target_node_name) ~ '\s+')
                  | list | first) | default('')
              }}
          when:
            - hostvars[target_node].consul_node_role | default('client') == 'server'
            - consul_members_list_before.stdout | default('') is search(target_node_name)

        - name: Remove target node from the Raft configuration
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            consul operator raft remove-peer -id="{{ target_raft_id }}"
            -http-addr={{ consul_http_addr }}
            {{ consul_ca_flag }}
            {{ consul_client_flags }}
          register: raft_remove_result
          delegate_to: "{{ consul_removal_delegate }}"
          until: raft_remove_result.rc == 0
          retries: 3
          delay: 2
          when:
            - hostvars[target_node].consul_node_role | default('client') == 'server'
            - target_raft_id | default('') | length > 0

        - name: Stop and disable consul service on target node
          ansible.builtin.service:
            name: consul
            state: stopped
            enabled: false
          when: inventory_hostname == target_node

        - name: Delete consul content on target node
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ consul_data_path | default('/var/lib/consul') }}"
            - "{{ consul_config_path | default('/etc/consul') }}"
          when:
            - inventory_hostname == target_node
            - remove_consul_data | default(true) | bool

        - name: Fetch consul cluster members after removal
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            consul operator raft list-peers
            -http-addr={{ consul_http_addr }}
            {{ consul_ca_flag }}
          changed_when: false
          register: consul_members_list_after
          delegate_to: "{{ consul_removal_delegate }}"
          until: consul_members_list_after.rc == 0
          retries: 3
          delay: 5
          when:
            - consul_members_list_before.stdout | default('') is search(target_node_name)

        - name: Show consul cluster members after removal
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ consul_members_list_after.stdout_lines }}"
          when:
            - consul_members_list_after.stdout_lines is defined
      when: dcs_type | default('etcd') == 'consul'
      tags: consul

- name: vitabaks.autobase.remove_node | Finalizing
  hosts: postgres_cluster:&removal_postgres_survivors
  become: true
  gather_facts: true
  tasks:
    - name: Update patroni config file
      ansible.builtin.include_role:
        name: vitabaks.autobase.patroni
        tasks_from: patroni # update etcd hosts
      vars:
        etcd_hosts: "{{ groups['etcd_cluster'] | default([]) | difference([target_node]) }}"
      when:
        - dcs_type | default('etcd') == 'etcd'
        - inventory_hostname != target_node
      tags: postgres, postgresql, etcd

    - name: Remove a node from pg_hba.conf on existing cluster nodes
      ansible.builtin.include_role:
        name: vitabaks.autobase.patroni
        tasks_from: pg_hba
      vars:
        pg_hba_hosts: "{{ groups['postgres_cluster'] | default([]) | difference([target_node]) }}"
      when: inventory_hostname != target_node
      tags: postgres, postgresql, pg_hba, pg_hba_generate

    - name: Remove a node from the PgDog configuration on existing cluster nodes
      ansible.builtin.include_role:
        name: vitabaks.autobase.pgdog
        tasks_from: config
      vars:
        pgdog_hosts: "{{ groups['postgres_cluster'] | default([]) | difference([target_node]) }}"
      when:
        - pgdog_install | default(false) | bool
        - inventory_hostname != target_node
      tags: pgdog, pgdog_conf

    - block:
        - name: Waiting for 20 seconds after Patroni cluster reload
          ansible.builtin.pause:
            seconds: 20

        - name: Fetch Patroni cluster members
          run_once: true # noqa run-once
          ansible.builtin.command: >-
            patronictl -c {{ patroni_config_file | default('/etc/patroni/patroni.yml') }} list
          register: patronictl_list_after
          changed_when: false
          environment:
            PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"

        - name: Show Patroni cluster members
          run_once: true # noqa run-once
          ansible.builtin.debug:
            msg: "{{ patronictl_list_after.stdout_lines }}"
      when: inventory_hostname != target_node
      tags: postgres, postgresql
