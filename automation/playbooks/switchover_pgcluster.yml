---
- name: Resolve shard topology
  ansible.builtin.import_playbook: shard_topology.yml

- name: vitabaks.autobase.switchover_pgcluster | Switchover PostgreSQL Cluster
  hosts: "postgres_cluster:&autobase_{{ target_shard | default('all') }}"
  gather_facts: true
  become: true
  become_method: sudo
  any_errors_fatal: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto
      check_mode: false
      when: ansible_facts.packages is not defined

    - name: Define bind_address
      ansible.builtin.import_role:
        name: vitabaks.autobase.bind_address
      when: bind_address is not defined

    - name: Set default variables
      ansible.builtin.import_role:
        name: vitabaks.autobase.common

    - name: "[Prepare] Get Patroni Cluster Leader Node"
      ansible.builtin.uri:
        url: >-
          {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
            | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
            | default('8008') }}/leader
        status_code: 200
        ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
      register: switchover_patroni_leader_result
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        no_proxy: "{{ patroni_bind_address | default(bind_address, true) }}"
      when:
        - (patroni_shard_hosts
            | map('extract', hostvars)
            | selectattr('patroni_leader_result.status', 'defined')
            | selectattr('patroni_leader_result.status', 'equalto', 200)
            | list | length) == 0

    - name: "[Prepare] Set Patroni leader result variable"
      ansible.builtin.set_fact:
        leader_result: >-
          {{
            switchover_patroni_leader_result
            if switchover_patroni_leader_result.status is defined
            else patroni_leader_result | default({})
          }}
      changed_when: false

    - name: The Patroni cluster is unhealthy
      ansible.builtin.fail:
        msg: >
          No healthy leader node detected in cluster '{{ patroni_scope }}'.
          Please ensure the cluster is up and node responds on REST API port ({{ patroni_restapi_port | default('8008') }}).
      when:
        - inventory_hostname == patroni_shard_hosts[0]
        - (patroni_shard_hosts
            | map('extract', hostvars)
            | selectattr('leader_result.status', 'defined')
            | selectattr('leader_result.status', 'equalto', 200)
            | list | length) == 0

    - name: '[Prepare] Add host to group "primary" (in-memory inventory)'
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: primary
        postgresql_exists: true
      when:
        - hostvars[item]['leader_result']['status'] | default(0) == 200
      loop: "{{ autobase_shards.selected }}"
      changed_when: false
      check_mode: false

    - name: '[Prepare] Add hosts to group "secondary" (in-memory inventory)'
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: secondary
        postgresql_exists: true
      when:
        - hostvars[item]['leader_result']['status'] | default(0) == 503
      loop: "{{ autobase_shards.selected }}"
      changed_when: false
      check_mode: false

    - name: Print Patroni Cluster info
      ansible.builtin.debug:
        msg:
          - "Cluster Name: {{ patroni_scope }}"
          - "Cluster Leader: {{ ansible_hostname }}"
      when:
        - groups.get('primary', []) | length > 0
        - inventory_hostname in groups['primary']

    - name: Get current Patroni passwords
      ansible.builtin.import_role:
        name: vitabaks.autobase.pre_checks
        tasks_from: passwords
      vars:
        source_group: primary
        postgresql_cluster_maintenance: true
      when: patroni_superuser_password | default('') | length < 1

    - name: Prepare PostgreSQL CLI password file
      ansible.builtin.import_role:
        name: vitabaks.autobase.pgpass
        tasks_from: automation
      when: inventory_hostname in groups['primary']

- name: vitabaks.autobase.switchover_pgcluster | Switchover Patroni leader
  hosts: "primary:&autobase_{{ target_shard | default('all') }}"
  gather_facts: false
  become: true
  become_method: sudo
  any_errors_fatal: true
  tasks:
    - name: Validate Patroni switchover candidate
      ansible.builtin.assert:
        that: >-
          patroni_switchover_candidate_name in
          (patroni_shard_replicas
          | map('extract', hostvars)
          | map(attribute='ansible_hostname')
          | list)
        fail_msg: >-
          Switchover candidate '{{ patroni_switchover_candidate_name | default('') }}' is not a Patroni replica in cluster
          '{{ patroni_scope }}'.
      when: patroni_switchover_candidate_name | default('') | length > 0

    - name: Switchover Patroni leader role
      ansible.builtin.import_role:
        name: vitabaks.autobase.patroni
        tasks_from: switchover
      when: patroni_shard_replicas | length > 0
