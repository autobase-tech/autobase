---
- name: Resolve shard topology
  ansible.builtin.import_playbook: shard_topology.yml

- name: vitabaks.autobase.remove_cluster | Remove PostgreSQL Cluster
  hosts: postgres_cluster:pgbackrest
  any_errors_fatal: true
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load cluster defaults
      ansible.builtin.import_role:
        name: vitabaks.autobase.common
    - name: Require the whole logical cluster for removal
      ansible.builtin.assert:
        that: target_shard | default('all') == 'all'
        fail_msg: Removing a shard changes the fixed topology. Use remove_node to remove a replica.
  tasks:
    - block:
        - name: Stop and disable patroni service
          ansible.builtin.service:
            name: patroni
            state: stopped
            enabled: false

        - name: Delete PostgreSQL content
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{
              [
                postgresql_data_dir | default(default_postgresql_data_dir),
                postgresql_conf_dir | default(default_postgresql_conf_dir),
                postgresql_wal_dir | default('')
              ] | reject('equalto', '') | list
            }}
          vars:
            default_postgresql_version: "{{ postgresql_version | default('18') }}"
            default_postgresql_home_dir: "{{ '/var/lib/postgresql' if ansible_os_family == 'Debian' else '/var/lib/pgsql' }}"
            default_postgresql_cluster_name: "{{ 'main' if ansible_os_family == 'Debian' else 'data' }}"
            default_postgresql_data_dir: "\
              {% if cloud_provider | default('') | length > 0 %}\
              {{ postgresql_data_dir_mount_path | default('/pgdata') }}/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% else %}\
              {{ default_postgresql_home_dir }}/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% endif %}"
            default_postgresql_conf_dir: "\
              {% if ansible_os_family == 'Debian' %}\
              /etc/postgresql/{{ default_postgresql_version }}/{{ default_postgresql_cluster_name }}\
              {% else %}\
              {{ default_postgresql_data_dir }}\
              {% endif %}"
      ignore_errors: true
      when: remove_postgres | default(false) | bool and inventory_hostname in groups['postgres_cluster']

    - name: Remove backup metadata and jobs for each local stanza
      ansible.builtin.include_role:
        name: vitabaks.autobase.pgbackrest
        tasks_from: remove_stanza
        apply:
          ignore_errors: true
      loop: "{{ autobase_shards.ids if autobase_shards.explicit and 'pgbackrest' in group_names else [shard_id | default(none)] }}"
      loop_control:
        loop_var: removal_shard
      vars:
        pgbackrest_command_user: >-
          {{ (pgbackrest_repo_user | default('postgres', true))
             if inventory_hostname in groups.get('pgbackrest', [])
             else 'postgres' }}
        patroni_scope: "{{ cluster_name ~ ('-shard' ~ removal_shard if removal_shard is not none else '') }}"
        removal_stanza: "{{ pgbackrest_stanza }}"
        default_pgbackrest_stanza: "{{ removal_stanza }}"
        default_pgbackrest_cron_jobs: "{{ [{ 'file': '/etc/cron.d/pgbackrest-' ~ default_pgbackrest_stanza }] }}"
      ignore_errors: true
      when:
        - remove_pgbackrest | default(false) | bool
        - ('pgbackrest' in groups and groups['pgbackrest'] | length > 0 and inventory_hostname in groups['pgbackrest']) or
          (('pgbackrest' not in groups or groups['pgbackrest'] | length == 0) and inventory_hostname == patroni_shard_hosts[0])

- name: vitabaks.autobase.remove_cluster | Remove Consul Cluster
  hosts: consul_instances
  become: true
  tasks:
    - block:
        - name: Stop and disable consul service
          ansible.builtin.service:
            name: consul
            state: stopped
            enabled: false

        - name: Delete consul content
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ consul_data_path | default('/var/lib/consul') }}"
            - "{{ consul_config_path | default('/etc/consul') }}"
      ignore_errors: true
      when: target_shard | default('all') == 'all' and remove_consul | default(false) | bool

- name: vitabaks.autobase.remove_cluster | Remove Etcd Cluster
  hosts: etcd_cluster
  become: true
  tasks:
    - block:
        - name: Stop and disable etcd service
          ansible.builtin.service:
            name: etcd
            state: stopped
            enabled: false

        - name: Delete etcd content
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ etcd_data_dir | default('/var/lib/etcd') }}"
            - "{{ etcd_conf_dir | default('/etc/etcd') }}"
      ignore_errors: true
      when: target_shard | default('all') == 'all' and remove_etcd | default(false) | bool
