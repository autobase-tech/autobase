---
platforms:
  - &postgres_node
    name: pgnode01
    hostname: pgnode01
    image: "${IMAGE_NAMESPACE:-geerlingguy}/docker-${IMAGE_DISTRO:-ubuntu2404}-ansible:${IMAGE_TAG:-latest}"
    networks:
      - name: test_docker_network
        ipv4_address: 10.172.0.20
    exposed_ports:
      - 22/tcp
      - 2379/tcp # if dcs_type: "etcd"
      - 2380/tcp # if dcs_type: "etcd"
      - 8300/tcp # if dcs_type: "consul"
      - 8301/tcp # if dcs_type: "consul"
      - 8302/tcp # if dcs_type: "consul"
      - 8500/tcp # if dcs_type: "consul"
      - 8600/tcp # if dcs_type: "consul"
      - 8008/tcp
      - 5432/tcp
      - 6432/tcp
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups: [postgres_cluster, master, etcd_cluster, consul_instances]

  - <<: *postgres_node
    name: pgnode02
    hostname: pgnode02
    networks:
      - name: test_docker_network
        ipv4_address: 10.172.0.21
    groups: [postgres_cluster, replica, etcd_cluster, consul_instances]

  - <<: *postgres_node
    name: pgnode03
    hostname: pgnode03
    networks:
      - name: test_docker_network
        ipv4_address: 10.172.0.22
    groups: [postgres_cluster, master, etcd_cluster, consul_instances]

  - <<: *postgres_node
    name: pgnode04
    hostname: pgnode04
    networks:
      - name: test_docker_network
        ipv4_address: 10.172.0.23
    groups: [postgres_cluster, replica, consul_instances]

provisioner:
  inventory:
    host_vars:
      pgnode01: {shard_id: 0, consul_node_role: server}
      pgnode02: {shard_id: 0, consul_node_role: server}
      pgnode03: {shard_id: 1, consul_node_role: server}
      pgnode04: {shard_id: 1, consul_node_role: client}
