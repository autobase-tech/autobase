---
# 🚀 This playbook is designed to verify the default Molecule configuration
# 🎯 The objective is to ensure that all tasks and roles are correctly set up and functioning as expected

- name: Molecule.default.verify
  hosts: all
  gather_facts: true
  vars: &pgdog_test_vars
    # Variable tests can override postgresql_version. Use the version installed by converge.
    pgdog_test_psql: "{{ '/usr/lib/postgresql/' ~ test_postgresql_version ~ '/bin/psql' if ansible_os_family == 'Debian'
      else '/usr/pgsql-' ~ test_postgresql_version ~ '/bin/psql' }}"
    pgdog_test_uri: "postgresql://db1_user@127.0.0.1:6432/db1?sslmode=require&connect_timeout=10"
  pre_tasks:
    - name: Gather network facts
      ansible.builtin.setup:
        gather_subset:
          - network
      when: ansible_all_ipv4_addresses is not defined

    # Get docker0 interface IP if it exists
    - name: Get docker0 interface IP
      ansible.builtin.set_fact:
        docker0_ip: "{{ ansible_docker0.ipv4.address | default('') }}"
      when: ansible_docker0 is defined and ansible_docker0.ipv4 is defined

    # Define bind_address for each host (first private IPv4, excluding docker0), unless set in inventory.
    - name: Expose bind_address as facts
      ansible.builtin.set_fact:
        bind_address: >-
          {{
            (ansible_all_ipv4_addresses | ansible.utils.ipaddr('private') | reject('equalto', docker0_ip | default('')) | list)[0] |
            default((ansible_all_ipv4_addresses | ansible.utils.ipaddr('private'))[0], true)
          }}
      when: bind_address is not defined

  tasks:
    # 📝 Including the common variables for the Molecule default configuration
    # This file contains all the necessary variables for the playbook
    - name: Molecule.default.verify | Include Common Variables
      ansible.builtin.include_vars:
        file: ../../roles/common/defaults/main.yml

    # Including the test variables redefined in converge.yml
    - name: Molecule.default.verify | Include Test Variables
      ansible.builtin.include_vars:
        file: ../../test_vars.yml

    # 🔄 Including all tests for the Molecule default configuration
    # These tests ensure that all components of the configuration are functioning correctly
    - name: Molecule.default.verify | Include All Tests
      ansible.builtin.include_tasks: "{{ item }}"
      with_fileglob:
        - ../tests/variables/main.yml
        - ../tests/etcd/*.yml
        - ../tests/patroni/*.yml
        - ../tests/postgres/*.yml
        - ../tests/roles/deploy_finish/main.yml
        - ../tests/roles/patroni/main.yml
        - ../tests/roles/pre_checks/main.yml
        - ../tests/roles/prometheus_exporters/main.yml
        - ../tests/roles/swap/main.yml
        - ../tests/roles/pgdog/main.yml

- name: Switch leadership on shard1
  ansible.builtin.import_playbook: ../../playbooks/switchover_pgcluster.yml
  vars:
    target_shard: 1

- name: Verify scoped switchover and PgDog writes
  hosts: postgres_cluster
  gather_facts: false
  vars: *pgdog_test_vars
  tasks:
    - name: Verify that only shard1 changed leaders
      ansible.builtin.uri:
        url: "{{ patroni_restapi_protocol }}://{{ bind_address }}:{{ patroni_restapi_port }}/leader"
        ca_path: "{{ patroni_restapi_cafile | default(omit) }}"
        status_code: "{{ expected_status }}"
      vars:
        expected_status: "{{ patroni_response.status if shard_id == 0 else (503 if patroni_response.status == 200 else 200) }}"
      register: leader_after_switchover
      until: leader_after_switchover.status == expected_status
      retries: 12
      delay: 2

    - name: Write to shard1 through PgDog on the former leader
      ansible.builtin.command: >-
        {{ pgdog_test_psql }} {{ pgdog_test_uri }} -XAt -v ON_ERROR_STOP=1
        -c "UPDATE pgdog_test SET updated = true WHERE tenant_id = {{ placement.stdout }} RETURNING updated"
      environment:
        PGPASSWORD: "db1_user-test-pass"
      register: write_after_switchover
      until: write_after_switchover.rc == 0 and 't' in write_after_switchover.stdout_lines
      retries: 12
      delay: 5
      when: shard_id == 1 and patroni_response.status == 200
