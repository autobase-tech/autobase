---
- name: Converge
  hosts: all
  gather_facts: true

  tasks:
    - name: Set variables for PgDog deployment test
      ansible.builtin.set_fact:
        ansible_become_method: su # Override become_method
        firewall_enabled_at_boot: false
        firewall_enable_ipv6: false # to prevent test failures in CI
        swap_file_create: false # to prevent test failures in CI
        sysctl_set: false # to prevent test failures in CI
        chronyd_ignore_errors: true # to prevent failures in CI
        nameservers: ["8.8.8.8", "9.9.9.9"]
        timezone: "Etc/UTC"
        pgdog_install: true
        pgbouncer_install: false
        with_haproxy_load_balancing: false
        netdata_install: false
        dcs_type: etcd
        # These containers are privileged: Patroni would use the hardware watchdog of the host,
        # which resets the host when the leader container is destroyed.
        patroni_watchdog_mode: "off"
        patroni_watchdog_configure_softdog: false
        postgresql_version: 17 # redefine the version to install for the upgrade test
        pg_old_version: 17
        pg_new_version: 18
        postgresql_users:
          - { name: "db1_user", password: "db1_user-test-pass" }
        postgresql_databases:
          - { db: "db1", encoding: "UTF8", lc_collate: "en_US.UTF-8", lc_ctype: "en_US.UTF-8", owner: "db1_user" }
        # Use low memory settings to allow testing on machines with limited RAM (e.g. 8 GB).
        local_postgresql_parameters:
          - { option: "shared_buffers", value: "128MB" }
          - { option: "effective_cache_size", value: "512MB" }
        cacheable: true
      delegate_to: localhost
      run_once: true # noqa run-once

    - name: Update all system packages
      ansible.builtin.include_role:
        name: ../../roles/update
        tasks_from: system

    # The upgrade role copies the data to the replicas with rsync over ssh
    - name: Install openssh-server package
      become: true
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Start ssh service
      become: true
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: true

    - name: Delete "/run/nologin" file (if exists)
      become: true
      ansible.builtin.file:
        path: /run/nologin
        state: absent

- name: Deploy PostgreSQL Cluster
  ansible.builtin.import_playbook: ../../playbooks/deploy_pgcluster.yml

- name: PostgreSQL upgrade test (with the PgDog maintenance mode)
  ansible.builtin.import_playbook: ../../playbooks/pg_upgrade.yml
