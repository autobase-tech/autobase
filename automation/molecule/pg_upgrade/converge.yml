---
- name: Converge
  hosts: all
  gather_facts: true

  tasks:
    # PgDog replaces both PgBouncer and HAProxy. Its binaries require glibc 2.39 or newer.
    - name: Set variables for the connection pooler test (randomly PgBouncer or PgDog)
      ansible.builtin.set_fact:
        pgdog_install: true # "{{ ([true, false] | random) if pgdog_supported_os | bool else false }}"
        cacheable: true
      vars:
        pgdog_supported_os: >-
          {{ (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))
          or (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)
          or (ansible_os_family == 'RedHat' and ansible_distribution_major_version | int >= 10) }}
      delegate_to: localhost
      run_once: true # noqa run-once

    - name: Set variables for Patroni cluster deployment test
      ansible.builtin.set_fact:
        ansible_become_method: su # Override become_method
        firewall_enabled_at_boot: false
        firewall_enable_ipv6: false # to prevent test failures in CI
        swap_file_create: false # to prevent test failures in CI
        sysctl_set: false # to prevent test failures in CI
        chronyd_ignore_errors: true # to prevent failures in CI
        nameservers: ["8.8.8.8", "9.9.9.9"]
        timezone: "Etc/UTC"
        pgbouncer_install: "{{ not pgdog_install | bool }}"
        with_haproxy_load_balancing: "{{ not pgdog_install | bool }}"
        dcs_type: "{{ 'etcd' if ansible_distribution_major_version in ['10'] or ansible_distribution_release in ['trixie']
          else (['etcd', 'consul'] | random) }}" # TODO: Consul support for RHEL 10, Debian 13
        consul_node_role: server # if dcs_type: "consul"
        postgresql_version: 17 # redefine the version to install for the upgrade test
        pgbouncer_processes: 4 # Test multiple pgbouncer processes (so_reuseport)
        # Use low memory settings to allow testing on machines with limited RAM (e.g. 8 GB).
        # 128MB shared_buffers and 512MB effective_cache_size are safe minimums for a
        # functional test cluster; production sizing should use the defaults (25%/75% of RAM).
        local_postgresql_parameters:
          - { option: "shared_buffers", value: "128MB" }
          - { option: "effective_cache_size", value: "512MB" }
        cacheable: true
      delegate_to: localhost
      run_once: true # noqa run-once

    # Extension Auto-Setup
    - name: Set variables for Extensions test
      ansible.builtin.set_fact:
        enable_timescale: true
        enable_pg_repack: true
        enable_pg_cron: true
        enable_pgaudit: true
        enable_pgvector: true
        enable_postgis: true
        enable_pgrouting: true
        enable_pg_wait_sampling: true
        enable_pg_stat_kcache: true
        enable_pg_partman: true
        enable_pgvectorscale: "{{ true if ansible_os_family == 'Debian' else false }}" # pgvectorscale packages are available only for Debian-based disros.
        # create extension
        postgresql_extensions:
          - { ext: "vector", db: "postgres" }
        #  - { ext: "vectorscale", db: "postgres" }

    # Consul package for OracleLinux missing in HashiCorp repository
    # Only the installation of a binary file is supported
    - name: "Set variables: 'consul_install_from_repo: false' and 'patroni_installation_method: pip'"
      ansible.builtin.set_fact:
        consul_install_from_repo: false # whether to install consul from repository as opposed to installing the binary directly
        patroni_installation_method: "pip" # the "rpm" method is supported only for consul installed from the repository
      when:
        - dcs_type == "consul"
        - ansible_distribution == "OracleLinux"

    - name: Set variables for custom PostgreSQL data and WAL directory test
      ansible.builtin.set_fact:
        postgresql_data_dir: "/pgdata/{{ postgresql_version }}/main"
        postgresql_wal_dir: "/pgwal/{{ postgresql_version }}/pg_wal"

    - name: Set variables for PostgreSQL upgrade test
      ansible.builtin.set_fact:
        pg_old_version: 17
        pg_new_version: 18

    - name: Add repository GPG key
      ansible.builtin.command: "rpm --import https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-{{ ansible_distribution_major_version }}"
      when: ansible_distribution == "AlmaLinux"

    - name: Update all system packages
      ansible.builtin.include_role:
        name: ../../roles/update
        tasks_from: system

    - name: Install openssh-server package
      become: true
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Start ssh service
      become: true
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: true

    - name: Delete "/run/nologin" file (if exists)
      become: true
      ansible.builtin.file:
        path: /run/nologin
        state: absent

- name: Deploy PostgreSQL Cluster
  ansible.builtin.import_playbook: ../../playbooks/deploy_pgcluster.yml

- name: PostgreSQL upgrade test
  ansible.builtin.import_playbook: ../../playbooks/pg_upgrade.yml
