---
- name: Check Patroni status
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
        | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
        | default('8008') }}/leader
    method: GET
    return_content: true
    status_code: [200, 503]
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_response
  failed_when: "'running' not in patroni_response.json.state"

- name: Check Patroni dynamic config
  ansible.builtin.uri:
    url: >-
      {{ patroni_restapi_protocol | default('https') }}://{{ patroni_restapi_connect_addr
        | default(patroni_bind_address | default(bind_address, true), true) }}:{{ patroni_restapi_port
        | default('8008') }}/config
    method: GET
    return_content: true
    ca_path: "{{ patroni_restapi_cafile | default(omit, true) }}"
  register: patroni_config_response

- name: Verify the Patroni scope and dynamic configuration of each shard
  ansible.builtin.assert:
    that:
      - patroni_response.json.patroni.scope == 'test-pgcluster-shard' ~ shard_id
      - patroni_config_response.json.failsafe_mode | default(false) | bool
