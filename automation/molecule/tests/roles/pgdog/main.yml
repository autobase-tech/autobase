---
- name: Verify the shared PgDog endpoint
  become: true
  environment:
    PGPASSWORD: "db1_user-test-pass"
  block:
    - name: Check that the pgdog service is running
      ansible.builtin.systemd:
        name: pgdog
      register: pgdog_service
      failed_when: pgdog_service.status.ActiveState != "active"

    - name: Check that PgBouncer and HAProxy are not installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/pgbouncer.service
        - /etc/haproxy/haproxy.cfg
      register: replaced_services
      failed_when: replaced_services.stat.exists

    - name: Create the sharded table and insert rows through PgDog
      ansible.builtin.command:
        argv: ["{{ pgdog_test_psql }}", "{{ pgdog_test_uri }}", -X, -v, ON_ERROR_STOP=1]
        stdin: |
          CREATE TABLE pgdog_test (tenant_id bigint PRIMARY KEY, updated boolean DEFAULT false);
          {% for tenant in range(1, 17) %}
          INSERT INTO pgdog_test (tenant_id) VALUES ({{ tenant }});
          {% endfor %}
      run_once: true # noqa run-once

    - name: Verify row placement directly on the primary of each shard
      ansible.builtin.command:
        argv: ["{{ pgdog_test_psql }}", -h, "127.0.0.1", -U, db1_user, -d, db1, -qXAt, -v, ON_ERROR_STOP=1]
        stdin: |
          CREATE TEMP TABLE partition_probe (tenant_id bigint) PARTITION BY HASH (tenant_id);
          SELECT min(tenant_id)
          FROM pgdog_test
          HAVING bool_and(satisfies_hash_partition('partition_probe'::regclass, 2, {{ shard_id }}, tenant_id));
      register: placement
      changed_when: false
      failed_when: placement.rc != 0 or placement.stdout is not match('^[0-9]+$')
      when: patroni_response.status == 200

    - name: Read all rows through each PgDog instance
      ansible.builtin.command: "{{ pgdog_test_psql }} {{ pgdog_test_uri }} -XAt -c 'SELECT count(*) FROM pgdog_test'"
      register: routed
      until: routed.rc == 0 and routed.stdout == '16'
      retries: 12
      delay: 5
      changed_when: false

    - name: Check that a wrong password is rejected
      ansible.builtin.command: >-
        {{ pgdog_test_psql }} "{{ pgdog_test_uri }}" -tAXc "SELECT 1"
      environment:
        PGPASSWORD: "wrong-password"
      register: wrong_password_result
      changed_when: false
      failed_when: wrong_password_result.rc == 0

    - name: Check that the clients are required to use TLS
      ansible.builtin.command: >-
        {{ pgdog_test_psql }} "postgresql://db1_user@127.0.0.1:6432/db1?sslmode=disable&connect_timeout=10" -tAXc "SELECT 1"
      register: no_tls_result
      changed_when: false
      failed_when: no_tls_result.rc == 0
